# Сборка и юнит-тесты на каждый push и PR: локально полный набор (~1000 тестов, Robolectric и
# Roborazzi) гоняется редко, а сабмишн обещает тесты — пусть их держит зелёными CI.
# Ключей здесь нет: секретный плагин берёт плейсхолдеры из .env.example, и ни один тест в сеть не ходит.
name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Roborazzi в verify-режиме сверяет скриншоты с эталонами из app/src/test/screenshots.
      - name: Unit tests (JVM, Robolectric, Roborazzi verify)
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.verify=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
          retention-days: 7

# Build and unit tests on every push and PR: locally the full suite (~1000 tests, Robolectric and
# Roborazzi) runs rarely, and the submission promises tests — so CI keeps them green.
# No keys here: the secrets plugin takes the placeholders from .env.example, and no test goes to the network.
name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Roborazzi in verify mode compares screenshots with the baselines in app/src/test/screenshots.
      - name: Unit tests (JVM, Robolectric, Roborazzi verify)
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.verify=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
          retention-days: 7

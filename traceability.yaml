# traceability.yaml -- manual source of truth (edit by hand).
# Each feature has a FROZEN id, a human title, and most importantly WHY it
# exists (rationale). The code<->feature map is derived by `traxer scan` and is
# NOT stored here. spec: ссылается на раздел ТЗ.
#
# --- Оглавление ТЗ (раскидано по файлам в корне репо — это нормально, не сводим в один) ---
#   TZ.md                    v0.2  база/процесс: персоны, MCP-тулы, память, LLM-интеграция, фон, уведомления.
#                                  spec: "TZ.md#N" во фичах ниже ссылается сюда. §5 (Driven UI/DivKit) — устарел,
#                                  см. TZ_v05 вместо него.
#   TZ_v04_DivKit.md         v0.4  ОТЛОЖЕН до v2 (решение 2026-06-15) — серверный DivKit-пайплайн. Только референс.
#   TZ_v05_widgets_apps.md   v0.5  СОГЛАСОВАН (2026-06-15) — актуальный Driven UI v1: клиентские виджеты
#                                  (render_card, без изменений) + апы-композиции (НЕ начаты в коде на 2026-06-30).
#   TZ_v06_chat_projects.md  v0.6  ЧЕРНОВИК, не согласован — чат-проекты (языковой/аи-тренер), Архетип 3.
#   TZ_v07_block_library.md  v0.7  ЧЕРНОВИК, не согласован, правлен последним (2026-06-23) — фундамент модели
#                                  данных под Driven UI; TZ_v05/v06 описаны как частные случаи этого.
lang: ru              # spec-draft language: de|en|es|fr|it|ru
features:
  - id: streaming-llm-chat-6595a1
    title: "Стриминг-чат с LLM"
    rationale: "Стримить ответы от OpenAI-совместимого LLM по Ktor SSE, с фолбэком между провайдерами (фолбэк запрещён после первого эмита, чтобы в чат не попал обрывок). encodeDefaults=true обязателен — иначе строгие провайдеры дают HTTP 400 «missing field type». Reasoning-модели отдают ответ в reasoning_content: если content так и не пришёл, отдаём размышление как ответ, чтобы ход не закончился пустым экраном."
    spec: "TZ.md#10"
    flows: [chat]
  - id: classic-typography-a44c05
    title: "Классическая типографика"
    rationale: "Засечный переменный Lora (с кириллицей) для крупных заголовков даёт академический характер UI; текст и подписи — системным гротеском. Веса через FontVariation, на API < 26 — базовое начертание."
  - id: agent-memory-05e545
    title: "Память агента"
    rationale: "Хранить короткую/длинную/эпизодическую память в Room, чтобы восстанавливать сессию и вспоминать контекст."
    spec: "TZ.md#8"
  - id: mcp-tools-f77d9b
    title: "MCP-тулы"
    rationale: "Дать агенту стандартный набор инструментов (файлы, уведомления, БД, web) через MCP."
    spec: "TZ.md#9"
  - id: driven-ui-cards-0418d0
    title: "Driven UI карточки"
    rationale: "Позволить LLM рендерить UI-карточки (todo/таблица/погода/график/таймер/форма/картинка) прямо в чате через render_card. Картинка (template image) грузится Coil-ом: SVG и растр, ассет первым (оффлайн) с фоллбеком на URL. Тот же движок рисует интерактивные карточки уроков: reveal/concept/example (отображение) и fill/sort/match/scenario (проверка ответа, продвигают урок как пройденный квиз)."
    spec: "TZ_v05_widgets_apps.md#1"
  - id: swappable-persona-e5e65e
    title: "Сменяемая персона"
    rationale: "Дать юзеру переключать одну из 7 персон в Settings без перекомпиляции."
    spec: "TZ.md#3"
  - id: background-tasks-15a34a
    title: "Фоновые задачи"
    rationale: "Выполнять отложенные и фоновые задачи через WorkManager."
    spec: "TZ.md#14"
  - id: ai-academy-onboarding-5d51bb
    title: "AI Academy / онбординг"
    rationale: "Онбординг: «путь агента» (упорядоченный список уроков-концепций, порядок педагогический) и выбор персоны. Порядок задаётся в коде (ROADMAP_LEVELS + LIBRARY_LESSON_IDS, держатся в синхроне). Реализовано сверх исходного ТЗ."
  - id: multi-chat-conversations-b3c93b
    title: "Мульти-чат"
    rationale: "Список диалогов и переключение между ними (реализовано сверх исходного ТЗ)."
  - id: rezhimy-agenta-plan-i-goal-ee2361
    title: "Режимы агента: план-мод и гоал-мод"
    rationale: "План-мод — гейт «сначала план, ждём одобрения, потом выполнение» (инструменты отключены до «ок»); гоал-мод — петля ReAct с самопроверкой и лимитом витков. Через препромпт и UI."
    flows: [chat]
  - id: uroki-kontseptsii-v-chate-po-json-kontraktu-0a70c2
    title: "Уроки-концепции в чате (JSON-контракт)"
    rationale: "JSON-уроки (assets/lessons) драйвит чат-контроллер как строгий шаговый контракт (1 шаг = 1 сообщение ассистента): код ведёт шаги, отделяя их от команд LLM. Типы шагов: text, quiz, image (SVG/растр; asset|imageKey первым, фоллбек на URL), и интерактивные reveal/concept/example/fill/sort/match/scenario. Открываются из Библиотеки."
    flows: [chat]
  - id: voice-input-1a0dfd
    title: "Голосовой ввод и ассистент"
    rationale: "Распознавание речи и интеграция с системным ассистентом (Assist API), чтобы диктовать запросы голосом и вызывать агента из любого экрана."
    flows: [chat]
  - id: agent-skills-7189cc
    title: "Навыки агента (skill-паки)"
    rationale: "Подгружаемые навыки (бюджет, дневник, фитнес, языки) из ассетов через LoadSkillTool: расширять поведение агента без перекомпиляции."
  - id: multi-agent-orchestration-27b8e3
    title: "Мульти-агентная оркестрация"
    rationale: "Демонстрация многоагентных схем. Живой путь: предметные мини-агенты-специалисты со своим скоупом инструментов (бюджет, языки, задачи, напоминания, нутрициология, дневник) — через roster в AgentsScreen. PlanExecuteOrchestrator (планировщик→исполнитель→синтезатор поверх общего ReAct-движка) реализован, но сейчас НЕ подключён ни к одному UI-входу — инжектится в ChatViewModel, но runAgent его не вызывает (план-мод теперь идёт через agentMode-гейт в ReactLoopRunner, см. rezhimy-agenta-plan-i-goal-ee2361). Код остаётся как задел на будущее."
    flows: [chat]
  - id: app-settings-beb470
    title: "Настройки приложения"
    rationale: "Экран настроек: API-ключи, выбор провайдера, персона, лимит витков гоал-мода, разрешения интеграций — в зашифрованном виде на устройстве."

# exists (rationale). The code<->feature map is derived by `traxer scan` and is
# NOT stored here. spec: ссылается на раздел ТЗ.
#
# --- Оглавление ТЗ (раскидано по файлам в корне репо — это нормально, не сводим в один) ---
#   TZ.md                    v0.2  база/процесс: персоны, MCP-тулы, память, LLM-интеграция, фон, уведомления.
#                                  spec: "TZ.md#N" во фичах ниже ссылается сюда. §5 (Driven UI/DivKit) — устарел,
#                                  см. TZ_v05 вместо него.
#   TZ_v04_DivKit.md         v0.4  ОТЛОЖЕН до v2 (решение 2026-06-15) — серверный DivKit-пайплайн. Только референс.
#   TZ_v05_widgets_apps.md   v0.5  СОГЛАСОВАН (2026-06-15) — актуальный Driven UI v1: клиентские виджеты
#                                  (render_card, без изменений) + апы-композиции (НЕ начаты в коде на 2026-06-30).
#   TZ_v06_chat_projects.md  v0.6  ЧЕРНОВИК, не согласован — чат-проекты (языковой/аи-тренер), Архетип 3.
#   TZ_v07_block_library.md  v0.7  ЧЕРНОВИК, не согласован, правлен последним (2026-06-23) — фундамент модели
#                                  данных под Driven UI; TZ_v05/v06 описаны как частные случаи этого.
lang: ru              # spec-draft language: de|en|es|fr|it|ru
features:
  - id: streaming-llm-chat-6595a1
    title: "Стриминг-чат с LLM"
    rationale: "Стримить ответы от OpenAI-совместимого LLM по Ktor SSE, с фолбэком между моделями выбранного провайдера (кросс-провайдерного фолбэка нет — см. vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53; фолбэк запрещён после первого эмита, чтобы в чат не попал обрывок). encodeDefaults=true обязателен — иначе строгие провайдеры дают HTTP 400 «missing field type». Reasoning-модели отдают ответ в reasoning_content: если content так и не пришёл, отдаём размышление как ответ, чтобы ход не закончился пустым экраном. Пустой ответ ответом не считается: HTTP 200 без единого токена (так NIM отдаёт деградировавшую модель) уводит на следующую модель — иначе ход умирает пустым сообщением, имея в цепочке живые модели. Терминальный Finish поэтому придерживается до конца попытки: иначе фолбэк протолкнул бы потребителю конец хода раньше настоящего ответа. Движок Ktor инъектится, потому что цепочку моделей нельзя покрыть тестом, не подменив транспорт."
    spec: "TZ.md#10"
    flows: [chat]
  - id: vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53
    title: "Выбор провайдера и живой каталог моделей"
    rationale: "Пользователь сам решает, к какому вендору уходят его запросы: NIM или OpenRouter, переключателем в Настройках. Кросс-провайдерного автофолбэка нет вообще — прежний AUTO (NIM→GROQ→GITHUB) молча уводил запрос к другому вендору и по другому прайсу; GROQ и GITHUB при этом никогда не были подключены к ходу агента и висели настройками без эффекта, поэтому удалены. Фолбэк остался только МЕЖДУ МОДЕЛЯМИ выбранного провайдера — он не меняет ни адресата данных, ни прайс — и ограничен пятью попытками: после трёх отказов дело уже не в модели, а в ключе или сети, а у OpenRouter каталог на сотни моделей. Каталог OpenRouter тянется с /api/v1/models и кешируется файлом в filesDir (не таблицей в Room: это документ, который заменяется целиком, а схема БД до релиза живёт на fallbackToDestructiveMigration — таблица ради кеша стоила бы пользователю всех диалогов при обновлении). Ассет остаётся сидом на первый запуск и офлайн. В выбор попадают только модели с function calling: без tools агентский луп и план-движок молча вырождаются, и выглядит это как «агент отупел», а не как неверная настройка. Провайдер читается из настроек на каждом ходе, включая фоновые heartbeat'ы — иначе напоминалки уходили бы к вендору, от которого пользователь ушёл."
    flows: [chat]
  - id: classic-typography-a44c05
    title: "Классическая типографика"
    rationale: "Засечный переменный Lora (с кириллицей) для крупных заголовков даёт академический характер UI; текст и подписи — системным гротеском. Веса через FontVariation, на API < 26 — базовое начертание."
  - id: agent-memory-05e545
    title: "Память агента"
    rationale: "Хранить короткую/длинную/эпизодическую память в Room, чтобы восстанавливать сессию и вспоминать контекст."
    spec: "TZ.md#8"
  - id: mcp-tools-f77d9b
    title: "MCP-тулы"
    rationale: "Дать агенту стандартный набор инструментов (файлы, уведомления, БД, web) через MCP."
    spec: "TZ.md#9"
  - id: driven-ui-cards-0418d0
    title: "Driven UI карточки"
    rationale: "Позволить LLM рендерить UI-карточки (todo/таблица/погода/график/таймер/форма/картинка) прямо в чате через render_card. Картинка (template image) грузится Coil-ом: SVG и растр, ассет первым (оффлайн) с фоллбеком на URL. Тот же движок рисует интерактивные карточки уроков: reveal/concept/example (отображение) и fill/sort/match/scenario (проверка ответа, продвигают урок как пройденный квиз)."
    spec: "TZ_v05_widgets_apps.md#1"
  - id: swappable-persona-e5e65e
    title: "Сменяемая персона"
    rationale: "Дать юзеру переключать одну из 7 персон в Settings без перекомпиляции."
    spec: "TZ.md#3"
  - id: background-tasks-15a34a
    title: "Фоновые задачи"
    rationale: "Выполнять отложенные и фоновые задачи через WorkManager."
    spec: "TZ.md#14"
  - id: ai-academy-onboarding-5d51bb
    title: "AI Academy / онбординг"
    rationale: "Онбординг: «путь агента» (упорядоченный список уроков-концепций, порядок педагогический) и выбор персоны. Порядок задаётся в коде (ROADMAP_LEVELS + LIBRARY_LESSON_IDS, держатся в синхроне). Реализовано сверх исходного ТЗ."
  - id: multi-chat-conversations-b3c93b
    title: "Мульти-чат"
    rationale: "Список диалогов и переключение между ними (реализовано сверх исходного ТЗ)."
  - id: rezhimy-agenta-plan-i-goal-ee2361
    title: "Режимы агента: план-мод и гоал-мод"
    rationale: "План-мод — гейт «сначала план, ждём одобрения, потом выполнение» (инструменты отключены до «ок»); гоал-мод — петля ReAct с самопроверкой и лимитом витков. Через препромпт и UI."
    flows: [chat]
  - id: rezhim-refleksii-fca3c4
    title: "Режим агента: рефлексия"
    rationale: "Рефлексия — режим AgentMode.REFLECT: отдельный оркестратор (ReflectionOrchestrator) крутит цикл черновик → критика → итог поверх ReactLoopRunner, чтобы улучшить качество ответа. Не гейт/петля, как план/гоал, а самостоятельный 3-фазный проход."
    flows: [chat]
  - id: uroki-kontseptsii-v-chate-po-json-kontraktu-0a70c2
    title: "Уроки-концепции в чате (JSON-контракт)"
    rationale: "JSON-уроки (assets/lessons) драйвит чат-контроллер как строгий шаговый контракт (1 шаг = 1 сообщение ассистента): код ведёт шаги, отделяя их от команд LLM. Типы шагов: text, quiz, image (SVG/растр; asset|imageKey первым, фоллбек на URL), и интерактивные reveal/concept/example/fill/sort/match/scenario. Открываются из Библиотеки."
    flows: [chat]
  - id: voice-input-1a0dfd
    title: "Голосовой ввод и ассистент"
    rationale: "Распознавание речи и интеграция с системным ассистентом (Assist API), чтобы диктовать запросы голосом и вызывать агента из любого экрана."
    flows: [chat]
  - id: agent-skills-7189cc
    title: "Навыки агента (skill-паки)"
    rationale: "Подгружаемые навыки (бюджет, дневник, фитнес, языки) из ассетов через LoadSkillTool: расширять поведение агента без перекомпиляции."
  - id: multi-agent-orchestration-27b8e3
    title: "Мульти-агентная оркестрация"
    rationale: "Демонстрация многоагентных схем. Живой путь: предметные мини-агенты-специалисты со своим скоупом инструментов (бюджет, языки, задачи, напоминания, нутрициология, дневник) — через roster в AgentsScreen. PlanExecuteOrchestrator (планировщик→исполнитель→синтезатор) удалён из mvp 2026-07-10 как неподключённый ни к одному входу; код остался в git-истории и на ветке feature/plan-execute."
    flows: [chat]
  - id: app-settings-beb470
    title: "Настройки приложения"
    rationale: "Экран настроек: API-ключи, выбор провайдера, персона, лимит витков гоал-мода, разрешения интеграций — в зашифрованном виде на устройстве."
  - id: yazykovoy-agent-repetitor-s-intervalnymi-povtoreniyami-4a9360
    title: "Языковой агент-репетитор (SRS)"
    rationale: "Мини-агент «Репетитор» для изучения языков поверх мультиагентного ростера. Слова — через srs_tool: интервалы и даты повторений считает код (SrsScheduler, покрыт тестом), а не LLM, чтобы модель не портила колоду арифметикой дат. Персистентное состояние агента (цель goal:languages, уровень lang:*, слабые места grammar:*) детерминированно подмешивается в препромпт по префиксам ключей из роли агента. Учебный план ставится через план-мод."
    flows: [chat]
  - id: heartbeat-napominalki-agenta-5f0442
    title: "Heartbeat/напоминалки агента"
    rationale: "Дать агенту проактивность: отложенные пуши-напоминалки и периодические фоновые пробуждения (heartbeat), где агент сам решает, беспокоить ли юзера (паттерн HEARTBEAT_OK). Через WorkManager, реестр в Room, живая карточка в чате."
    flows: [chat]
  - id: fonovye-hody-agenta-dde42d
    title: "Фоновые ходы агента (TurnManager)"
    rationale: "Ход агента (стрим + тул-луп + запись ответа) не должен умирать вместе с экраном чата: appScope-синглтон TurnManager держит по сессии на диалог, экран лишь проецирует состояние. Параллельность между диалогами, пуш при завершении в фоне. С 2026-07-28 ход, начатый с экрана, дополнительно защищён foreground-сервисом (shortService) на время исполнения — свёрнутое приложение больше не теряет ответ; по системному таймауту ход валится с «Повторить», но только в фоне (на экране резать нечего). Force-stop и перезагрузку ход по-прежнему не переживает."
    flows: [chat]
  - id: glass-design-system-21a3fe
    title: "Glass-дизайн-система (глассморфизм)"
    rationale: "Переиспользуемый glass-слой (Haze 1.7.2 backdrop-blur + токены + аурора-фон + GlassSurface/GlassCard). Вся Haze-поверхность изолирована в GlassSurface.kt, чтобы смена версии Haze не растекалась по экранам. Сильное стекло (blur) — только на неподвижной обвязке; слабое (tint без blur) — безопасно в LazyColumn, чтобы не вернуть лаги стрима чата."
  - id: agent-inspector-6e41eb
    title: "Инспектор агента (read-mostly) — SUPERSEDED Task 21"
    rationale: "Glass-лист (ModalBottomSheet) поверх «Тулов» показывал реальный скоуп мини-агента (тулы/навык/heartbeat/области состояния/препромпт) + личные файлы агента из его собственной песочницы (filesDir/agents/{id}, см. user-agent-builder-848153 Task 6) — read-only, чтобы юзер видел, на что агент способен и что настроено, ДО открытия чата. Данные детерминированно из MiniAgentCatalog + HeartbeatDao.observeActiveByAgent + AgentFilesRepository (не через ToolExecutor). SUPERSEDED (Task 21, user-agent-builder-848153): неудобно скроллить внутри шторки, счётчики вместо реальных списков, препромпт не разворачивается — AgentInspectorSheet/AgentInspectorViewModel удалены целиком; их логика перенесена и расширена в полноэкранный com.aiopenpocket.ui.agents.detail.AgentDetailScreen/AgentDetailViewModel (маршрут agent/{agentId}), который вдобавок показывает РЕАЛЬНЫЕ хуки агента + журнал срабатываний (Task 8) вместо прежних фейковых on_tool_call/pre_message-стабов. Id оставлен как есть (frozen, история) — `traxer check` ожидаемо покажет «feature has no code» для него, это не баг."
    flows: [chat]
  - id: user-agent-builder-848153
    title: "User agent builder"
    rationale: "Замкнуть обучение AI Academy в пользовательский результат: безопасно собрать, проверить, сохранить и запустить собственного scoped агента без изменения кода. Preset-каталог остаётся read-only Kotlin; custom agents/skills/hooks — в Room, объединяются с presets через AgentResolver; runtime получает immutable AgentDefinition snapshot, code-enforced ExecutionPolicy (Preview блокирует side effects), per-agent memory/file namespaces и декларативный HookEngine."
    flows: [chat]
  - id: structured-plan-engine-907066
    title: "Structured Plan Engine (Фаза B)"
    rationale: "Заменяет prompt-only PLAN/GOAL (старый id rezhimy-agenta-plan-i-goal-ee2361, полностью удалён Task 15 — коммит e50fc70) общим структурированным механизмом планирования/исполнения/проверки — для разовой задачи (SINGLE_RUN) и долгой программы (PROGRAM) одна persisted Plan-сущность с версией, approval-гейтом на создание/существенную правку и evidence-based завершением (голого «готово» от LLM недостаточно). Дизайн: docs/superpowers/specs/2026-07-12-structured-plan-engine-design.md; план реализации (Tasks 10-18 объединённого плана / Tasks 1-16 docs/superpowers/plans/2026-07-12-structured-plan-automation.md): docs/superpowers/plans/2026-07-12-agents-platform.md. Ключевые гарантии безопасности как реализовано: PLAN получает только internal control schemas (submit_plan/propose_plan_revision/request_plan_information), НИКОГДА action tools — они не регистрируются в ToolRegistry; approval — typed PlanCommands.approve(planId, version) от реального ChatIntent, не chat-сообщение; approved PlanVersion неизменяема, material revision (objective/constraints/criteria/steps/dependsOn/expectedTools/schedule/completionRule — PlanChangeClassifier) всегда создаёт новую version и возвращает план в AWAITING_APPROVAL, пока старая approved версия продолжает исполняться; шаг GOAL исполняется в agent.toolNames ∩ step.expectedTools ∩ ExecutionPolicy; required criterion не закрывается без persisted PlanEvidence (PlanVerifier; MODEL_ASSESSMENT никогда не проверяет детерминированный критерий — DeterministicVerifierRegistry.check бросает на этом типе); декларативные plan-hooks (ON_PLAN_CREATED/ON_PLAN_APPROVED/BEFORE_PLAN_STEP/AFTER_PLAN_STEP/ON_PLAN_BLOCKED/ON_PLAN_COMPLETED через тот же HookEngine) не вызывают LLM/tool, не добавляют evidence и не мутируют approved план — только HookDecision, применяемый вызывающим кодом; PROGRAM возобновляется typed heartbeat (planId/planVersion/stepId — PlanScheduler/HeartbeatRunner.firePlanStep), stale-версия (approval ушёл вперёд) пропускается, а не исполняет старый шаг; background run никогда не ждёт UI approval (interactiveApproval=false → REQUIRE_APPROVAL становится blocked, не подвисший WorkManager); PlanRecovery после падения процесса помечает шаг COMPLETED только при уже persisted evidence этой попытки, иначе BLOCKED — side effect не повторяется. Доменные шаблоны budget/nutrition/languages (assets/plan_templates/*.json) фиксируют обязательные constraints (не выдумывать суммы, не проводить платежи; не ставить диагнозы/лечение, стоп при тревожных симптомах; интервалы SRS считает только код) — вносятся в план в коде и перепроверяются PlanValidator. Task 12 закрывает TODO, оставленный Task 21 (user-agent-builder-848153): живая com.aiopenpocket.ui.plan.PlanCard в потоке чата (proposal-превью с Одобрить/Попросить правки, когда план AWAITING_APPROVAL; компактный прогресс с Пауза/Продолжить/Отменить, когда ACTIVE/PAUSED) — все действия типизированными ChatIntent-командами поверх PlanRepository/PlanCommands (Task 5), без второго approval-механизма; полноэкранные PlanListScreen (маршрут plans/{agentId}, секции active/paused/completed) и PlanDetailScreen (маршрут plan/{planId}: объектив/версия/статус, timeline шагов с критерием/evidence/сроком для PROGRAM, критерии выполнения, журнал событий, Пауза/Продолжить/Отменить — без approve/request-changes, это остаётся только за чатом); и сама секция «Планы» в AgentDetailScreen (счётчики active/paused/completed + список, честная пустая карточка у пресетов без планов)."
    flows: [chat]
  - id: chat-font-size-setting-c72418
    title: "Chat font size setting"
    rationale: "Дать пользователю выбрать размер шрифта сообщений в чате (4 пресета S/M/L/XL) в Настройках — надстройка НАД системным fontScale устройства, применяется только к тексту пузыря. Хранится по имени enum в DataStore (UserPreferencesRepository) рядом с лимитом витков; ChatFontScale.fromName разрешает неизвестное/старое значение в MEDIUM, а не роняет приложение. Множитель едет через ChatUiState.chatFontScale в параметр MarkdownText.fontScale (единственная точка рендера текста пузыря) и в StreamingBubble тем же множителем — иначе текст прыгал бы в размере при подмене стрима готовым сообщением. Масштабируется весь рендер MarkdownText внутри пузыря (тело/заголовки/списки/инлайн-код + неинтерактивная карточка-в-markdown); интерактивные driven-UI виджеты, поле ввода и тул-трейс — нет. TextStyle.scaledBy множит fontSize и только sp-lineHeight (em относителен кеглю и растёт сам)."
    flows: [chat]
  - id: smena-temy-svetlaya-temnaya-sistemnaya-palitra-lime-ink-paper-005bc6
    title: "Смена темы + палитра lime/ink/paper"
    rationale: "Дать юзеру выбор темы: тёмная залочка (darkTheme=true, LightColorScheme=DarkColorScheme) и фиолетовая Material-палитра были временными. Палитра lime/ink/paper и обе схемы (AppDarkColors/AppLightColors) заданы юзером дословно; error/onError падают на дефолты M3. Режимы Светлая/Тёмная/Системная, дефолт Системная; ThemeRepository отдаёт режим реактивно (StateFlow) на обычных SharedPreferences (ui_prefs) — тема не секрет, в отличие от SettingsRepository/EncryptedSharedPreferences, и не тянет MasterKey на старте; проброс AppGraph -> MainActivity -> MyApplicationTheme(mode). Ключевое: 139 сайтов старых токенов были top-level val (PurpleAccent и пр.), физически не реагирующие на смену темы — переименованы в MaterialTheme.colorScheme.* (полный ренейм), иначе переключатель был бы фиктивным; компилятор служил чек-листом. Не-composable badge-хелперы (planStatusColor/stepStatusColor) используют raw-val LimeSignal, а не @Composable colorScheme. Glass — dark-first, минимальная theme-awareness через LocalThemeIsDark: тинты/BorderBrush флипаются на тёмные на светлой (glassCardSurface стал @Composable), но аврора на светлой ГАСИТСЯ (пустой список пятен, чистый PaperBg) — свечению нужен тёмный холст, на бумаге пятна дают грязь; намеренный минимализм, а не редизайн стекла. Дизайн: docs/superpowers/specs/2026-07-15-theme-switch-design.md."
    spec: "docs/superpowers/specs/2026-07-15-theme-switch-design.md"
    flows: [chat]

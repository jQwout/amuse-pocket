lang: ru              # spec-draft language: de|en|es|fr|it|ru
features:
  - id: streaming-llm-chat-6595a1
    title: "Стриминг-чат с LLM"
    rationale: "Стримить ответы от OpenAI-совместимого LLM по Ktor SSE, с фолбэком между моделями провайдера (кросс-провайдерного фолбэка нет — см. vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53; фолбэк запрещён после первого эмита, чтобы в чат не попал обрывок). encodeDefaults=true обязателен — иначе строгие провайдеры дают HTTP 400 «missing field type». Reasoning-модели (Muse Spark размышляет всегда) отдают размышление отдельным полем — у OpenRouter это delta.reasoning, у прямых OpenAI-совместимых API reasoning_content; если content так и не пришёл, отдаём размышление как ответ, чтобы ход не закончился пустым экраном. Отказ ключа (401/402/403) обрывает перебор сразу — следующая модель того же провайдера получит тот же ответ; ошибка хода показывается на языке интерфейса (через tr — голый русский литерал доезжал до англоязычного судьи дословно) и говорит, что поправить, а не сырым JSON провайдера; маршрут последней попытки подставляется в текст про ключ и счёт, потому что маршрутов два, и «ключ OpenRouter» посылал владельца ключа Meta не туда. finish_reason «error» посреди ответа — ошибка с «Повторить», а не обрывок под видом готового ответа. Ход чата — общий ReAct-цикл ReactLoopRunner (рассуждение → инструменты → наблюдение, до 10 витков; все tool_call витка — одним assistant-сообщением, и каждый получает свой tool-ответ, иначе строгий API Meta отвечает 400); им же пользуются рефлексия, план-движок и heartbeat. TUTOR — разовый вопрос во время урока: без инструментов, один виток. Пустой ответ ответом не считается: HTTP 200 без единого токена (так провайдер отдаёт деградировавшую модель — живой случай был на NIM) уводит на следующую модель — иначе ход умирает пустым сообщением, имея в цепочке живые модели. Терминальный Finish поэтому придерживается до конца попытки: иначе фолбэк протолкнул бы потребителю конец хода раньше настоящего ответа. Движок Ktor инъектится, потому что цепочку моделей нельзя покрыть тестом, не подменив транспорт. Ответ, обрезанный по max_tokens (finish_reason «length»), по цепочке дальше не идёт — другая модель упрётся в тот же потолок: целый текст остаётся с пометкой «…(ответ обрезан)», одно размышление без ответа или недописанный tool_call — ошибка с «Повторить» (обрывок аргументов исполнять нельзя). HTTP 400/413 тоже обрывают перебор: запрос отвергнут по существу (слишком длинный, неподдерживаемое вложение), и следующая модель отвергла бы его так же. Ответ из одного размышления помечается («💭 Ответа нет — вот ход мыслей модели») и несёт флаг reasoning, чтобы аннотатор, проверка плана и разбор профиля не приняли черновик из размышления за результат. Бюджет истории (~48k токенов) применяется всегда, а не только к длинным диалогам: пара вставленных простыней давала 400 под видом «нет сети»; режется сначала старая часть хвоста, потом начало, последние 6 реплик — в последнюю очередь, текущее сообщение — никогда. Из сохранённого ответа рефлексии в историю идёт только итог. Упёрся в лимит витков — после него идёт ещё один вызов модели без инструментов с просьбой коротко сказать, что сделано, что нет и что можно попросить дальше: гайд агентов Meta считает прогон без финального ответа ассистента провалом, а склейка преамбул в чат таким ответом не была; не сработал вызов — остаётся склейка, как раньше; стоп по хуку и по бюджету тулов эту итоговую реплику не запускает. Системный промпт собирается от стабильного к изменчивому (база, урок, язык, роль, навыки, инструкции — потом план, «Сейчас», память): у Meta автоматический кеш по ПРЕФИКСУ, и минутная метка в третьей секции сбрасывала кеш всего остального каждую минуту; по той же причине эфемерная инструкция хука добавляется в конец сообщений, а не в индекс 1, сдвигавший всю историю. Отладочные логи с текстом пользователя и аргументами тулов пишутся только в debug-сборке. Сверка с докой Meta (29 окт 2026) дала три правки клиента. (1) Сила размышления теперь задаётся, а не отдаётся на усмотрение модели: размышление биллится как выход и делит max_tokens с ответом, так что ответ на вопрос урока на «умолчании модели» мог целиком уйти в мысли. Режим решает уровень (ответ в уроке — low, чат — medium, план и рефлексия — high; GOAL идёт на medium, но перепланирование внутри него — high), уровень едет в контексте корутины (ReasoningEffortContext), а не параметром streamChat: LlmClient зовут из семи мест, а PlanStepRunner зеркалит сигнатуру ReactLoopRunner.run один в один. Поле зависит от маршрута: у Meta верхнеуровневое reasoning_effort, у OpenRouter вложенный объект reasoning{effort} (верхнеуровневое в их доке не описано); моделям без флага reasoning поле не шлётся вообще, значение none не используется — Muse отвечает на него 400. max_tokens прежний, 16000. (2) Аргументы tool_call, не разобравшиеся как JSON, больше не становятся пустой картой: инструмент отвечал «нет аргумента», и модель чинила не то. Вместо этого в карте едет маркер с коротким фрагментом присланного (MalformedArguments), а ToolExecutor до проверки схемы отвечает «аргументы — не валидный JSON, пришли вызов заново». Пустая строка аргументов по-прежнему значит вызов инструмента без параметров. Вызов с маркером ReactLoopRunner отсекает ещё до шлюза подтверждений и не считает в бюджет тулов: иначе человека спросили бы разрешения на DESTRUCTIVE/EXTERNAL-вызов, который всё равно не исполнится, а в PREVIEW имитация доложила бы об успехе. (3) На 429/500/503 та же модель повторяется с отступом (1 с, 2 с + джиттер, Retry-After побеждает, если длиннее; не больше трёх попыток на модель и 20 с ожидания на весь ход), и только потом цепочка идёт дальше; Retry-After, не влезающий в бюджет (60 с у «overloaded»), пропускает ожидание сразу. 504 повтором не лечится, 400/401/402/403/404/413 не повторяются никогда, после первого эмита — тоже. Расчёт отступа общий с SegmentationClient (RetryBackoff), чтобы два клиента не разошлись в том, что значит «подождать»."
    spec: "docs/archive/TZ.md#10"
    flows: [chat]
  - id: vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53
    title: "Модели Meta: прямой Meta Model API и OpenRouter"
    rationale: "Приложение работает на моделях Meta, маршрутов к ним два. Основной — прямой Meta Model API (api.meta.ai): отсев Meta-хакатона засчитывает «Meta Model API и/или открытые веса Meta», а OpenRouter буквально ни то, ни другое; к тому же SAM 3.1 и Voice Transcribe есть только там. Запасной — OpenRouter, из каталога которого берутся только модели meta/…. Маршрут решает ключ, без переключателя: введён ключ Meta — запросы идут напрямую, нет — через OpenRouter (activeLlmProvider — одна функция и для цепочки, и для строки маршрута в Настройках, иначе экран обещал бы Meta, а ход уходил бы в OpenRouter). Ключ Meta вводит только пользователь в Настройках, вшитого нет ни в debug, ни в релизе (решение 26 окт 2026): репозиторий открыт, а секретный плагин копирует .env в BuildConfig внутрь артефакта, и вшитый ключ раздавал бы кредиты Meta каждому, кто соберёт проект; ключи сохраняются без пробелов по краям — вставка из буфера иначе давала бы 401 при верном ключе. Каталог Meta статичный (models_meta.json: Spark 1.3 → 1.2 → 1.1, Wonder последней — она в 3–5 раз дороже), id там без префикса, поэтому отсев по meta/ стоит только на OpenRouter. Выбор модели у маршрутов свой: id одной модели у OpenRouter и у Meta разные, и общий выбор показывал бы модель, которой цепочка не знает. Meta присылает в usage одни токены — цену приложение считает по прайсу Meta (metaListPriceUsd), иначе расход на кредитах пользователя был бы без денег; SAM 3.1 берёт за картинку, а не за токены, и считается отдельно (samCostUsd, см. sam-segmentation-boxes-in-a-lesson-c3ea52). Исключение из «маршрут решает ключ»: SAM 3.1 (шаг урока segment) идёт только на прямом Meta Model API и только по ключу Meta из Настроек, на каком бы маршруте ни был чат — с одним ключом OpenRouter шаг честно скажет «нужен ключ Meta», а не уйдёт в OpenRouter, где SAM нет. Курс учит на Muse и рассказывает про модели Meta — агент, отвечающий чужой моделью, учил бы одному, а показывал другое; к тому же каждый лишний вендор — это ещё один адресат пользовательских данных и ещё один прайс. Поэтому 25 окт 2026 выпилен NVIDIA NIM (вместе с ключом, каталогом и переключателем в Настройках), а раньше — GROQ, GITHUB и кросс-провайдерный AUTO; кросс-провайдерного фолбэка нет и с двумя маршрутами. Отсев не-Meta моделей OpenRouter стоит в разборе живого каталога, при сборке цепочки (LlmModule) и в списке Настроек: кеш прошлой версии и модель, выбранная до обновления, ещё могут быть чужими; meta-llama/ сюда не входит — Llama на OpenRouter обслуживают сторонние хостеры. Ключ OpenRouter — из Настроек, иначе вшитый в отладочную сборку из .env, иначе онбординг, который сам ходит в модель, не дожил бы до Настроек; релизная сборка живой ключ не пропустит. В BuildConfig едет только OPENROUTER_API_KEY: секретный плагин по умолчанию копирует туда каждую строку .env, и старые ключи (NVIDIA, Gemini) ехали бы в каждый отданный кому-то debug-APK; список исключений явный, потому что плагин сверяет шаблон через containsMatchIn и «всё, кроме» выкидывал и сам ключ OpenRouter. Фолбэк — только между моделями (Muse Spark 1.3 → 1.2 → …) и не больше пяти попыток: после трёх отказов дело уже не в модели, а в ключе или сети. Каталог тянется с /api/v1/models и кешируется файлом в filesDir (не таблицей в Room: это документ, который заменяется целиком, а схема БД до релиза живёт на fallbackToDestructiveMigration); ассет — сид на первый запуск и офлайн. Только модели с function calling: без tools агентский луп и план-движок молча вырождаются. Contributor-версии Muse, на данных которых учится вендор, не попадают никуда: через приложение идут профиль, дневник и фото. Поле силы размышления зависит от маршрута (см. streaming-llm-chat-6595a1): у Meta Model API reasoning_effort верхнего уровня, у OpenRouter объект reasoning{effort}; уходит только моделям, у которых в каталоге reasoning=true, а у OpenRouter этот флаг берётся из supported_parameters живого каталога. Агент из конструктора может назвать свою модель (AgentDefinition.model, null = модель приложения): семейство WONDER или SPARK, а не id, потому что у одной модели на двух маршрутах разные id (muse-wonder-1.0 у Meta, meta/muse-wonder у OpenRouter), а маршрут пользователь может сменить уже после сборки агента; семейство подбирается по активному каталогу, и ProviderFallbackChain ставит лучшую модель семейства первой, выбор из Настроек остаётся первым запасным. Нет такой модели на маршруте или ключ неизвестен — тихо идём по обычной цепочке (в лог), ход не падает. Модель едет в контексте корутины (AgentModelContext) вместе с TurnContextHolder, поэтому её получают чат, рефлексия, шаги плана, heartbeat и планировщик без нового параметра."
    flows: [chat]
  - id: agent-memory-05e545
    title: "Память агента"
    rationale: "Хранить короткую/длинную/эпизодическую память в Room, чтобы восстанавливать сессию и вспоминать контекст. Эпизоды (записи вызовов тулов) идут в промпт коротко — «[тул действие] итог», итог в одну строку до 300 символов, — а не сырым выводом инструмента: иначе чужой текст из файлов и календаря оседал бы в каждом следующем запросе. recall_episodes видит только текущий чат и не больше 20 эпизодов. Факты в промпт: если их не больше 40 — все, свежие первыми (поиск по словам терял нужное, когда вопрос сформулирован иначе, чем факт); больше — ранжированный поиск с русскими стоп-словами и грубой основой слова. Обычный чат не получает факты агентов (namespace agent:), секция фактов ограничена 300 символами на строку и 3000 всего, а факты, уже показанные в профиле, не дублируются."
    spec: "docs/archive/TZ.md#8"
  - id: mcp-tools-f77d9b
    title: "MCP-тулы"
    rationale: "Набор локальных инструментов в духе MCP (имя + JSON-схема, исполнение в процессе, без MCP-сервера): память, хранилище агента, песочница файлов и файлы через SAF, чтение БД по allowlist, уведомления, heartbeat, WorkManager, будильник, календарь, черновик письма, шагомер, словарь SRS, карточки, навыки. Веба нет — приложение локально-первое. Каждый вызов: проверка схемы, потолок 30 с, класс риска на вызов (Preview имитирует запись), чужой текст приходит модели в ограде <tool_output trust='untrusted'>. Правило по умолчанию (с 25 окт 2026): чтение и запись идут сами, а удаление (DESTRUCTIVE) и отправка наружу (EXTERNAL) в чате всегда ждут «Разрешить» на полосе подтверждения, а в фоне запрещены — даже без хуков и у обычного чата: модель, прочитавшая чужой файл, не должна одна решать стереть документ или отдать текст другому приложению. Поэтому storage_tool.delete и external_files.write_file (режим «wt» затирает документ пользователя) — DESTRUCTIVE, письмо — EXTERNAL (почтовый клиент сохраняет черновик на сервер ещё до «Отправить»). «Отклонить» (или молчание 2 минуты) приходит модели как решение пользователя, а не нехватка доступа: голое «not approved» модель читала как выключенное разрешение и отправляла в Настройки включать почту. Будильник и письмо открывают чужое приложение только на переднем плане; из фона — уведомление, по тапу на которое откроется то же действие, а модель честно узнаёт, что дело ещё не сделано. cancel_work отменяет только задачи самого work_manager — не heartbeat'ы и не системные воркеры. Пути песочницы файлов одинаковы на любой ОС: обратная косая отклоняется (на Android это просто символ имени, на Windows — шаг наверх), абсолютный путь в чужую песочницу или в общие данные приложения отклоняется, в свою — принимается как есть; короткий «/notes.txt» считается от корня песочницы. Без этого на Android абсолютный путь молча пересаживался внутрь своей песочницы вложенными папками, а тесты на Windows этого не видели. Трасса вызовов и подписи — по-русски, и имя у инструмента одно на всё приложение (CapabilityNames: полоса подтверждения, трасса, «Использую инструмент…», карточки агентов, конструктор) — иначе один и тот же тул назывался бы в трёх местах по-разному или сырым id. Аргументы вызова, которые не разобрались как JSON, ToolExecutor возвращает модели прямым текстом («не валидный JSON», с коротким фрагментом присланного), а не безликим «нет аргумента»: иначе модель чинила значение, когда сломан был сам JSON."
    spec: "docs/archive/TZ.md#9"
  - id: driven-ui-cards-0418d0
    title: "Driven UI карточки"
    rationale: "Позволить LLM рендерить UI-карточки (todo/таблица/график/таймер/форма/выбор/картинка) прямо в чате через render_card. Общие виджеты интерактивны в любом чате, в том числе рядом с текстом ответа; карточки уроков — только в уроке, в остальных чатах падают в markdown. Шаблоны switch и weather_card выведены (RETIRED_CARD_TEMPLATES): переключатель ничего не переключал, а погоду взять неоткуда — веба нет; старые сообщения с ними рисуются, новый вызов получает «неизвестный шаблон», и конструктор их не предлагает. У fill-карточки урока — список допустимых ответов (регистр, пробелы и ё/е не важны), а после двух промахов она показывает правильный ответ и пускает дальше: тупик на одном слове хуже подсказки. Картинка (template image) грузится Coil-ом: SVG и растр, ассет первым (оффлайн) с фоллбеком на URL; у картинки урока с image_prompt — кнопка «Нарисуй под меня» (см. kartinki-urokov-cherez-muse-image-fd6f8c). Тот же движок рисует интерактивные карточки уроков: reveal/concept/example (отображение) и fill/sort/match/scenario (проверка ответа, продвигают урок как пройденный квиз), а также lesson_video — ролик-пример в один тап или свой (снять/выбрать) для Muse Spark (см. video-na-vhod-v-uroke-muse-spark-08ccdb) и lesson_animation — процедурная сцена урока (см. protsedurnye-animatsii-v-urokah-68b2bf), а также lesson_segment (ввод фото и слова для SAM) и lesson_segment_result (фото с рамками найденного; пустой список рамок — нормальный ответ «ничего не нашёл», а не ошибка) — см. sam-segmentation-boxes-in-a-lesson-c3ea52. Обе карточки кладёт в чат только контроллер урока: в render_card их нет."
    spec: "docs/archive/TZ_v05_widgets_apps.md#1"
  - id: swappable-persona-e5e65e
    title: "Сменяемая персона"
    rationale: "Дать юзеру выбрать одну из 7 персон в Настройках без перекомпиляции. Персона фиксируется в диалоге при создании — в том числе в чате, начатом голосовым ассистентом, — и смена действует на новые чаты: переписка не меняет характер на середине."
    spec: "docs/archive/TZ.md#3"
  - id: background-tasks-15a34a
    title: "Фоновые задачи"
    rationale: "Отложенные и периодические уведомления через WorkManager (тул work_manager, у периодики минимум 15 минут) и экран «Запланированные задачи» в Настройках со списком и отменой. Экран показывает только задачи этого тула (по его тегам): у heartbeat-напоминаний своя карточка с «Отменить» в чате, а системные воркеры пользователю не нужны. Заголовок и текст едут в тегах WorkRequest — других метаданных WorkManager не хранит; отмена — по уникальному имени из тега, иначе по id работы; состояние — словами на языке интерфейса. Тул отменяет только работу со своим тегом id:<work_id>: имя heartbeat_<id> модель может угадать, и отмена чужого напоминания или шага плана через work_manager обходила бы проверку владельца в heartbeat."
    spec: "docs/archive/TZ.md#14"
  - id: ai-academy-onboarding-5d51bb
    title: "AI Academy / онбординг"
    rationale: "Онбординг — три шага: язык, знакомство, рассказ о себе; персону мастер не спрашивает (на первом запуске сравнивать не с чем), она меняется в Настройках. Если модель недоступна (нет ключа — магазинная сборка его не вшивает — или нет сети), рассказ о себе сохраняется как есть и онбординг завершается: ключ вводится в Настройках, которые открываются только после него, и тупик на шаге «Готово» запирал бы приложение. «Путь агента» — упорядоченный список уроков-концепций (порядок педагогический); порядок задаётся в коде: ROADMAP_LEVELS (путь) и LIBRARY_LESSON_IDS (библиотека). Языки на выбор — русский и английский (см. english-ui-on-the-demo-path-223241): выбор сразу переключает интерфейс и язык ответов агента (подпись главной кнопки мастера читается при показе, а не хранится в состоянии: выбор языка пересобирает состояние раньше, чем язык меняется); текст знакомства — простой текст без разметки, он стримится в голый Text; других языков в планах нет, и в выборе их не показываем. Уроки про модели Meta (кто есть кто, режимы Muse Spark, как рисует Muse Image, открытые веса и API) стоят рядом с темами, на которые опираются: за видео, за температурой и за приватностью — курс идёт на Muse, и ученик должен знать, что за модели им отвечают. Порядок (25 окт 2026): сначала что такое ИИ и агент, потом запрос, токены, видео, модели Meta и режимы Muse Spark (думающие модели вводятся там, пока токены свежи), память и окно контекста — в первой половине, раньше приватности, которая на них опирается; затем воркфлоу → цепочки → ReAct → инструменты → навыки → контекст → подтверждения → хуки → сборка агента, после неё режимы План/Цель/планы/рефлексия/heartbeat, арена и капстоун. Каждый урок опирается только на пройденное, ссылки «в прошлом уроке» сверены. Капстоун ведёт в конструктор кнопкой «Открыть конструктор»: пять вопросов урока — это шаги конструктора. RAG — только в Библиотеке, после контекст-инжиниринга. Реализовано сверх исходного ТЗ."
  - id: multi-chat-conversations-b3c93b
    title: "Мульти-чат"
    rationale: "Список диалогов и переключение между ними: заголовок, резюме и теги пишет фоновый аннотатор (раз в несколько реплик, той же моделью, что и чат, отдельно от хода — ход не ждёт аннотацию и не падает из-за неё; по одной на диалог; размышления модели он не читает), по тегам — фильтр списка и граф памяти; избранное наверху; бейджи фоновых ходов «варится/готово/ошибка»; пустой «Новый чат» переиспользуется, а не плодится; удаление диалога сначала гасит его ход и heartbeat'ы (FK на conversations у них нет). Чаты уроков аннотатор не трогает: у них заголовок — id урока, по нему урок и открывается, поэтому список чатов подставляет название урока на языке интерфейса при показе (Conversation.displayTitle), а хранимый заголовок остаётся id; тем же названием подписан пуш о завершённом фоновом ходе (адаптер TurnPersistence в TurnModule). Тестовые чаты конструктора агентов в список не попадают (служебный тег «__…», который аннотатор не затирает). Реализовано сверх исходного ТЗ."
  - id: rezhim-refleksii-fca3c4
    title: "Режим агента: рефлексия"
    rationale: "Рефлексия — режим AgentMode.REFLECT, чип «Рефлексия» в любом чате (обычном, у пресета, у собранного агента с этим режимом): ReflectionOrchestrator крутит черновик → критика → итог поверх ReactLoopRunner, чтобы улучшить качество ответа. Черновик и итог идут со скоупом тулов, навыков и памяти агента, критика — один вызов без инструментов. В чат сохраняется весь проход, карточки — только из итога; пустой итог — ошибка с «Повторить». Итог получает только инструменты, все действия которых — чтение, плюс render_card, и список того, что черновик уже вызвал, с пометкой «уже сделано, не повторять»: иначе запись, поставленная черновиком, ставилась бы второй раз (два напоминания, два файла). В историю следующих ходов из сохранённого прохода идёт только итог — черновик с критикой утраивали бы сообщение и подсовывали бы отвергнутый вариант как сказанное."
    flows: [chat]
  - id: uroki-kontseptsii-v-chate-po-json-kontraktu-0a70c2
    title: "Уроки-концепции в чате (JSON-контракт)"
    rationale: "JSON-уроки (assets/lessons) драйвит чат-контроллер как строгий шаговый контракт (1 шаг = 1 сообщение ассистента): код ведёт шаги, отделяя их от команд LLM. Типы шагов: text, quiz, image (SVG/растр; asset|imageKey первым, затем картинка Muse Image по imagePrompt — см. kartinki-urokov-cherez-muse-image-fd6f8c, затем URL), video (ролик-пример из сборки или свой → Muse Spark, см. video-na-vhod-v-uroke-muse-spark-08ccdb), segment (фото ученика → SAM 3.1 обводит названное им на фото, см. sam-segmentation-boxes-in-a-lesson-c3ea52), animation (процедурная сцена на Compose, см. protsedurnye-animatsii-v-urokah-68b2bf), и интерактивные reveal/concept/example/fill/sort/match/scenario. Открываются из Пути, Библиотеки и с Главной. Шаг fill несёт answers — допустимые варианты ответа рядом с основным answer (lint урока не пускает пустые). Уроки учат тому, что приложение делает на самом деле (трасса «Инструмент: действие → ок», правило подтверждения, обрезка истории без резюме, статусы PlanCard): урок, противоречащий экрану, учит не доверять ни тому, ни другому."
    flows: [chat]
  - id: kartinki-urokov-cherez-muse-image-fd6f8c
    title: "Картинки уроков через Muse Image"
    rationale: "Шаг-картинка урока может нести imagePrompt: если у шага нет своего ассета, картинку рисует Muse Image (через OpenRouter, ключ чата; без ключа урок показывает картинки из сборки) и кладёт в filesDir/lesson_images под хешем модели и полного промпта. Бандл остаётся первым источником — работает без сети и ничего не стоит; рисуем только там, где картинки нет. Кеш на диске, а не в cacheDir: каждая генерация стоит денег и десятков секунд, а cacheDir система чистит когда хочет. Один промпт рисуется не больше одного раза одновременно — предзагрузка урока и показ шага иначе оплатили бы один кадр дважды. Предзагрузка идёт отдельной корутиной со старта урока, потому что Muse Image думает перед отрисовкой; показ шага ждёт картинку не дольше 20 с и выходит без неё — держать пользователя на «Дальше» хуже, чем показать шаг без картинки, а «1 шаг = 1 сообщение» держится при любом исходе. В запросе только model и prompt: у meta/muse-image на OpenRouter нет объявленных параметров, поэтому горизонтальный кадр и единый стиль «без букв» задаёт сам промпт. Каждая картинка пишется в учёт расхода рядом с ходами чата. Иллюстрации к самим урокам рисуются заранее скриптом tools/lesson-images/pregenerate.py: WebP в assets/lessons/images/generated и asset в шаге — урок показывает их без сети, бесплатно и на любом провайдере, а рисование на телефоне остаётся для шагов без ассета. Скрипт правит JSON урока как текст (форматирование и переводы строк не трогает), поэтому imagePrompt — печатный ASCII без кавычек; стиль промпта у скрипта и приложения один, дословно (LessonImageStyleSyncTest). Кнопка «Нарисуй под меня» на картинке урока перерисовывает сцену под пользователя и публикует её отдельной карточкой под шагом (видно «было / стало»; курсор урока — явное состояние, лишнее сообщение его не сдвигает). Из профиля провайдеру уходит только «о себе» (обрезанное до 400 символов) и язык: имя, возраст, пол и вероисповедание остаются на телефоне — картинке без букв они ни к чему, а модель по ним охотно рисует стереотипы. Без «о себе» кнопка прямо говорит, что поправить, а не «не вышло»."
    flows: [chat]
  - id: video-na-vhod-v-uroke-muse-spark-08ccdb
    title: "Видео на вход в уроке (Muse Spark)"
    rationale: "Шаг урока video: главная кнопка «Показать на примере» отправляет ролик-пример из сборки (sampleVideo в assets, превью — samplePreview), а снять 5–10 секунд камерой или выбрать ролик из галереи — второй ряд. Пример первым, потому что съёмка на телефоне — это камера, разрешения и свет, а смысл шага (модель видит отдельные кадры и где-то сомневается) виден и на готовом ролике в один тап; его тоже нарисовала Muse Image, наезд камеры — ffmpeg. Muse Spark (через OpenRouter, video_url с base64 data URL) отвечает по заданию урока, ответ ложится в чат под шагом. Отдельный клиент, а не вложения в общий агентский луп: уроку нужен один вопрос и один ответ про один ролик, а луп, тулы и история построены на тексте — тащить туда видео значило бы перестраивать ChatMessage и все оркестраторы ради одного шага. Камера пишет в cacheDir через FileProvider, а не в галерею: снятое для урока не оседает в фотоплёнке и удаляется после разбора; ролик из галереи чужой — его не трогаем, пример читается из assets APK. Системная камера ограничена 10 секундами и низким качеством, ролик читается с потолком 20 МБ: его целиком везут провайдеру в base64. Видео уходит провайдеру со всем, что в кадре, — урок прямо говорит об этом и просит не снимать личное. Шаг пропускаемый («Дальше» есть всегда), но пока модель смотрит, «Дальше» спрятана, чтобы ответ лёг под своим шагом. Урок how_model_sees стоит сразу за токенами: видео — те же токены, только из кадров."
    flows: [chat]
  - id: protsedurnye-animatsii-v-urokah-68b2bf
    title: "Процедурные анимации в уроках"
    rationale: "Шаг урока animation показывает сцену, нарисованную кодом на Compose, а не видеофайл: килобайты вместо мегабайт в APK, работает без сети и на любом провайдере, подстраивается под экран, а подпись правится одной строкой. Главное — сцену можно потрогать: в «Температуре» ползунок на глазах сжимает и расплывает распределение, кнопка вытягивает слово, и видно, как растёт разнообразие. «Токены» показывают, как одна мысль по-русски распадается на больше кусочков, чем по-английски. Подписи сцен идут через tr(); у сцен уроков, которых нет по-английски, русский текст пока остаётся, и это держит именное исключение в проверке T6c (screen-text-check-7c6d09), которое гаснет с появлением assets/lessons/en/<урок>.json. Остальные сцены тоже про действие, а не просмотр — короткий урок, в котором сам что-то двигаешь, запоминается: «Видео → кадры» (выбираешь частоту кадров — при 1–2 в секунду подъём чашки проскакивает, при 4 замечен, но токенов больше), «Цикл ReAct» (ведёшь агента по кругу кнопкой на примере урока), «Окно контекста» (имя уезжает за край окна и забывается, долгая память его возвращает), «RAG» (выбираешь вопрос — база подсвечивает похожие куски, они уходят в пакет, затем ответ). С 25 окт 2026 сцена есть в каждом уроке — одна на урок, и она показывает его главный механизм действием: персона и профиль меняют ответ, чат против агента, слои препромпта, точность просьбы, уверенный тон без правды, вызов инструмента, уровни навыков, куда уходят данные, классы риска, хуки хода, воркфлоу против агента, цепочка и роутер, бюджет контекста, гейт плана, витки гоал-мода, черновик и критика, «сделал — докажи», сутки cron и heartbeat, арена и рой, сборка агента, пять вопросов капстоуна, и четыре сцены про модели Meta (линейка, открытые веса и API, режимы Muse Spark, как рисует Muse Image). Это не квиз — квизы в уроках уже есть: сцена показывает механизм, а не проверяет знание. Пример в сцене берётся из текста её урока, чтобы сцена и текст не расходились; каждая сцена — свой файл Scene*.kt. Сцена показывает то, что приложение делает на самом деле, а не идеальную схему: риск-гейт и хуки — правило по умолчанию (запись идёт сама, удаление и отправка спрашивают, «разрешить» в хуке его не снимает), бюджет контекста — обрезку середины без резюме, поток данных — OpenRouter и Meta. Исключение — онбординг: l1_welcome рисует свой экран кодом, а не чат-драйвер, поэтому сцена «персона и профиль» из его JSON пока не показывается. Числа и разбиения иллюстративные (настоящих вероятностей Muse не отдаёт: logprobs у Meta — 400), и подпись сцены это прямо говорит. Список сцен один на рендер и проверку уроков (LESSON_ANIMATION_SCENES), чтобы урок с неизвестной сценой не ушёл в сборку."
    flows: [chat]
  - id: voice-input-1a0dfd
    title: "Голосовой ввод и ассистент"
    rationale: "Распознавание речи и интеграция с системным ассистентом (Assist API), чтобы диктовать запросы голосом и вызывать агента из любого экрана. Распознаватель выбираем сами: став ассистентом по умолчанию, приложение может оказаться и системным распознавателем, а его AssistRecognitionService — заглушка, всегда отвечающая «занят»; поэтому, если системный — наш или его не прочитать, берём первый RecognitionService другого пакета."
    flows: [chat]
  - id: agent-skills-7189cc
    title: "Навыки агента (skill-паки)"
    rationale: "Навыки — progressive disclosure: в промпте только каталог (id, описание, когда), инструкция приходит по load_skill(id). Встроенные (budget, diary, languages, fitness) — манифест в коде и assets/skills/{id}/SKILL.md; свои навыки пишутся в конструкторе агента и живут в Room, id не может совпасть со встроенным. Агент грузит только навыки из своего skillIds — это проверяет код (ReactLoopRunner), а не промпт; агенту без load_skill каталог не показывается вовсе (иначе модель звала бы инструмент, которого у неё нет, и видела чужие навыки); обычный чат видит все. fitness пресетам не выдан — он для агентов из конструктора."
  - id: multi-agent-orchestration-27b8e3
    title: "Мульти-агентная оркестрация"
    rationale: "Демонстрация многоагентных схем. Живой путь: предметные мини-агенты-специалисты со своим скоупом инструментов (бюджет, языки, задачи, напоминания, нутрициология, дневник) — через roster в AgentsScreen. PlanExecuteOrchestrator (планировщик→исполнитель→синтезатор) удалён из mvp 2026-07-10 как неподключённый ни к одному входу; код остался в git-истории и на ветке feature/plan-execute."
    flows: [chat]
  - id: app-settings-beb470
    title: "Настройки приложения"
    rationale: "Экран настроек: ключ Meta Model API (первым, с подсказкой, где его взять, — сюда приходят и судьи, собравшие открытый репозиторий, без README) и ключ OpenRouter как запасной путь, строка «куда идут запросы», выбор модели Meta (подписи человеческие — «Muse Spark 1.3», «Авто — по приоритету»; список — каталог текущего маршрута), персона, тема, размер шрифта чата, лимит витков гоал-мода, расход за неделю (в списке «по моделям» — три первые по токенам и всегда модели, которые берут за картинку: у SAM нет токенов, а в свежем демо это единственный вызов, который стоил денег) и вход в «Запланированные задачи»; ключи хранятся в зашифрованном виде на устройстве; ключ NVIDIA и выбор провайдера, оставшиеся от прошлых версий, при первом обращении стираются — живой ключ, о котором пользователь уже не знает, не должен лежать на устройстве. Переключателя провайдера нет: маршрут решает ключ Meta (см. vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53), а строка маршрута показывает, что изменит «Сохранить», ещё до нажатия. При английском интерфейсе весь экран по-английски, вместе с листом персон: это путь судей хакатона."
  - id: yazykovoy-agent-repetitor-s-intervalnymi-povtoreniyami-4a9360
    title: "Языковой агент-репетитор (SRS)"
    rationale: "Мини-агент «Репетитор» для изучения языков поверх мультиагентного ростера. Слова — через srs_tool: интервалы и даты повторений считает код (SrsScheduler, покрыт тестом), а не LLM, чтобы модель не портила колоду арифметикой дат. Персистентное состояние агента (цель goal:languages, уровень lang:*, слабые места grammar:*) детерминированно подмешивается в препромпт по префиксам ключей из роли агента. Учебный план ведётся в разговоре: агент записывает его фактом в своей памяти и ставит напоминания через heartbeat; режима План у пресета нет (решение владельца, см. toDefinition). Фоновые напоминания могут звать srs_tool — иначе «пора повторить слова» нечем проверить."
    flows: [chat]
  - id: heartbeat-napominalki-agenta-5f0442
    title: "Heartbeat/напоминалки агента"
    rationale: "Дать агенту проактивность: отложенные пуши-напоминалки и периодические фоновые пробуждения (heartbeat), где агент сам решает, беспокоить ли юзера (паттерн HEARTBEAT_OK). Через WorkManager, реестр в Room, живая карточка в чате с «Отменить». HEARTBEAT_OK работает для любого агентного запуска, в том числе с явной задачей: без этого «проверяй задачи раз в полчаса» писало бы в чат и пушем каждые полчаса, даже когда сказать нечего; запрошенное напоминание при этом всегда считается поводом. Фоновый ход идёт в узком скоупе безопасных тулов (память, хранилище, словарь SRS — иначе Репетитор не мог бы проверить слова к повторению), без ожидания UI-подтверждений. Агент видит и отменяет только свои напоминания, а шаги плана — никто из чата: их ведёт план-движок, и отменённый из чата шаг план ждал бы вечно; обычный чат (сам пользователь) видит все свои. В фоне удаление и отправка наружу запрещены (подтвердить некому), а фоновый промпт несёт секцию «Сейчас» — без текущего времени агент не может решить, пора ли беспокоить. Задержка ставится в миллисекундах: округление до минут будило напоминание на минуту раньше, а шаг плана, разбуженный раньше срока, переставлялся с нулевой задержкой и крутился вхолостую. Карточка округляет «через N мин» вверх, а сработавшее, отменённое или просроченное разовое показывает время («на 20:01»), а не «через 0 мин». Разрешение на уведомления просится в момент, когда оно нужно (карточка notification_permission из ответа агента, когда тул напоминаний его не нашёл), а не при первом запуске; канал — «Напоминания и ответы агента», с монохромной иконкой."
    flows: [chat]
  - id: fonovye-hody-agenta-dde42d
    title: "Фоновые ходы агента (TurnManager)"
    rationale: "Ход агента (стрим + тул-луп + запись ответа) не должен умирать вместе с экраном чата: appScope-синглтон TurnManager держит по сессии на диалог, экран лишь проецирует состояние. Параллельность между диалогами, пуш при завершении в фоне. С 2026-07-28 ход, начатый с экрана, дополнительно защищён foreground-сервисом (shortService) на время исполнения — свёрнутое приложение больше не теряет ответ; по системному таймауту ход валится с «Повторить», но только в фоне (на экране резать нечего). Force-stop и перезагрузку ход по-прежнему не переживает. Если ход в свёрнутом приложении ждёт «Разрешить», приходит пуш «Агенту нужно разрешение…» — иначе запрос молча истекал бы, и человека никто бы не спросил; про передний план приложение спрашивает не один раз, а пока запрос жив, потому что обычный порядок обратный: просят черновик, запрос появляется при открытом чате, и только потом телефон убирают (approval-outcome-honesty-554a8c). «Повторить» повторяет ход с той же добавкой к системному промпту; «Стоп» и сброс ошибки не дают следующему ходу стартовать, пока старый не догорел (иначе два хода писали бы в один чат). Тап по пушу открывает чат только по валидному UUID диалога и только при свежем запуске — поворот экрана или вход из «Недавних» не переоткрывают его снова."
    flows: [chat]
  - id: glass-design-system-21a3fe
    title: "Glass-дизайн-система (глассморфизм)"
    rationale: "Переиспользуемый glass-слой: токены GlassTokens (тинты и блик по теме) + аурора-фон + GlassSurface/GlassCard/glassCardSurface. Backdrop-blur (Haze) снят 30 июля 2026 по решению владельца продукта — «переливание» не нравилось, а per-frame RenderEffect под лентой был главным кандидатом в джанк; 25 окт 2026 из сборки убрана и сама зависимость. GlassSurface теперь — плашка цветом фона темы (альфа GlassTokens.PlateAlpha = 0.985, см. ниже) + тинт + рим-блик, одинаковая на всех API; GlassState/glassSource оставлены пустышками, чтобы не переписывать экраны. В LazyColumn — только «слабое» стекло (tint без эффектов). Полоса под системными часами (StatusBarScrim) — плашка той же альфы (один общий токен PlateAlpha; раньше одно число жило двумя копиями), а не градиент от 0.7: при 0.7 текст ленты читался сквозь часы и батарею, растворение перенесено на 16dp НИЖЕ строки состояния, где закрывать нечего. Плавающая нижняя пилюля сама держит системный инсет (navigationBarsPadding): Scaffold отдаёт высоту этого композабла как нижний отступ содержимого, и без инсета список резервировал меньше, чем бар занимает на телефоне. Плотность 0.985, а не 0.94: при 0.94 текст ленты читался сквозь плавающие пилюли (контраст 1.16:1), а у плоской плашки без блюра порог нечитаемости пересекается около 0.973 — ниже цели не достичь вовсе. Владелец 28 окт 2026, зная эти цифры, выбрал почти сплошные пилюли и отказался возвращать блюр; GlassTokens.BlurRadius — мёртвый токен, его читает только собственный тест. GlassSurface и GlassCard сами задают LocalContentColor = onSurface: это Box и Column, а не Surface, и текст и иконки без своего цвета падали в чёрный по умолчанию Compose — на тёмной пластине невидимый (кнопка Stop, заголовки в списке чатов, Android 14, 29 окт 2026). Эталоны glass_components и chat_input_states годами хранили этот чёрный и потому были зелёными на ошибке. Всё, что плавает над лентой, стоит на пластине: голые строки («Ask the AI», блок «Save changes» в Настройках) читались вперемешку с проезжающим под ними текстом."
  - id: agent-inspector-6e41eb
    title: "Инспектор агента (read-mostly) — SUPERSEDED Task 21"
    rationale: "Glass-лист (ModalBottomSheet) поверх «Тулов» показывал реальный скоуп мини-агента (тулы/навык/heartbeat/области состояния/препромпт) + личные файлы агента из его собственной песочницы (filesDir/agents/{id}, см. user-agent-builder-848153 Task 6) — read-only, чтобы юзер видел, на что агент способен и что настроено, ДО открытия чата. Данные детерминированно из MiniAgentCatalog + HeartbeatDao.observeActiveByAgent + AgentFilesRepository (не через ToolExecutor). SUPERSEDED (Task 21, user-agent-builder-848153): неудобно скроллить внутри шторки, счётчики вместо реальных списков, препромпт не разворачивается — AgentInspectorSheet/AgentInspectorViewModel удалены целиком; их логика перенесена и расширена в полноэкранный com.aiopenpocket.ui.agents.detail.AgentDetailScreen/AgentDetailViewModel (маршрут agent/{agentId}), который вдобавок показывает РЕАЛЬНЫЕ хуки агента + журнал срабатываний (Task 8) вместо прежних фейковых on_tool_call/pre_message-стабов. Id оставлен как есть (frozen, история) — `traxer check` ожидаемо покажет «feature has no code» для него, это не баг."
    flows: [chat]
  - id: user-agent-builder-848153
    title: "User agent builder"
    rationale: "Замкнуть обучение AI Academy в пользовательский результат: безопасно собрать, проверить, сохранить и запустить собственного scoped агента без изменения кода. Preset-каталог остаётся read-only Kotlin; custom agents/skills/hooks — в Room, объединяются с presets через AgentResolver; runtime получает immutable AgentDefinition snapshot, code-enforced ExecutionPolicy (Preview блокирует side effects), per-agent memory/file namespaces и декларативный HookEngine. В LIVE у политики есть пол: DESTRUCTIVE и EXTERNAL ждут подтверждения даже без хуков (хук может добавить запрет или подтверждение, но не снять пол). У хуков бюджет 50 срабатываний на ход, и по его исчерпании пропускаются только LOG/ADD_INSTRUCTION/ALLOW — DENY, REQUIRE_APPROVAL и STOP срабатывают всегда: защита, отключающаяся на длинном ходе, — это не защита. Каталог тулов конструктора показывает худший класс риска действия (хранилище и внешние файлы — удаление), а выведенные шаблоны карточек не предлагает. Тот же потолок показывает и инспектор агента, и берёт его из того же ToolCatalog: собственный Tool.riskClass у memory_tool/heartbeat/work_manager/database_query занижен (эскалация живёт в riskFor(arguments)), и экран агента, обещающий «ЧТЕНИЕ» там, где согласие брали под «может удалить необратимо», — это ложное утверждение о безопасности, а не расхождение в оформлении; парность двух экранов держит тест, иначе они разъедутся снова. Удаление тестового чата сначала снимает его heartbeat'ы. Песочницы агентов и картинки уроков не едут в облачный бэкап (перенос на новое устройство — едут, как и БД). В пробном прогоне трасса пишет «→ имитация», а не «→ ок»: иначе «Почта: написать письмо → ок» читалось как настоящее письмо. Сразу после публикации кнопки «Опубликовать изменения» нет — публиковать нечего; любая правка возвращает её. Шаг «Инструкции» подсказывает по гайду Meta по промптам (роль/задача, формат, длина и тон — сразу; не объяснять модели её устройство): чек-лист-эвристика InstructionsGuide — только совет, сохранение и публикацию не блокирует. Поле model (schema v12, nullable-колонка user_agents) задаёт модель агента: Wonder для тяжёлого многошагового цикла, Spark для дешёвой работы (так делит их гайд агентов Meta); пресеты и новые черновики — null, то есть модель приложения. Выбор — в шаге «Режимы» мастера, текущая модель видна в инспекторе агента; валидатор пропускает только null или известное семейство."
    flows: [chat]
  - id: structured-plan-engine-907066
    title: "Structured Plan Engine (Фаза B)"
    rationale: "Заменяет prompt-only PLAN/GOAL (старый id rezhimy-agenta-plan-i-goal-ee2361 удалён из реестра 25 окт 2026; код удалён Task 15 — коммит e50fc70) общим структурированным механизмом планирования/исполнения/проверки — для разовой задачи (SINGLE_RUN) и долгой программы (PROGRAM) одна persisted Plan-сущность с версией, approval-гейтом на создание/существенную правку и evidence-based завершением (голого «готово» от LLM недостаточно). Дизайн: docs/superpowers/specs/2026-07-12-structured-plan-engine-design.md; план реализации (Tasks 10-18 объединённого плана / Tasks 1-16 docs/superpowers/plans/2026-07-12-structured-plan-automation.md): docs/superpowers/plans/2026-07-12-agents-platform.md. Ключевые гарантии безопасности как реализовано: PLAN получает только internal control schemas (submit_plan/propose_plan_revision/request_plan_information), НИКОГДА action tools — они не регистрируются в ToolRegistry; approval — typed PlanCommands.approve(planId, version) от реального ChatIntent, не chat-сообщение; approved PlanVersion неизменяема; любая новая заявка планировщика по существующему плану — новая version, план уходит в AWAITING_APPROVAL, и исполнение останавливается до нового одобрения (fail-closed; PlanChangeClassifier в рантайме пока не вызывается); шаг GOAL исполняется в agent.toolNames ∩ step.expectedTools ∩ ExecutionPolicy; required criterion не закрывается без persisted PlanEvidence (PlanVerifier; MODEL_ASSESSMENT никогда не проверяет детерминированный критерий — DeterministicVerifierRegistry.check бросает на этом типе); декларативные plan-hooks (ON_PLAN_CREATED/ON_PLAN_APPROVED/BEFORE_PLAN_STEP/AFTER_PLAN_STEP/ON_PLAN_BLOCKED/ON_PLAN_COMPLETED через тот же HookEngine) не вызывают LLM/tool, не добавляют evidence и не мутируют approved план — только HookDecision, применяемый вызывающим кодом; одобрение запускает исполнение в фоне: PlanCommands.approve → PlanScheduler.sync ставит typed heartbeat (planId/planVersion/stepId) на следующий шаг — без расписания сразу, с расписанием в срок; HeartbeatRunner.firePlanStep исполняет один шаг и переставляет следующий, «Цель» делает то же на переднем плане; stale-версия (approval ушёл вперёд) пропускается, а не исполняет старый шаг; ответ каждого исполненного шага (текст и карточки) ложится в чат плана на обоих путях — иначе «План выполнен» приходил, а самого результата (меню, списка) не было нигде; тексты движка для человека (причины остановки blockedReason, баннеры оркестратора, сообщения фонового heartbeat, сводки доказательств) — на языке интерфейса через tr и с названиями шагов, а не id; русскими остаются промпты планировщика, исполнителя и проверяющего и диагностика проверки (причины в событиях плана; PlanRunner их пользователю не передаёт), пользователю они не показываются; «Попросить правки» сразу запускает ход PLAN с комментарием, а смена чипа режима не прячет карточку одобрения; background run никогда не ждёт UI approval (interactiveApproval=false → REQUIRE_APPROVAL становится blocked, не подвисший WorkManager); PlanRecovery после падения процесса помечает шаг COMPLETED только при уже persisted evidence этой попытки, иначе BLOCKED — side effect не повторяется; промпты планировщика и исполнителя шага несут «Сейчас» (без даты «завтра в 9» и сроки PROGRAM считались бы наугад), а проверка MODEL_ASSESSMENT не читает размышления модели — JSON-черновик из них не должен засчитаться вердиктом. План и Цель есть только у агентов из конструктора; обычный чат и пресеты — Чат/Рефлексия. Доменные шаблоны budget/nutrition/languages (assets/plan_templates/*.json) — зафиксированная методология пресетов (не выдумывать суммы, не проводить платежи; не ставить диагнозы/лечение, стоп при тревожных симптомах; интервалы SRS считает только код); пресетам планирование намеренно не выдано, поэтому сейчас их не читает ни один путь — не удалять (см. toDefinition). Task 12 закрывает TODO, оставленный Task 21 (user-agent-builder-848153): живая com.aiopenpocket.ui.plan.PlanCard в потоке чата (proposal-превью с Одобрить/Попросить правки, когда план AWAITING_APPROVAL; компактный прогресс с Пауза/Продолжить/Отменить, когда ACTIVE/PAUSED) — все действия типизированными ChatIntent-командами поверх PlanRepository/PlanCommands (Task 5), без второго approval-механизма; полноэкранные PlanListScreen (маршрут plans/{agentId}, секции active/paused/completed) и PlanDetailScreen (маршрут plan/{planId}: объектив/версия/статус, timeline шагов с критерием/evidence/сроком для PROGRAM, критерии выполнения, журнал событий, Пауза/Продолжить/Отменить — без approve/request-changes, это остаётся только за чатом); и сама секция «Планы» в AgentDetailScreen (счётчики active/paused/completed + список, честная пустая карточка у пресетов без планов)."
    flows: [chat]
  - id: chat-font-size-setting-c72418
    title: "Chat font size setting"
    rationale: "Дать пользователю выбрать размер шрифта сообщений в чате (4 пресета S/M/L/XL) в Настройках — надстройка НАД системным fontScale устройства, применяется только к тексту пузыря. Хранится по имени enum в DataStore (UserPreferencesRepository) рядом с лимитом витков; ChatFontScale.fromName разрешает неизвестное/старое значение в MEDIUM, а не роняет приложение. Множитель едет через ChatUiState.chatFontScale в параметр MarkdownText.fontScale (единственная точка рендера текста пузыря) и в StreamingBubble тем же множителем — иначе текст прыгал бы в размере при подмене стрима готовым сообщением. Масштабируется весь рендер MarkdownText внутри пузыря (тело/заголовки/списки/инлайн-код + неинтерактивная карточка-в-markdown); интерактивные driven-UI виджеты, поле ввода и тул-трейс — нет. TextStyle.scaledBy множит fontSize и только sp-lineHeight (em относителен кеглю и растёт сам)."
    flows: [chat]
  - id: smena-temy-svetlaya-temnaya-sistemnaya-palitra-lime-ink-paper-005bc6
    title: "Смена темы + палитра lime/ink/paper"
    rationale: "Дать юзеру выбор темы: тёмная залочка (darkTheme=true, LightColorScheme=DarkColorScheme) и фиолетовая Material-палитра были временными. Палитра lime/ink/paper и обе схемы (AppDarkColors/AppLightColors) заданы юзером дословно; error/onError падают на дефолты M3. Роль, которую схема не назвала, не остаётся пустой — Material подставляет свою фиолетовую: secondary/tertiary молчали, и всё, что рисуется через вторичные роли (выбранный чип «Чат» в баре, чипы сцен уроков, панель трассы инструментов), выпадало из палитры прямо в кадре ролика; с 28 окт 2026 оба семейства заданы явно (sage/sand), и AppColorSchemeTest валит сборку, если какая-то роль снова уедет в фиолетовый. Та же история с лестницей поверхностей (surfaceContainer*, surfaceDim/Bright, inverse*): на ней рисуются диалоги, меню и шторки, в том числе «Turn on Email? · Leaves the device» из ролика, а материаловская лестница с фиолетовым подтоном — теперь она в чернильных и бумажных нейтралях, и тест стережёт и подтон, и то, что лестница остаётся лестницей. Тон вторичного текста (onSurfaceVariant) поднят до AAA на своей поверхности: прежние #A0A0A0/#5C5C5C на устройстве читались на пределе. Режимы Светлая/Тёмная/Системная, дефолт Системная; ThemeRepository отдаёт режим реактивно (StateFlow) на обычных SharedPreferences (ui_prefs) — тема не секрет, в отличие от SettingsRepository/EncryptedSharedPreferences, и не тянет MasterKey на старте; проброс AppGraph -> MainActivity -> MyApplicationTheme(mode). Ключевое: 139 сайтов старых токенов были top-level val (PurpleAccent и пр.), физически не реагирующие на смену темы — переименованы в MaterialTheme.colorScheme.* (полный ренейм), иначе переключатель был бы фиктивным; компилятор служил чек-листом. Не-composable badge-хелперы (planStatusColor/stepStatusColor) используют raw-val LimeSignal, а не @Composable colorScheme. Glass — dark-first, минимальная theme-awareness через LocalThemeIsDark: тинты/BorderBrush флипаются на тёмные на светлой (glassCardSurface стал @Composable), но аврора на светлой ГАСИТСЯ (пустой список пятен, чистый PaperBg) — свечению нужен тёмный холст, на бумаге пятна дают грязь; намеренный минимализм, а не редизайн стекла. Дизайн: docs/superpowers/specs/2026-07-15-theme-switch-design.md."
    spec: "docs/superpowers/specs/2026-07-15-theme-switch-design.md"
    flows: [chat]
  - id: english-ui-on-the-demo-path-223241
    title: "Английский интерфейс (путь демо)"
    rationale: "Судьи хакатона Meta англоязычные, а приложение было только на русском: ролик с кириллицей и субтитрами не читается, и продукт для обучения не оценить, не прочитав его текст. Язык выбирается в онбординге и в Настройках и применяется сразу: интерфейс перерисовывается на месте, ответы агента — со следующего хода (язык уже уходил в системный промпт). Механизм — AppLanguage (снапшот-состояние Compose на весь процесс) и tr(ru, en) прямо у текста, а не строковые ресурсы Android: перевод всего приложения на ресурсы не по срокам, а пара в одном вызове не даёт строкам разъехаться. tr вызывается в момент показа, не в статических списках — иначе язык замёрз бы при первом обращении; статичные данные (уровни пути, названия инструментов, шаблоны агентов, карточки персон) хранят обе строки и выбирают геттером. Язык зеркалится и из Application — процесс, поднятый ради напоминания, пишет уведомление на выбранном языке; MainActivity ждёт язык до первого кадра, чтобы экран не мигнул русским. Уроки — английские копии в assets/lessons/en с откатом на русский, проверка уроков требует, чтобы копия совпадала с оригиналом по шагам. Переведён путь демо (онбординг, главная, путь и библиотека, уроки про модели Meta и видео, капстоун, агенты, конструктор, чат, настройки и запланированные задачи, разрешения, напоминания, уведомления); остальное приложение пока по-русски — это честно сказано в выборе языка. Что переведено, держит проверка T6c (screen-text-check-7c6d09): русский литерал на экране мимо tr() краснит check.py, а список чатов показывает уроки их названиями на языке интерфейса, а не id (чат урока хранится под id урока — по нему он открывается, поэтому название подставляет экран, не база). Тексты, которые пишет сама модель, тоже идут на языке интерфейса: заголовок и теги чата от аннотатора (иначе в английском списке чатов стояли русские заголовки) и поля профиля из рассказа о себе; заголовок нового чата — тоже. Мастер онбординга берёт стартовый выбор языка из текущего, а не «ru» по умолчанию: язык пишется в настройки сразу при выборе, и после перезапуска посреди мастера «Готово» записывало обратно русский. Промпты шаблонов агентов и навыков пока русские — модель всё равно отвечает на языке интерфейса по секции «Язык» препромпта; промпты план-движка (planner/executor/verifier) пока прямо требуют русский, режимов План и Цель в демо нет. Английские копии уроков стережёт T6b, и её область — все уроки, у которых копия есть, а не список демо-пути: 27 окт 2026 она была зелёной ровно на трёх уже переведённых уроках и молчала про двадцать семь непереведённых, то есть измеряла уже сделанное."
    flows: [chat]
  - id: sam-segmentation-boxes-in-a-lesson-c3ea52
    title: "SAM 3.1 обводит объекты на фото в уроке «Как модель видит»"
    rationale: "Урок how_model_sees учит, что модель видит не картинку, а то, что в ней нашла. Шаг video рассказывает это словами Muse Spark; шаг segment показывает буквально: ученик называет одну вещь («cup») — SAM 3.1 обводит рамкой каждую такую на его фото. Заодно это работа на прямом Meta Model API (api.meta.ai, Responses API, модель sam-3.1 — с точкой: sam-3-1 на маркетинговой странице опечатка), а именно его требует первый отсев судейства, и SAM есть только на нём, не на OpenRouter. Ответ SAM — не JSON с масками, а текст со спецтокенами («<0f>0<|box;x1=…;y2=…;w=…;h=…|><|mask;…|>»), поэтому разбор вынесен в чистый SegmentationParser с JVM-тестами: поля читаются по имени, а не по позиции; x2 и y2 включительные (right = x2 + 1), и без этой единицы рамки на 1280-пиксельном снимке уезжают; ноль совпадений — нормальный пустой ответ, а не ошибка, и его нельзя путать с «текст не в грамматике SAM». Маски на этом этапе только разобраны и хранятся сырыми: декодер масок — отдельное решение владельца про лицензию, но парсер переписывать не придётся. Клиент отдельный, по образцу VideoUnderstandingClient (Responses API, а не chat/completions; один вопрос — один ответ про одно фото), без исключений. Стрим собирается целиком по response.output_text.delta и закрывается response.completed: API присылает content_part.done, но не присылает output_text.done, и на него полагаться нельзя; поток без completed — это «неизвестно», а не «ничего не нашёл». 400 не повторяется (тот же запрос упадёт так же), 429 ждёт по Retry-After с джиттером, 5xx повторяются. Деньги: SAM берёт за картинку, а не за токены ($0.0025), поэтому расход пишется по usage.images_processed, а без usage — как одна картинка с пометкой «оценка»; живьём это не проверено, бюджет нулевой. Правило записи одно: приняла ли Meta картинку. После HTTP 200 вызов пишется в расход, что бы ни случилось дальше — нулевой ответ, нечитаемый ответ, поток без response.completed, обрыв при чтении, отмена экрана (последние три — с пометкой «оценка», потому что число картинок так и не пришло); отказ Meta (не 2xx) и событие error в потоке не пишутся: работа не состоялась. Это единственный путь в приложении, где тратятся личные кредиты ученика, и карточка расхода обязана его видеть. Фото сжимается до 1280 px и ПОВОРАЧИВАЕТСЯ по EXIF до отправки: SAM отвечает в пикселях присланной картинки, а BitmapFactory тег ориентации игнорирует — без поворота рамки на портретном снимке съезжают. Тег читает androidx ExifInterface (он уже ехал в APK через Coil, версия 1.3.7, теперь объявлен явно), а не платформенный: набор форматов платформенного зависит от версии Android, а повёрнутый PNG/WebP/HEIC из галереи, который он не разобрал, приехал бы боком вместе с рамками; на JVM эту разницу не показать — платформенный класс Android-версий Robolectric здесь PNG тоже читает. Рамки рисует приложение по w/h из ответа; метки класса в ответе нет, подпись — запрос ученика. Ключ — только Meta из Настроек (встроенного нет, OpenRouter SAM не отдаёт); у судьи его может не быть, поэтому карточка прямо говорит, что нужен ключ и где его взять, шаг пропускаемый («Дальше» остаётся, а красная плашка проблемы шага уходит вместе с курсором урока — у неё свой слот ChatUiState.lessonStepProblem, отдельный от ошибки упавшего хода: та переживает «Дальше» и держит «Повторить», потому что сессия хода пересчитывает её при каждой смене списка сообщений; иначе «нужен ключ» висела под абзацем о приватности, под квизом и под карточкой «Урок пройден»), а ошибки ключа, оплаты и доступа к модели объясняются отдельными фразами. Слово, которое набирает ученик, проверяется до вызова: одно понятие, без списков и команд и только латиницей — русская «чашка» иначе уйдёт в платный вызов и вернётся пустой, а на русском экране это первое, что наберут; карточка объясняет, почему не так и что набрать. store:false просит API не хранить запрос: фото ученика не должно оставаться у Meta (как Meta это исполняет — не проверено). В лог идёт длина текста ответа, а не он сам: проза модели может описывать чужое приватное фото. Фото-пример из сборки — в один тап, как у видео: камера и свет не должны стоять между учеником и смыслом шага. Фото уходит в Meta целиком, и карточка говорит об этом, как и абзац о приватности в уроке (там теперь не только видео). Снятое камерой фото удаляется после разбора, в том числе когда разбирать некому (ранний выход), а то, что осиротело, подметается: оригиналы камеры через час, сжатые копии для карточек результата через сутки и сверх пяти штук — личное фото не должно лежать в кэше вечно только потому, что карточка однажды его показала. Вызов по картинкам виден в списке «ПО МОДЕЛЯМ» карточки расхода: у него нет токенов, и по токенам он всегда последний, а в свежем демо это единственный вызов, который стоил денег. SAM не добавлен в models_meta.json: это не чат-модель, и в пикере моделей появился бы неработающий пункт."
    flows: [chat]
  - id: screen-text-check-7c6d09
    title: "Проверки T6c и T6d: русский текст мимо tr() — на экране и в шаге от человека"
    rationale: "Проверка T6 («650 пар, все английские») была зелёной, пока на эмуляторе с английским интерфейсом целые экраны демо-пути оставались по-русски: она читает только английскую сторону пары tr(ru, en), а строка, которая вообще не прошла через tr(), ей невидима. T6c читает остальную половину: русский литерал там, где Compose его рисует, — FAIL. Позиции перечислены, а не угаданы: именованные аргументы text, contentDescription, label, placeholder, title, supportingText, headline у любого вызова (и их значения по умолчанию в объявлении), первый позиционный аргумент Text, Button, TextButton, OutlinedButton; внутри аргумента считаются сам литерал, ветви if/else, элвис, конкатенация и шаблон, а вложенный вызов — нет, поэтому русская сторона самого tr() проходит. Комментарии и KDoc не код; файлы *Previews.kt и функции с @Preview пропускаются по имени — это фикстуры, пользователь их не видит. Исключения только по пути файла и с причиной (SCREEN_RU_EXEMPT), а сцены уроков, которых нет по-английски, привязаны к проверяемому факту: пока нет assets/lessons/en/<урок>.json и именно этот файл рисует сцену этого урока, исключение действует; когда копия появляется, оно гаснет само, и русская сцена вокруг английского урока краснит проверку, а не прячется за ней — иначе получились бы английский текст урока и русская анимация под зелёной галочкой. Проверка — сетка для прямой формы записи; русскую строку, переданную по имени (val, список, Triple, обёртка вроде SectionLabel), и тело обычной лямбды она не видит, там остаётся прогон на устройстве с английским интерфейсом. Лексер свой, без зависимостей; исходник ASCII, потому что консоль владельца в cp1251. Тесты — tools/test_check_t6c.py: каждый случай «должно краснеть» — русский литерал в позиции, которую проверка обещает читать. С 28 окт 2026 в этой же фиче живёт T6d — та же слепота в третий раз. T6 мерила английскую сторону пары, T6b — уроки, у которых копия уже есть, T6c — экранную позицию: все три смотрят на место, где строка НАПИСАНА. Текст ошибки хода пишется не на экране — userFacingLlmError в OpenAiCompatClient.kt возвращает голые русские литералы, вызывающий кладёт их в StreamEvent.Error, а экран рисует пришедшее через переменную (state.error): три зелёные проверки и русский красный баннер в английском уроке на эмуляторе. T6d мерит другой конец — место, где строка ПОКАЗАНА. Сток — вызов, который заведомо отдаёт строку человеку, и каждый назван с обоснованием: StreamEvent.Error (баннер ошибки в чате), showAgentNotification и setContentTitle/setContentText (уведомление), launchExternalActivity (уведомление вместо запуска из фона), TurnNotifier.turnFinished (пуш о конце хода). «Похоже на сообщение» стоком не считается, текст для модели — тоже. Читаются две вещи: голый литерал в аргументе стока и ОДИН шаг косвенности — вызов по простому имени функции из того же файла, и тогда литералы её тела считаются её результатом. Один шаг, а не произвольная глубина: этого хватает на настоящий случай и это честно делается лексером, а не фронтендом Kotlin. Внутри разобранной функции проверка нарочно перебирает лишнее (любой русский литерал тела вне вложенного вызова) — функции, которая существует ради текста для человека, голый русский литерал не нужен вообще. Чего T6d не видит — два шага косвенности, помощник в другом файле, строку через переменную, параметр или поле, строку, собранную чужим вызовом, вызов с получателем, значение по умолчанию у параметра самого стока и любой сток вне таблицы — записано списком прямо в проверке: проверка, про которую не сказано, чего она не ловит, через месяц опять станет «зелёной и потому надёжной». Тесты — tools/test_check_t6d.py: рядом с каждым случаем «должно краснеть» стоит он же с английским текстом, который обязан пройти."
    flows: [chat]
  - id: approval-outcome-honesty-554a8c
    title: "Отказ и неответ — разные исходы подтверждения"
    rationale: "Приложение говорило человеку, что он отказал, когда он ничего не видел. Найдено на Android 14 (28 окт 2026): попросить черновик письма и свернуть приложение — карточка «Агенту нужно разрешение» жила только на экране чата, в шторке висело «Агент отвечает…», через две минуты подтверждение протухало, и модель получала один текст на два разных события — «declined it or did not answer in time». «Или» модель разрешила против человека: «Not sent — declined in chat.» Подтверждения — несущая часть проекта: политика «DESTRUCTIVE и EXTERNAL всегда спрашивают» записана в mcp-tools-f77d9b, ей учат уроки, и она идёт в ролик; система, которая вешает на человека решение, которого он не принимал, подрывает ровно то, что демонстрирует. Первая половина починки: исход перестал быть Boolean. ToolApprovalCoordinator.awaitApproval отдаёт ApprovalOutcome (APPROVED / DECLINED / UNANSWERED), и DECLINED рождается ТОЛЬКО от resolve(approved=false), то есть от нажатой человеком кнопки; таймаут, cancelRun и abandonAllPending (бывший denyAllPending — имя со словом «deny» само приглашало отчитаться об отказе) дают UNANSWERED. Каждому исходу — свой текст для модели в ApprovalResultText, и текст про неответ намеренно не содержит слова про отказ ни на одном языке: модель повторяет заметное слово, а не отрицание вокруг него, поэтому «не говори, что он отказал» было бы хуже, чем молчание об отказе. Текст английский, как и остальная речь самого тул-лупа к модели (инструменты отвечают модели по-русски, см. AGENTS.md; здесь говорит движок, а не инструмент). Вторая половина: человек должен увидеть запрос, когда приложение свёрнуто. Пуш «Агенту нужно разрешение…» был заявлен ещё в fonovye-hody-agenta-dde42d, но проверка переднего плана делалась ОДИН раз — в момент появления запроса. Настоящий порядок событий обратный: человек просит черновик, запрос появляется, пока чат ещё перед ним, и только потом он убирает телефон. Одноразовая проверка видела открытый экран, решала, что пуш не нужен, и запрос доживал своё окно молча. Теперь TurnManager спрашивает снова каждые две секунды, пока запрос жив (порт PendingApprovals поверх ToolApprovalCoordinator.isPending — чтобы не дёргать пушем по уже отвеченному запросу), и шлёт пуш, как только экран ушёл. Третьего механизма не заводили: передний план — тот же ForegroundState, уведомление — тот же TurnNotifier, а цикл ограничен и окном подтверждения, и счётчиком: совравший порт не оставит корутину на всю жизнь процесса. Окно подтверждения — 10 минут вместо двух. Две минуты были рассчитаны на того, кто смотрит в чат, а весь смысл пуша в том, что он не смотрит: окно, истекающее раньше, чем человек дойдёт до телефона, превращает подтверждение в театр. Висеть вечно оно тоже не может — ход держит диалог и контекст модели. В свёрнутом приложении обычно раньше срабатывает защита shortService (около трёх минут), и ход честно падает с «Повторить»: ход, который остановила система, — честный ответ, а отказ, которого человек не делал, — нет. Запрос регистрируется в координаторе ДО того, как о нём объявлено: событие ToolApprovalRequired уходит из коллбэка awaitApproval уже после регистрации. Раньше событие уходило первым, и сторож пуша, успевший запуститься раньше регистрации, видел «не ждёт», принимал это за «уже ответили» и не пушил никогда — на Android 14 29 окт 2026 пуш приходил через раз; «Разрешить», нажатое в этот зазор, тоже терялось. Текст про неответ не обещает и обратного: когда окно закрылось, карточки больше нет и позднее «да» некуда нажать, поэтому модель предлагает сделать это, когда человек попросит снова, а не говорит «сделаю, как только подтвердишь» — это неправда того же рода, что «ты отказал», только с другим знаком. Пуш в новом чате, у которого ещё нет заголовка (он появляется после первого хода), озаглавлен «Нужно разрешение», а не «Агент ответил»."
    flows: [chat]

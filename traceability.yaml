# traceability.yaml -- manual source of truth (edit by hand).
# Each feature has a FROZEN id, a human title, and most importantly WHY it
# exists (rationale). The code<->feature map is derived by `traxer scan` and is
# NOT stored here.
lang: en              # spec-draft language: de|en|es|fr|it|ru
features:
  - id: photos-in-chat-bca88e
    title: "Photos in chat: attach a photo to a message and Muse Spark sees it"
    rationale: "The owner, Nov 3, 2026, testing an air-fryer agent on their phone: you could not attach a photo to a chat at all, while the obvious question for such an agent is “what can I cook from this?” with a picture of the fridge. Muse Spark reads images, so only the app was missing. The input gets a photo button (system photo picker, which needs no storage permission, or the camera into the app’s own cache file, the same capture the SAM lesson uses) in Chat and Reflection; Plan and Goal build their own messages and would drop the photo, and lessons have their own photo steps, so they offer none. The picked photo is copied right away into the app’s files as an upright, downscaled JPEG (prepareSegmentPhoto, shared with the SAM lesson): the picker’s URI stops resolving later, and the photo must still show in the chat and reach the model on Retry. The message stores only that path (messages.imagePath, schema 15). On the wire the client turns it into the OpenAI-format content array with an image_url data URL; only the newest user message sends its photo, earlier ones leave a one-line note instead, because re-sending every photo would bill all of them on every turn. A photo alone can be sent; it goes with a default question that is visible in the chat. Schema 14 to 15 is an AutoMigration that only adds the column, an exception to the destructive pre-release policy so the owner’s agents and chats were not wiped the day before the deadline."
    flows: [chat]
  - id: streaming-llm-chat-6595a1
    title: "Streaming LLM chat"
    rationale: "Stream replies from an OpenAI-compatible LLM over Ktor SSE, with fallback between the provider's models (there is no cross-provider fallback, see vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53; fallback is forbidden after the first emit so that a fragment never lands in the chat). encodeDefaults=true is mandatory, otherwise strict providers return HTTP 400 “missing field type”. Reasoning models (Muse Spark always reasons) return their reasoning in a separate field; in Meta Model API that is reasoning_content (the parser also reads delta.reasoning, in case of an OpenAI-compatible gateway); if content never arrives, the reasoning is returned as the answer so the turn does not end on an empty screen. A key rejection (401/402/403) stops iterating at once, since the next model of the same provider would get the same answer; a turn error is shown in the interface language (through tr, because a bare Russian literal reached an English-speaking judge verbatim) and says what to fix instead of showing the provider's raw JSON; the text about the key and billing always names Meta Model API (there has been a single route since Oct 30, 2026), and an empty key (blank_key) gets its own message, “Add your Meta API key”, pointing to Settings, rather than a raw HTTP 401 (see vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53). A finish_reason “error” in the middle of a reply is an error with “Retry”, not a fragment passed off as a finished answer. A chat turn is the shared ReAct loop ReactLoopRunner (reasoning → tools → observation, up to 10 rounds; all tool_calls of a round go in one assistant message, and each one gets its own tool response, otherwise Meta's strict API answers 400); reflection, the plan engine and heartbeat use it too. TUTOR is a one-off question during a lesson: no tools, one round. An empty reply does not count as a reply: HTTP 200 without a single token (this is how a provider serves a degraded model; there was a live case on NIM) moves on to the next model, otherwise the turn dies as an empty message while the chain still has live models. The terminal Finish is therefore held back until the end of the attempt: otherwise the fallback would push the end of the turn to the consumer before the real answer. The Ktor engine is injected because the model chain cannot be covered by a test without swapping out the transport. A reply cut off by max_tokens (finish_reason “length”) does not go further down the chain, since another model would hit the same ceiling: complete text stays, marked “…(reply truncated)”, while reasoning alone with no answer, or an unfinished tool_call, is an error with “Retry” (a fragment of arguments must not be executed). HTTP 400/413 also stop iterating: the request is rejected on its merits (too long, an unsupported attachment), and the next model would reject it the same way. A reply that is only reasoning is marked (“💭 No answer, here is the model's train of thought”) and carries the reasoning flag, so that the annotator, plan verification and profile parsing do not mistake a draft from the reasoning for a result. The history budget (~48k tokens) is always applied, not only to long dialogs: a couple of pasted walls of text produced a 400 disguised as “no network”; the older part of the tail is cut first, then the beginning, the last 6 messages last of all, and the current message never. Only the final result of a saved reflection reply goes into history. When the round limit is hit, one more model call follows, asking it not to call tools and to say briefly what was done, what was not, and what can be asked for next: Meta's agents guide considers a run without a final assistant answer a failure, and gluing the preambles together in the chat was not such an answer. The tools in this call are the same as in the run: the history contains tool_calls, and the strict API checks their names against the declared ones (Meta only supports tool_choice auto, so “no tools” is said in words, and an accidental call is ignored). If the call fails, the glued text and the old limit banner remain; if it succeeds, the banner is not appended, otherwise there would be two endings in a row. A stop by a hook or by the tool budget does not trigger the final message, and neither does a plan step: such a step becomes BLOCKED and nobody reads its text, so the call would be paid for in vain. The system prompt is assembled from stable to changing (base, lesson, language, role, skills, instructions, then plan, “Now”, memory): Meta has an automatic PREFIX cache, and a minute-level timestamp in the third section reset the cache for everything after it every minute; the hook's ephemeral instruction meanwhile stays at index 1, next to the system prompt: at the end of the list it would become a system message after tool results, and strict chat templates may reject that; only agents with an ADD_INSTRUCTION hook pay for it in cache. Debug logs containing user text and tool arguments are written only in the debug build. Checking against Meta's documentation (Oct 29, 2026) led to three client fixes. (1) Reasoning effort is now set explicitly instead of being left to the model: reasoning is billed as output and shares max_tokens with the answer, so an answer to a lesson question at the “model default” could go entirely into thinking. The mode decides the level (a lesson answer is low, chat is medium, plan and reflection are high; GOAL runs at medium, but replanning inside it is high), and the level travels in the coroutine context (ReasoningEffortContext) rather than as a streamChat parameter: LlmClient is called from seven places, and PlanStepRunner mirrors the ReactLoopRunner.run signature one to one. The field is Meta Model API's top-level reasoning_effort; it is not sent at all to models without the reasoning flag, and the value none is not used, since Muse answers it with 400. The field was added from the documentation, not from a live response, so a 400 on a request with it is retried once without it: otherwise a 400 would break the whole chain, and the turn would fail because of a field it had worked fine without. Only if the request without the field succeeds is the model remembered until the process ends and no longer sent the field; a 400 for an overly long context fails in both forms and does not switch the field off. max_tokens is unchanged, 16000. (2) tool_call arguments that do not parse as JSON no longer become an empty map: the tool used to answer “missing argument”, and the model fixed the wrong thing. Instead, the map carries a marker with a short fragment of what was sent (MalformedArguments), and ToolExecutor answers, before schema validation, “the arguments are not valid JSON, send the call again”. An empty arguments string still means a tool call without parameters. ReactLoopRunner cuts off a call carrying the marker even before the approval gate and does not count it toward the tool budget: otherwise the person would be asked to permit a DESTRUCTIVE/EXTERNAL call that would not run anyway, and in PREVIEW the simulation would report success. (3) On 429/500/503 the same model is retried with backoff (1 s, 2 s + jitter, Retry-After wins if it is longer; at most three attempts per model and 20 s of waiting for the whole turn), and only then does the chain move on; a Retry-After that does not fit the budget (60 s for “overloaded”) skips the wait right away. 504 is not cured by retrying, 400/401/402/403/404/413 are never retried, and neither is anything after the first emit. The backoff calculation is shared with SegmentationClient (RetryBackoff) so the two clients cannot disagree about what “wait” means."
    flows: [chat]
  - id: vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53
    title: "Meta models: direct Meta Model API only, the user enters the key"
    rationale: "The app runs on Meta models and talks to them only through the direct Meta Model API (api.meta.ai): the Meta hackathon's first cut (Stage One) counts “Meta Model API and/or Meta open weights”, and that is a hard requirement, not a wish; on top of that, SAM 3.1 and Voice Transcribe are only available there. The owner removed OpenRouter entirely on Oct 30, 2026 (the key, the catalog, the route, and its branches in the chain, settings and lessons): it is literally neither of the two, and every extra intermediary is one more recipient of user data, one more price list and one more key to explain. LlmProvider therefore has a single value, META; SelectedLlmProvider stays as a seam so that consumers (the agent loop, heartbeat) do not have to know about this. Only the person enters the key: in onboarding (a separate step before the first model call, which can be skipped) or in Settings; both places store it the same way (SettingsRepository.setApiKey(META, key.trim()), EncryptedSharedPreferences). There is no built-in key in debug, in release, or in any build (decision of Oct 26, extended on Oct 30): the repository is public, the secrets plugin copied .env into BuildConfig inside the artifact, and a built-in key would hand the owner's credits to anyone who builds the project. The plugin and its release guard (checkReleaseSecrets) are removed, so there is no longer a path from .env into BuildConfig, and tools/check.py (T4: no plugin and no key buildConfigField; T4a: no keys in the APK at all) and the test BuildConfigHasNoKeysTest will not let it come back. Keys are stored with surrounding whitespace trimmed: otherwise pasting from the clipboard would give a 401 with a correct key. Old OpenRouter and NVIDIA keys left on an updated device are wiped on the first access to the storage. A missing key is not a 401 from Meta but a clear “Add your Meta API key” with a button to Settings: ModelKeyGate is checked where the model starts being called, in TurnManager.runTurn (chat, lessons, plan/goal, the builder's test run; the user's message stays in the chat, and “Retry” finishes the turn once the key is entered) and in HeartbeatRunner (the background turn is skipped silently and the reason is written to the run result, with no push and no retry: in the background there is nobody to ask); OpenAiCompatClient keeps its own last-resort blank_key check for everything that bypasses these two places. The Meta catalog is static (models_meta.json: Spark 1.3 → 1.2 → 1.1, with Wonder last because it is 3 to 5 times more expensive), and ids have no vendor prefix. Meta returns only tokens in usage, so the app computes the cost from Meta's price list (metaListPriceUsd), otherwise spending on the user's credits would have no money attached; SAM 3.1 charges per image rather than per token and is counted separately (samCostUsd, see sam-segmentation-boxes-in-a-lesson-c3ea52). The course teaches on Muse and explains Meta's models, and an agent answering with someone else's model would teach one thing and show another; that is why NVIDIA NIM was removed on Oct 25, 2026, and earlier GROQ, GITHUB and the cross-provider AUTO; there is no cross-provider fallback and there will not be one. Fallback happens only between models (Muse Spark 1.3 → 1.2 → …) and is capped at five attempts: after three refusals the problem is no longer the model but the key or the network. Only models with function calling: without tools the agent loop and the plan engine silently degenerate. Contributor versions of Muse, whose data the vendor trains on, are not used anywhere: the profile, the diary and photos all go through the app. The reasoning-effort field is the top-level reasoning_effort (see streaming-llm-chat-6595a1); it is sent only to models that have reasoning=true in the catalog. An agent from the builder can name its own model (AgentDefinition.model, null = automatic): the WONDER or SPARK family rather than an id, because a stored id goes stale when a new version ships (muse-wonder-1.0 → 1.1), while a family is resolved against the active catalog, and ProviderFallbackChain puts the family's best model first, with the rest following catalog priority. If there is no such model or the key is unknown, it quietly falls back to the normal chain (with a log entry), and the turn does not fail. The model travels in the coroutine context (AgentModelContext) together with TurnContextHolder, so chat, reflection, plan steps, heartbeat and the scheduler all get it without a new parameter. Muse Image and video understanding used to go only through OpenRouter: their clients currently get an empty key and honestly answer “unavailable” (TODO(meta-only follow-up) in LlmModule), and moving them to the Meta key is a separate task. There is no longer a global model choice in Settings (the owner, Oct 31, 2026: the model is an agent's knob, not the app's): the chain follows catalog priority, and a previously stored choice (selected_model_META) is wiped when the storage opens, otherwise it would stay invisible and impossible to undo."
    flows: [chat]
  - id: agent-memory-05e545
    title: "Agent memory"
    rationale: "Keep short-term, long-term and episodic memory in Room so the session can be restored and context recalled. Episodes (records of tool calls) go into the prompt in short form, “[tool action] result”, with the result on one line of up to 300 characters, rather than as raw tool output: otherwise third-party text from files and the calendar would settle into every following request. recall_episodes sees only the current chat and no more than 20 episodes. Facts in the prompt: if there are 40 or fewer, all of them, newest first (word search lost the right fact when the question was phrased differently from the fact); if there are more, a ranked search with Russian stop words and a crude word stem. A regular chat does not get agents' facts (the agent: namespace), the facts section is capped at 300 characters per line and 3000 in total, and facts already shown in the profile are not duplicated. The person's profile (six user.* lines in the profile category) is read back by the same repository that writes it during onboarding (getUserProfile, keys in UserProfileKeys), and the shared facts, meaning everything outside agent:<id>:, are visible to the person on the “Profile” screen (profile-screen-7354a7), where each one can be forgotten by id."
  - id: mcp-tools-f77d9b
    title: "MCP tools"
    rationale: "A set of local tools in the spirit of MCP (a name plus a JSON schema, executed in-process, without an MCP server): memory, agent storage, a file sandbox and files via SAF, allowlisted database reads, notifications, heartbeat, WorkManager, the alarm clock, the calendar, an email draft, the step counter, the SRS vocabulary, cards, skills and web search. The only tool that goes out to the network is web_search (web-search-tool-c73ed8); the rest are local, because the app is local-first. Every call gets schema validation, a 30 s ceiling (web_search has its own, 60 s, via Tool.timeoutMs), a risk class per call (Preview simulates writes), and third-party text reaches the model fenced in <tool_output trust='untrusted'>. The default rule (since Oct 25, 2026): reads and writes go through on their own, while deletion (DESTRUCTIVE) and sending outside (EXTERNAL) always wait for “Allow” on the approval strip in chat and are forbidden in the background, even without hooks and in a regular chat: a model that has read a third-party file must not decide on its own to erase a document or hand text to another app. That is why storage_tool.delete and external_files.write_file (mode “wt” overwrites the user's document) are DESTRUCTIVE, and email is EXTERNAL (the mail client saves the draft to the server even before “Send”). “Decline” (or 2 minutes of silence) reaches the model as the user's decision, not as missing access: the model read a bare “not approved” as a disabled permission and sent the user to Settings to turn email on. The alarm clock and email open another app only in the foreground; from the background they post a notification whose tap opens the same action, and the model is told honestly that the job is not done yet. cancel_work cancels only work_manager's own tasks, not heartbeats and not system workers. File sandbox paths behave the same on any OS: a backslash is rejected (on Android it is just a character in a name, on Windows it is a step up), an absolute path into another sandbox or into the app's shared data is rejected, and one into its own sandbox is accepted as is; a short “/notes.txt” is resolved from the sandbox root. Without this, on Android an absolute path was silently re-rooted inside its own sandbox as nested folders, and the tests on Windows did not see it. The call trace and labels are in Russian, and each tool has a single name across the whole app (CapabilityNames: the approval strip, the trace, “Using tool…”, agent cards, the builder), otherwise the same tool would be called something different in three places, or shown by its raw id. Call arguments that do not parse as JSON are returned by ToolExecutor to the model in plain words (“not valid JSON”, with a short fragment of what was sent) rather than a faceless “missing argument”: otherwise the model fixed a value when it was the JSON itself that was broken."
  - id: driven-ui-cards-0418d0
    title: "Driven UI cards"
    rationale: "Let the LLM render UI cards (todo/table/chart/timer/form/choice/image) right in the chat through render_card. General widgets are interactive in any chat, including next to the text of a reply; lesson cards work only in a lesson and fall back to markdown in other chats. The switch and weather_card templates are retired (RETIRED_CARD_TEMPLATES): the switch did not switch anything, and there is nowhere to get weather from since there is no web; old messages with them still render, a new call gets “unknown template”, and the builder does not offer them. A lesson fill card has a list of accepted answers (case, spaces and the Russian letters yo/ye do not matter), and after two misses it shows the correct answer and lets the learner continue: getting stuck on one word is worse than a hint. A sort card does the same: after a miss it says how many items are already in place, and after two misses a “Show the order” button arranges them and lets the learner continue (a learner was stuck on the Builder order on a phone, Nov 3, 2026). An image (template image) is loaded with Coil: SVG and raster, the asset first (offline) with a fallback to the URL; a lesson image with an image_prompt gets a “Draw it for me” button (see kartinki-urokov-cherez-muse-image-fd6f8c). The same engine draws the interactive lesson cards: reveal/concept/example (display) and fill/sort/match/scenario (answer checking, which advance the lesson like a passed quiz), plus lesson_video, a sample clip in one tap or your own (record or pick) for Muse Spark (see video-na-vhod-v-uroke-muse-spark-08ccdb), and lesson_animation, a procedural lesson scene (see protsedurnye-animatsii-v-urokah-68b2bf), as well as lesson_segment (photo and word input for SAM) and lesson_segment_result (the photo with boxes around what was found; an empty list of boxes is a normal “found nothing” answer, not an error), see sam-segmentation-boxes-in-a-lesson-c3ea52. Only the lesson controller puts these two cards into the chat: render_card does not have them. The builder needs the multi_choice template in chat: a single choice answers on the first tap and cannot express “Memory and Reminders”. Several checkmarks and a “Next” button; the answer is sent as a user message (labels separated by commas, in card order), as with choice. After “Next” the card is locked and remembers the answer in messages.cardState, otherwise after returning to the chat a second answer to the same question could be sent to the model. The parser parses and repairs the min and max numbers and the list of pre-checked options, while the tool itself checks in code that there are 2-4 options and one question per card, returning the reason to the model: a wall of ten items is not a question. The agent_review card is not offered in render_card: it comes from the result of finish in agent_draft."
  - id: swappable-persona-e5e65e
    title: "Swappable persona"
    rationale: "Let the user pick one of 7 personas in Settings without recompiling. The persona is fixed in a dialog when it is created, including in a chat started by the voice assistant, and a change applies to new chats: a conversation does not change character halfway through."
  - id: background-tasks-15a34a
    title: "Background tasks"
    rationale: "Delayed and periodic notifications through WorkManager (the work_manager tool, with a 15-minute minimum for periodic work) and a “Scheduled tasks” screen in Settings with a list and cancellation. The screen shows only this tool's tasks (by its tags): heartbeat reminders have their own card with “Cancel” in the chat, and the user has no need for system workers. The title and text travel in WorkRequest tags, since WorkManager stores no other metadata; cancellation uses the unique name from the tag, otherwise the work id; the state is shown in words in the interface language. The tool cancels only work with its own id:<work_id> tag: the model can guess the name heartbeat_<id>, and cancelling someone else's reminder or plan step through work_manager would bypass the ownership check in heartbeat."
  - id: ai-academy-onboarding-5d51bb
    title: "AI Academy / onboarding"
    rationale: "Onboarding has four steps: language, introduction, the Meta Model API key (which can be skipped), and telling about yourself; the wizard does not ask for a persona (on first launch there is nothing to compare against), it can be changed in Settings. The key step comes before the first step that calls the model (parsing what you told about yourself): no build has a built-in key, the person brings the key themselves, and it is stored the same way as in Settings (with surrounding whitespace trimmed). If the model is unavailable (the key was skipped or there is no network), the self-description is saved as is and onboarding finishes: the key can be entered later in Settings, and a dead end on the “Done” step would lock the app. The “Agent Path” is an ordered list of concept lessons (the order is pedagogical); the order is set in code: ROADMAP_LEVELS (the path) and LIBRARY_LESSON_IDS (the library). The available languages are Russian and English (see english-ui-on-the-demo-path-223241): the choice immediately switches the interface and the language of the agent's replies (the label of the wizard's main button is read at display time, not stored in state, because choosing a language rebuilds the state before the language changes); the introduction text is plain text without markup, streamed into a bare Text; no other languages are planned, and none are shown in the picker. Lessons about Meta's models (who is who, Muse Spark's modes, how Muse Image draws, open weights and the API) sit next to the topics they build on: after video, after temperature and after privacy, because the course runs on Muse and the learner should know which models are answering them. The order (Oct 25, 2026): first what AI and an agent are, then the prompt, tokens, video, Meta's models and Muse Spark's modes (thinking models are introduced there, while tokens are fresh), memory and the context window, in the first half, before privacy, which builds on them; then workflow → chains → ReAct → tools → skills → context → approvals → hooks → building an agent, after that the Plan/Goal modes, plans, reflection, heartbeat, the arena and the capstone. Each lesson relies only on what has already been covered, and the “in the previous lesson” references have been checked. The capstone leads to the builder with an “Open the builder” button: the lesson's five questions are the builder's steps. RAG is only in the Library, after context engineering. Implemented beyond the original spec. Path lessons are no longer locked by level (Oct 31, 2026, the owner's decision): the theory is for getting acquainted, and the lock kept a newcomer and a judge 29 lessons away from the capstone. Any lesson opens in any order; the Path only marks completed lessons and highlights the first uncompleted one as “next” (pathStatuses)."
  - id: multi-chat-conversations-b3c93b
    title: "Multi-chat"
    rationale: "A list of dialogs and switching between them: the title, summary and tags are written by a background annotator (every few messages, with the same model as the chat, separately from the turn, so the turn does not wait for the annotation and does not fail because of it; one at a time per dialog; it does not read the model's reasoning), tags drive the list filter and the memory graph; favorites on top; background turn badges “brewing/done/error”; an empty “New chat” is reused rather than multiplied; deleting a dialog first stops its turn and heartbeats (they have no FK to conversations). The annotator is asked for a neutral name of the topic or task as the title, not a conclusion: on the emulator a chat with an email awaiting approval got the title “Declined emails to Masha”, a verdict about the user in the chat list that judges see; so the role and tone are set in the prompt up front, with a “bad/good” pair, and there is no word filter (a list of verdicts is never complete). The annotator leaves lesson chats alone: their title is the lesson id, which is how the lesson is opened, so the chat list substitutes the lesson name in the interface language at display time (Conversation.displayTitle), while the stored title stays the id; the push about a finished background turn is labeled with the same name (the TurnPersistence adapter in TurnModule). The agent builder's test chats do not appear in the list (a service tag “__…” that the annotator does not overwrite). Implemented beyond the original spec."
  - id: rezhim-refleksii-fca3c4
    title: "Agent mode: reflection"
    rationale: "Reflection is the AgentMode.REFLECT mode, the “Reflection” chip in any chat (a regular one, a preset's, or a built agent's that has this mode): ReflectionOrchestrator runs draft → critique → final on top of ReactLoopRunner to improve answer quality. The draft and the final run with the agent's tool, skill and memory scope; the critique is a single call without tools. The whole pass is saved to the chat, cards come only from the final; an empty final is an error with “Retry”. The final gets only tools whose actions are all reads, plus render_card, and a list of what the draft already called, marked “already done, do not repeat”: otherwise a write made by the draft would be made a second time (two reminders, two files). Only the final from a saved pass goes into the history of following turns: the draft with the critique would triple the message and slip the rejected version in as something that was said."
    flows: [chat]
  - id: uroki-kontseptsii-v-chate-po-json-kontraktu-0a70c2
    title: "Concept lessons in chat (JSON contract)"
    rationale: "JSON lessons (assets/lessons) are driven by a chat controller as a strict step contract (1 step = 1 assistant message): code drives the steps, keeping them separate from LLM commands. Step types: text, quiz, image (SVG/raster; asset|imageKey first, then a Muse Image picture from imagePrompt, see kartinki-urokov-cherez-muse-image-fd6f8c, then the URL), video (a sample clip from the build or your own → Muse Spark, see video-na-vhod-v-uroke-muse-spark-08ccdb), segment (the learner's photo → SAM 3.1 outlines on the photo what they named, see sam-segmentation-boxes-in-a-lesson-c3ea52), animation (a procedural scene in Compose, see protsedurnye-animatsii-v-urokah-68b2bf), and the interactive reveal/concept/example/fill/sort/match/scenario. They open from the Path, the Library and Home. A fill step carries answers, the accepted answer variants next to the main answer (the lesson lint rejects empty ones). Lessons teach what the app actually does (the trace “Tool: action → ok”, the approval rule, history trimming without a summary, PlanCard statuses): a lesson that contradicts the screen teaches you to trust neither. Selected quiz answers are stored on the card message (messages.cardState, a string like “0:2,1:0”), not in composition state: that state is lost when the person leaves the lesson screen, and on returning they saw the quiz as not taken. It is kept separate from cardSpec: the spec is authored content, and this is what the person did with it. A fully completed quiz that is shown again does not move the lesson cursor again: it was already moved the first time through."
    flows: [chat]
  - id: kartinki-urokov-cherez-muse-image-fd6f8c
    title: "Lesson images via Muse Image"
    rationale: "A lesson image step can carry an imagePrompt: if the step has no asset of its own, Muse Image draws the picture (since Oct 30, 2026 the app talks only to Meta Model API and OpenRouter is gone: the client calls POST /v1/images/generations with the Meta key the person entered themselves; there is no built-in key, the repository is public, and someone else's key would hand out the owner's credits; without a key the client sends nothing, the lesson shows the pictures from the build, and “Draw it for me” asks you to add a Meta key instead of saying “unavailable”) and stores it in filesDir/lesson_images under a hash of the model and the full prompt. The bundle remains the first source, since it works offline and costs nothing; drawing happens only where there is no picture. The cache is on disk, not in cacheDir: every generation costs money and tens of seconds, and the system clears cacheDir whenever it wants. A single prompt is drawn at most once at a time, otherwise the lesson prefetch and the step display would pay for the same frame twice. Prefetch runs in a separate coroutine from the start of the lesson, because Muse Image thinks before drawing; the step display waits for the picture no longer than 20 s and goes ahead without it: holding the user on “Next” is worse than showing the step without a picture, and “1 step = 1 message” holds whatever the outcome. The request contains only fields Meta documents (model, prompt, size, response_format, output_format): Meta answers any unfamiliar top-level field with a 400 (and moderation on this model is also a 400) instead of a picture, so the uniform “no lettering” style is set by the prompt itself, and the 16:9 frame by size, which only sets the aspect ratio. The response has no image type, so it is taken from output_format. 429 and 503 are retried with the Meta backoff (RetryBackoff, the same one used by chat and SAM), 500 and 400 are not: repeating the same request will not help. Each picture is written to the spending log next to chat turns: a flat $0.01 per successful image per Meta's price list (not an estimate, so estimated=false); a failed call is not written, since Meta does not charge for it; the request format was put together from the dev.meta.ai documentation and has not been checked with a live call. Illustrations for the lessons themselves are drawn in advance by the script tools/lesson-images/pregenerate.py: WebP files in assets/lessons/images/generated and an asset in the step, so the lesson shows them offline and for free, while drawing on the phone remains for steps without an asset; the script takes the Meta key from the META_API_KEY environment variable. The script edits the lesson JSON as text (it does not touch formatting or line breaks), so imagePrompt is printable ASCII without quotes; the prompt style is the same, word for word, in the script and in the app (LessonImageStyleSyncTest). The “Draw it for me” button on a lesson image redraws the scene for the user and publishes it as a separate card under the step (so “before / after” is visible; the lesson cursor is explicit state, and an extra message does not move it). From the profile, only “about me” (trimmed to 400 characters) and the language go to the provider: name, age, gender and religion stay on the phone, since a picture without lettering has no use for them, and the model readily draws stereotypes from them. Without “about me”, the button says directly what to fix rather than “it didn't work”."
    flows: [chat]
  - id: video-na-vhod-v-uroke-muse-spark-08ccdb
    title: "Video input in a lesson (Muse Spark)"
    rationale: "Lesson step video: the main button, “Show an example”, sends a sample clip from the build (sampleVideo in assets, with samplePreview as the preview), while recording 5 to 10 seconds with the camera or picking a clip from the gallery is the second row. The sample comes first because recording on a phone means the camera, permissions and lighting, while the point of the step (the model sees separate frames and is unsure in places) is visible on a ready-made clip in one tap; it was also drawn by Muse Image, with the camera push-in done by ffmpeg. Muse Spark answers according to the lesson's task, and the answer goes into the chat under the step. Since Oct 30, 2026 this is Meta Model API only (OpenRouter is gone): POST /v1/chat/completions, model muse-spark-1.3, a video_url part with a base64 data URL, using the Meta key the person entered themselves; without a key the client sends nothing, and the step asks you to add a key instead of saying “unavailable”. Meta accepts only MP4, so non-MP4 is not sent (extra megabytes for a guaranteed 400); the reply limit is set with max_completion_tokens with headroom, since reasoning counts toward it, and OpenRouter's usage.include field is not sent (unknown parameters are a 400 at Meta). Meta returns tokens but not the price, so spending is computed from Spark's price list (metaListPriceUsd), and 429 and 503 are retried with the shared backoff. The request format was put together from the dev.meta.ai documentation and has not been checked with a live call. It is a separate client rather than attachments in the shared agent loop: the lesson needs one question and one answer about one clip, while the loop, tools and history are built on text, and dragging video in there would mean rebuilding ChatMessage and all the orchestrators for a single step. The camera writes to cacheDir via FileProvider, not to the gallery: what was recorded for the lesson does not settle in the camera roll and is deleted after analysis; a clip from the gallery belongs to the user, so it is left alone, and the sample is read from the APK's assets. The system camera is limited to 10 seconds and low quality, and the clip is read with a 20 MB ceiling, because the whole thing goes to the provider in base64. The video goes to the provider with everything in the frame, and the lesson says so directly and asks you not to record anything personal. The step can be skipped (“Next” is always there), but while the model is watching, “Next” is hidden so that the answer lands under its own step. The how_model_sees lesson comes right after tokens: video is the same tokens, just made from frames."
    flows: [chat]
  - id: protsedurnye-animatsii-v-urokah-68b2bf
    title: "Procedural animations in lessons"
    rationale: "A lesson animation step shows a scene drawn in code with Compose, not a video file: kilobytes instead of megabytes in the APK, it works offline and with any provider, adapts to the screen, and a caption is fixed with one line. Most importantly, the scene can be touched: in “Temperature” a slider visibly sharpens and flattens the distribution, a button draws a word, and you can see the variety grow. “Tokens” shows how one thought in Russian breaks into more pieces than in English. Scene captions go through tr(); scenes for lessons that do not exist in English still keep Russian text for now, and this is held by a named exemption in check T6c (screen-text-check-7c6d09), which switches off once assets/lessons/en/<lesson>.json appears. The other scenes are also about doing, not watching, because a short lesson where you move something yourself sticks: “Video → frames” (you pick the frame rate: at 1 to 2 per second the cup being lifted slips through, at 4 it is noticed but costs more tokens), “ReAct loop” (you walk the agent around the loop with a button, using the lesson's example), “Context window” (a name slides past the edge of the window and is forgotten, and long-term memory brings it back), “RAG” (you pick a question, the knowledge base highlights similar chunks, they go into the bundle, then the answer). Since Oct 25, 2026 every lesson has a scene, one per lesson, and it shows the lesson's main mechanism in action: persona and profile change the answer, chat versus agent, the layers of the pre-prompt, the precision of a request, a confident tone without truth, a tool call, skill levels, where data goes, risk classes, turn hooks, workflow versus agent, chain and router, the context budget, the plan gate, goal-mode rounds, draft and critique, “done, now prove it”, a day of cron and heartbeat, the arena and the swarm, building an agent, the capstone's five questions, and four scenes about Meta's models (the lineup, open weights and the API, Muse Spark's modes, how Muse Image draws). It is not a quiz, since the lessons already have quizzes: a scene shows a mechanism rather than testing knowledge. The example in a scene is taken from its lesson's text so that the scene and the text do not diverge; each scene is its own Scene*.kt file. A scene shows what the app actually does, not an ideal diagram: the risk gate and hooks show the default rule (writes go through on their own, deletion and sending ask, and “allow” in a hook does not lift that), the context budget shows trimming the middle without a summary, and the data flow shows the phone and Meta. The exception is onboarding: l1_welcome draws its own screen in code rather than through the chat driver, so the “persona and profile” scene from its JSON is not shown yet. Numbers and splits are illustrative (Muse does not return real probabilities: logprobs are a 400 at Meta), and the scene's caption says so directly. There is one list of scenes for both rendering and lesson checking (LESSON_ANIMATION_SCENES), so that a lesson with an unknown scene cannot get into the build."
    flows: [chat]
  - id: voice-input-1a0dfd
    title: "Voice input and assistant"
    rationale: "Speech recognition and integration with the system assistant (Assist API), so requests can be dictated by voice and the agent can be called from any screen. We choose the recognizer ourselves: once it becomes the default assistant, the app may also end up as the system recognizer, and its AssistRecognitionService is a stub that always answers “busy”; so if the system one is ours or cannot be read, we take the first RecognitionService from another package."
    flows: [chat]
  - id: agent-router-dc2233
    title: "Agent router in the general chat"
    rationale: "The owner, Nov 2, 2026: in the general chat (by text, or by voice through the assistant) a Meta model decides by itself which agent a request belongs to, or none; or the person picks an agent in advance. Previously a chat was tied to an agent only at creation, the general chat and the voice assistant did not call agents at all, and agents built in the builder were reachable only from the “Agents” tab. Option A (chosen by the owner): before a CHAT/REFLECT turn in a chat without an agent, one short Muse Spark call (low reasoning effort, no tools) gets the list of agents from the roster (name, description, tools) and names one id or none; anything that is not an id from the list, a failure, or a reply taking longer than 8 s means the regular assistant: routing must never be the reason a message went unanswered. The chosen agent travels in the coroutine context (RoutedAgentContext, like AgentModelContext) down to PrePromptAssembler, and the turn runs exactly like a chat turn of that agent: its role, tools, skills and memory; the conversation itself stays unbound, and the next message is routed anew. A bound chat and a lesson are not routed: their agent is already decided. Neither are PLAN/GOAL: the plan engine takes the agent from the conversation. Above the reply there is “→ agent name” (the agentId column on the message, schema 14), visible already during the turn. A chip next to the modes: “auto” (Muse Spark decides), “no agent”, or a specific agent; the choice is held in memory per conversation (AgentRouteChoices), so that a turn that outlives the screen and “Retry” see the same choice. Option B (a lead agent hands parts of a request to several agents) is postponed: approvals inside a subordinate agent and nested turns cannot be done in time for the submission. The voice session (call and assistant) offers the same chips before its first phrase and stores the choice the same way, so its turns route like a chat message."
    flows: [chat]
  - id: voice-assistant-mode-a81a99
    title: "Voice assistant mode"
    rationale: "The owner, Nov 1, 2026: the app should work as the phone's voice assistant. Registration with the system already existed (voice-input-1a0dfd), but the assistant button opened an ordinary empty chat: you had to tap the microphone, then “Send”, and the reply could only be read off the screen, so it did not feel like an assistant. Now a chat opened by the assistant button listens right away, what you say is sent without a tap, and the reply to a spoken question is read aloud (this can be turned off in Settings). Speech output is the system TextToSpeech: Meta Model API has no speech synthesis (Nov 1: the model list has only muse-voice-transcribe, speech to text; /v1/audio/speech is a 404). Only the first reply after a spoken question is read aloud: background plan steps write to the same chat, and a voice suddenly speaking up minutes later would be a surprise. Settings shows the status “is this the assistant right now” and a button to the system screen: the app cannot request the assistant role, only the person can choose it. Since Nov 3, 2026 the button no longer opens the whole app: AssistantActivity, a translucent window, draws over the app that was on screen (modelled on the owner’s earlier assistant): a dimmed backdrop, chips for Auto or one agent, a lime orb that shows listening and thinking, the question as heard, and the answer in place with “Ask more” and “Open in chat”. It drives the same ChatViewModel as a chat, so routing, approvals, reply aloud and history are shared, not copied; before onboarding is done it hands over to the app. The voice call (voice-call-mode-54cb49) starts from a chat; the assistant button opens this overlay. On Nov 4, 2026 the owner found the assistant and the call behaving very differently: the assistant ran on the chat engine (Google hearing, the reply read only once it was finished, one question per tap) and the call on its own. Now both are one screen on one engine, VoiceSessionScreen on CallViewModel: the assistant is its overlay form (a dimmed backdrop over the app underneath, a close button, Open in chat) and keeps the motion the owner liked, the orb waiting low with the router chips and gliding up once the first phrase is said; the call in the app got the same motion. So the assistant now hears English through Meta, reads replies while they are written and keeps listening like a call."
    flows: [chat]
  - id: voice-call-mode-54cb49
    title: "Voice call with the assistant"
    rationale: "The owner, Nov 3, 2026: a voice mode that feels like a phone call with a person, as in the Claude app, not a chat that hears one question (voice-assistant-mode-a81a99). The call screen listens, sends each phrase as an ordinary chat turn of the same conversation (so the whole call is in the chat afterwards), and reads the reply aloud sentence by sentence while the model is still writing, so the first words come about a second after the model starts instead of after the whole reply. Half duplex on purpose: the microphone is off while the phone speaks or the agent is still writing, otherwise the recognizer hears the phone's own voice and the agent answers itself; a tap cuts the agent off and gives the floor back. Voice interruption is deferred until echo cancellation is checked on the owner's Pixel. Recognition in this version is Android's SpeechRecognizer, restarted after every phrase: the platform says it is not meant for continuous listening, so the call restarts it itself, stops after about a minute of silence (every restart beeps) and pauses after repeated errors until a tap. Meta's Voice Transcribe is the next step for English (it has no Russian among its 25 languages). The voice is the phone's TextToSpeech, the best installed offline voice for the language (Meta has no speech synthesis; a network voice makes a round trip per sentence). A call turn gets a spoken-style addition to the system prompt (short, no markdown, one question at a time) and a low reasoning level, since the person waits in silence. A risky action still asks: the approval card is shown on the call screen and the microphone waits. The owner first answered that the assistant button should open a call (Nov 3); the assistant overlay, asked for the same day with a sample video (voice-assistant-mode-a81a99), took the button in the merge, so a call starts from a chat. Hanging up opens the conversation the call wrote into. Before each phrase the conversation's previous turn is dropped, so a reused session cannot hand the call an old reply as the answer. After the owner's first call on the Pixel (Nov 3, 2026) three controls were missing and were added: a running caption shows the sentence being read, word by word where the engine reports word ranges (onRangeStart; Google's engine does, others get the whole sentence at once); a mute button keeps the microphone off whoever has the floor until it is pressed again, while the agent still answers aloud; and a tap on the reply, or the repeat button, reads it again, except while a reply is still being read as it is written, so two readings never overlap. The next day the owner still disliked the screen and asked where photos were: it was rebuilt like a phone call, the orb, one line of words (what the person says, the sentence being read, or the last reply to tap again) and four round buttons, Photo, Mute, Repeat, End; the glass transcript card went, since the whole call is in the chat afterwards. Photo opens the camera or the gallery, the call stops listening while either is open, and the picture is copied like a chat attachment and sent with the next phrase, so the agent sees what the person shows it. The owner then found it plain next to their earlier assistant, so the call now wears the voice overlay's look: the lime-on-ink AssistantOrb (ported from that assistant, given a speaking state with taller bars), large words that crossfade between what is heard, said and replied, and frosted round buttons. An always-dark version broke the app theme and sat under a band of the page colour (the app-wide status bar scrim), so the call follows the theme, runs its backdrop up under the status bar with the scrim left out on that route, and its top reads like a phone call: who you talk to (the chat's agent, else Assistant) and the call time, not the chat's auto-written topic."
    flows: [chat]
  - id: meta-voice-transcribe-in-calls-297760
    title: "Muse Voice Transcribe hears the person in an English call"
    rationale: "The owner, Nov 4, 2026, asked why Meta took no part in voice input and wanted Meta to hear the person whenever the app speaks English. Until then every microphone in the app was Android's recognizer (Google on the Pixel), so a call, the showcase of talking to a Meta agent, heard the person with someone else's model, and the hackathon scores the use of Meta's tooling. Meta's speech-to-text is Muse Voice Transcribe on its own endpoint (POST /v1/asr/transcribe, multipart: a request JSON part with model muse-voice-transcribe-1.0, audioEncoding WAV, mode PUSH_TO_TALK and an English languageBias, plus an audio part; the text comes back as transcript; checked against dev.meta.ai on Nov 4). It takes a recording, not a live stream on this endpoint, so the call records a phrase itself (PhraseRecorder: 16 kHz mono 16-bit WAV, the format the model asks for; the phrase starts when the sound rises clearly above the room measured in the first 300 ms and ends after 1.1 s of quiet, with 300 ms kept before the start so the first syllable survives) and sends it whole: there are no live words while the person speaks, and the screen says Transcribing while Meta writes it down. Russian is not among the model's 25 languages, so a Russian app keeps Android's recognizer, and so does an app without a Meta key. Both sit behind one CallEars interface that speaks the recognizer's states the call already understood; the Meta one stays Listening while transcribing, since to the call Idle means start again. The call names the model that hears the person (Listening with Muse Voice Transcribe). Spend: $0.18 per hour of audio in whole seconds, recorded from the answer's audioDurationMs, else from the length sent, marked estimated; not seen on a live bill. The same night the owner asked why live words were left out, so the call now tries Meta's realtime endpoint first (wss://api.meta.ai/v1/asr/realtime): the first text frame carries the key as authorization.accessToken (the HTTP header is ignored there), PCM_16KHZ and mode ENDPOINTING; the microphone then streams raw 16-bit frames of 80 ms at real time, transcript events show the words while the person speaks, and speechComplete ends the phrase, so Meta, not our pause rule, decides where it ends. One session per phrase, as a call takes turns. It runs on OkHttp, already in the APK through Coil and now declared, because the app's Ktor Android engine cannot open WebSockets. If a realtime session cannot even start, the rest of the call falls back to the recorded phrase above; a session that breaks midway is reported like a network error. Realtime spend is what was streamed, marked estimated."
    flows: [chat]
  - id: agent-skills-7189cc
    title: "Agent skills (skill packs)"
    rationale: "Skills use progressive disclosure: the prompt contains only the catalog (id, description, when to use), and the instruction arrives via load_skill(id). Built-in skills (budget, diary, languages, fitness) have a manifest in code and assets/skills/{id}/SKILL.md; custom skills are written in the agent builder and live in Room, and their id cannot match a built-in one. An agent loads only skills from its skillIds, which is enforced by code (ReactLoopRunner), not by the prompt; an agent without load_skill is not shown the catalog at all (otherwise the model would call a tool it does not have and see other agents' skills); a regular chat sees all of them. fitness is not given to presets: it is for agents from the builder."
  - id: multi-agent-orchestration-27b8e3
    title: "Multi-agent orchestration"
    rationale: "A demonstration of multi-agent patterns. The live path: domain specialist mini-agents, each with its own tool scope (budget, languages, tasks, reminders, diary; the nutritionist was removed on Oct 30, 2026, because AI Nutrition Coach and medical advice are on the Meta hackathon's anti-projects list), via the roster in AgentsScreen. PlanExecuteOrchestrator (planner→executor→synthesizer) was removed from mvp on 2026-07-10 as not wired to any entry point; the code remains in git history and on the feature/plan-execute branch."
    flows: [chat]
  - id: app-settings-beb470
    title: "App settings"
    rationale: "The settings screen: the first card is the entry to “Profile” (personal data and what the assistant remembers: without it, Settings had no answer to “where is the information about me”), then the Meta Model API key (first, with a hint on where to get one, because judges who build the public repository without a README land here too), a key status line (“requests go directly to Meta Model API” or “no key, requests will not be sent”, reacting to the field before “Save”), persona, theme, chat font size, the voice assistant (status and reading replies aloud, see voice-assistant-mode-a81a99), spending for the week (in the “by model” list, the top three by tokens, plus always the models that charge per image: SAM has no tokens, and in a fresh demo it is the only call that cost money), and the entry to “Scheduled tasks”; keys are stored encrypted on the device; NVIDIA and OpenRouter keys and a provider choice left over from earlier versions are wiped on first access, because a live key the user no longer knows about should not sit on the device. The Meta key is the only key in the app, and there is one provider (see vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53). With the English interface the whole screen is in English, including the persona sheet: this is the hackathon judges' path. The weekly spending card is also shown on the “Profile” screen (profile-screen-7354a7), so a single shared WeeklyUsage reads it: two screens with two copies of the queries would show two different totals for the same week. Model choice and the goal-mode round limit are no longer in Settings (the owner, Oct 31, 2026: an agent's knobs, the model and the goal round limit, live with the agent itself, in the builder; Settings keeps what concerns the whole app). The app's model is always “automatic” (catalog order), and a previously stored choice (selected_model_META) is wiped when the storage opens, like the NVIDIA and OpenRouter keys: otherwise the person would be stuck on a model with nowhere to unset it. Navigation between Settings and Profile does not pile up the back stack: if the destination is already on the stack, it returns to it instead of creating a new instance."
  - id: yazykovoy-agent-repetitor-s-intervalnymi-povtoreniyami-4a9360
    title: "Language tutor agent (SRS)"
    rationale: "The “Tutor” mini-agent for language learning on top of the multi-agent roster. Vocabulary goes through srs_tool: review intervals and dates are computed by code (SrsScheduler, covered by a test), not by the LLM, so that the model does not corrupt the deck with date arithmetic. The agent's persistent state (the goal:languages goal, the lang:* level, the grammar:* weak spots) is deterministically mixed into the pre-prompt by key prefixes from the agent's role. The study plan is kept in conversation: the agent records it as a fact in its memory and sets reminders through heartbeat; the preset has no Plan mode (the owner's decision, see toDefinition). Background reminders can call srs_tool, otherwise there would be nothing to check “time to review your words” with."
    flows: [chat]
  - id: heartbeat-napominalki-agenta-5f0442
    title: "Agent heartbeat/reminders"
    rationale: "Give the agent proactivity: delayed reminder pushes and periodic background wake-ups (heartbeat), where the agent decides by itself whether to bother the user (the HEARTBEAT_OK pattern). Through WorkManager, with a registry in Room and a live card in the chat with “Cancel”. HEARTBEAT_OK works for any agent run, including one with an explicit task: without it, “check the tasks every half hour” would write to the chat and push every half hour even when there is nothing to say; a requested reminder, however, always counts as a reason. The background turn runs in a narrow scope of safe tools (memory, storage, the SRS vocabulary, otherwise the Tutor could not check which words are due for review), without waiting for UI approvals. An agent sees and cancels only its own reminders, and nobody cancels plan steps from the chat: the plan engine manages them, and a step cancelled from the chat would leave the plan waiting forever; a regular chat (the user themselves) sees all of theirs. In the background, deletion and sending outside are forbidden (there is nobody to approve), and the background prompt carries the “Now” section, because without the current time the agent cannot decide whether it is time to bother anyone. The delay is set in milliseconds: rounding to minutes woke a reminder a minute early, and a plan step woken before its time was rescheduled with zero delay and spun idly. The card rounds “in N min” up, and a one-off that has fired, been cancelled or expired shows the time (“at 20:01”) rather than “in 0 min”. Notification permission is requested at the moment it is needed (a notification_permission card in the agent's reply when the reminder tool found it missing), not on first launch; the channel is “Reminders and agent replies”, with a monochrome icon. An agent that wakes itself is the only way to act without being asked, so it has the same limits as Noodle bots (checked against the AgentWakes.swift source on Oct 30, 2026): no more than 3 pending mode=agent wake-ups per agent (refused with advice to cancel the extra ones; reminder pushes are the person's own request and do not count); a periodic wake-up is paused if the last 12 messages in the chat are the agent's, without a model call, and is unpaused automatically by the person's first message (counted on the chat itself; only the person resets it, not another agent); a one-off wake-up fires anyway. The background prompt says that a wake-up does not grant the right to new work."
    flows: [chat]
  - id: fonovye-hody-agenta-dde42d
    title: "Background agent turns (TurnManager)"
    rationale: "An agent turn (stream + tool loop + saving the reply) must not die together with the chat screen: the appScope singleton TurnManager keeps one session per dialog, and the screen only projects the state. Parallelism across dialogs, and a push on completion in the background. Since 2026-07-28 a turn started from the screen is additionally protected by a foreground service (shortService) while it runs, so a minimized app no longer loses the reply; on the system timeout the turn fails with “Retry”, but only in the background (on screen there is nothing to cut off). A turn still does not survive a force-stop or a reboot. If a turn in a minimized app is waiting for “Allow”, a push “The agent needs permission…” arrives, otherwise the request would silently expire and nobody would ask the person; the app checks the foreground not once but for as long as the request is alive, because the usual order is the reverse: you ask for a draft, the request appears while the chat is open, and only then is the phone put away (approval-outcome-honesty-554a8c). “Retry” repeats the turn with the same addition to the system prompt; “Stop” and dismissing an error do not let the next turn start until the old one has burned out (otherwise two turns would write into one chat). Tapping the push opens the chat only for a valid dialog UUID and only on a fresh launch, so rotating the screen or coming back from “Recents” does not reopen it again. Without a Meta key (no build has a built-in key) the turn does not go to the model: the person's message stays in the chat, and the turn fails at once with “Add your Meta API key”, a button to Settings and “Retry” (see vybor-provaydera-i-zhivoy-katalog-modeley-fe9a53); a background heartbeat wake-up without a key is skipped silently and writes the reason to the run result."
    flows: [chat]
  - id: glass-design-system-21a3fe
    title: "Glass design system (glassmorphism)"
    rationale: "A reusable glass layer: GlassTokens tokens (tints and highlight per theme) + an aurora background + GlassSurface/GlassCard/glassCardSurface. Backdrop blur (Haze) was removed on Jul 30, 2026 by the product owner's decision: the shimmering was disliked, and the per-frame RenderEffect under the feed was the main jank suspect; on Oct 25, 2026 the dependency itself was dropped from the build. GlassSurface is now a plate in the theme's background color (alpha GlassTokens.PlateAlpha = 0.985, see below) + tint + rim highlight, identical on all API levels; GlassState/glassSource are kept as no-ops so the screens do not have to be rewritten. Inside LazyColumn there is only “weak” glass (tint without effects). The strip under the system clock (StatusBarScrim) is a plate with the same alpha (one shared PlateAlpha token; previously one number lived in two copies), not a gradient from 0.7: at 0.7 the feed text read through the clock and battery, so the fade-out was moved 16dp BELOW the status bar, where there is nothing to cover. The floating bottom pill handles the system inset itself (navigationBarsPadding): Scaffold uses this composable's height as the content's bottom padding, and without the inset the list reserved less than the bar occupies on the phone. The density is 0.985, not 0.94: at 0.94 the feed text read through the floating pills (contrast 1.16:1), and for a flat plate without blur the illegibility threshold is crossed around 0.973, below which the target cannot be reached at all. The owner, on Oct 28, 2026, knowing these numbers, chose nearly solid pills and declined to bring the blur back; GlassTokens.BlurRadius is a dead token read only by its own test. GlassSurface and GlassCard set LocalContentColor = onSurface themselves: they are a Box and a Column, not a Surface, and text and icons without their own color fell back to Compose's default black, invisible on a dark plate (the Stop button, the titles in the chat list, Android 14, Oct 29, 2026). The glass_components and chat_input_states baselines had stored that black for ages and were therefore green on the bug. Everything floating above the feed sits on a plate: bare lines (“Ask the AI”, the “Save changes” block in Settings) read jumbled together with the text scrolling beneath them."
  - id: agent-inspector-6e41eb
    title: "Agent inspector (read-mostly), SUPERSEDED by Task 21"
    rationale: "A glass sheet (ModalBottomSheet) over “Tools” showed a mini-agent's real scope (tools/skill/heartbeat/state areas/pre-prompt) plus the agent's personal files from its own sandbox (filesDir/agents/{id}, see user-agent-builder-848153 Task 6), read-only, so that the user could see what the agent can do and what is configured BEFORE opening a chat. The data came deterministically from MiniAgentCatalog + HeartbeatDao.observeActiveByAgent + AgentFilesRepository (not through ToolExecutor). SUPERSEDED (Task 21, user-agent-builder-848153): scrolling inside the sheet was awkward, there were counters instead of real lists, and the pre-prompt did not expand, so AgentInspectorSheet/AgentInspectorViewModel were deleted entirely; their logic was moved and extended into the full-screen com.aiopenpocket.ui.agents.detail.AgentDetailScreen/AgentDetailViewModel (route agent/{agentId}), which additionally shows the agent's REAL hooks plus a firing log (Task 8) instead of the former fake on_tool_call/pre_message stubs. The id is kept as is (frozen, history), and `traxer check` will predictably report “feature has no code” for it; this is not a bug."
    flows: [chat]
  - id: user-agent-builder-848153
    title: "User agent builder"
    rationale: "Close the AI Academy learning loop with a result of the user's own: safely build, test, save and run your own scoped agent without changing code. The preset catalog stays read-only Kotlin; custom agents/skills/hooks live in Room and are merged with presets through AgentResolver; the runtime gets an immutable AgentDefinition snapshot, a code-enforced ExecutionPolicy (Preview blocks side effects), per-agent memory/file namespaces and a declarative HookEngine. In LIVE the policy has a floor: DESTRUCTIVE and EXTERNAL wait for approval even without hooks (a hook can add a ban or an approval, but cannot remove the floor). Hooks have a budget of 50 firings per turn, and once it is exhausted only LOG/ADD_INSTRUCTION/ALLOW are skipped, while DENY, REQUIRE_APPROVAL and STOP always fire: protection that switches off on a long turn is not protection. The builder's tool catalog shows the worst risk class of an action (storage and external files: deletion), and it does not offer retired card templates. The agent inspector shows the same ceiling and takes it from the same ToolCatalog: the own Tool.riskClass of memory_tool/heartbeat/work_manager/database_query is understated (escalation lives in riskFor(arguments)), and an agent screen promising “READ” where consent was taken under “may delete irreversibly” is a false safety claim, not a styling mismatch; a test keeps the two screens in step, otherwise they would drift apart again. Deleting a test chat first removes its heartbeats. Agent sandboxes and lesson images are excluded from cloud backup (device-to-device transfer includes them, as it does the database). In a test run the trace says “→ simulated”, not “→ ok”: otherwise “Mail: write an email → ok” read like a real email. Right after publishing there is no “Publish changes” button, since there is nothing to publish; any edit brings it back. The “Instructions” step gives hints based on Meta's prompting guide (role/task, format, length and tone up front; do not explain to the model how it works): the InstructionsGuide checklist heuristic is only advice and blocks neither saving nor publishing. The model field (schema v12, a nullable column in user_agents) sets the agent's model: Wonder for a heavy multi-step loop, Spark for cheap work (this is how Meta's agents guide splits them); presets and new drafts are null, meaning automatic selection (catalog order; the “Automatic” chip in the builder). The choice is made in the wizard's “Modes” step, the current model is visible in the agent inspector; the validator accepts only null or a known family. Plan step verification also runs on the agent's model (AgentModelContext around PlanVerifier): otherwise an agent that chose “faster and cheaper” would pay for every verification at the app model's prices. The instructions checklist matches keys only at the start of a word: as a substring, “format” was found in “information”, the Russian word for “tone” inside the Russian word for “autonomously”, and “tone” in “milestone”; the Russian “tone” counts only as a whole word with its inflected endings, and temperature only counts as a meta-instruction when it is a sampling knob with a number (0.2, 0,7), because a weather or cooking agent talks about temperature in earnest. The builder is now a chat, not a form (the owner's decision of Oct 31, 2026: six screens of fields at once scare people off). A hidden built-in Builder agent (BuilderAgent, outside MiniAgentCatalog.all, so it appears neither in the roster nor in the picker) asks one short question at a time with a card of 3-4 options and maintains the draft with the agent_draft tool. Publishing remains a human action on the review screen, and this is enforced by code, not the prompt: agent_draft has no publish action, and editing an already published agent from the chat is rejected, because saveDraft preserves the status and such an edit would go live without anyone pressing “Publish”. The draft is bound to the conversation by a deterministic id (draftIdFor), not by a model argument: the model physically cannot address someone else's row, a repeated call lands in the same draft, and there is no mapping table to migrate. agent_draft is deliberately not in KNOWN_TOOL_NAMES: that is the set of things a user's agent may hold, and it has no need for the builder's tool. update rejects invalid tools, modes and models wholesale, listing the allowed values and saving nothing: a half-applied edit is worse than a refusal. The “Review your agent” card (agent_review) comes from the result of finish, not from render_card, so that it appears exactly when the draft has passed AgentValidator and leads to the real draft of this conversation. The review screen (route agent_builder/{id}?review=true, AgentReviewContent): building an agent in chat ends on a page where the person sees everything the chat set up at once (name, instructions with the checklist, tools as checkboxes, modes, model, rules) and can edit any field themselves through the same controls and the same updateDraft as the wizard, so validation and autosave are the same. The person always publishes on this screen: the model can only write a draft, and Publish is enabled by exactly the same canPublish as in the wizard, with errors shown right in the relevant section. Tools and model are always expanded (the owner wants to see every checkbox without a tap), and secondary items are collapsed. The GOAL round limit (AgentDefinition.goalMaxRounds, null = 3, range 1–10) is also an agent's knob, not a Settings one (the owner, Oct 31, 2026): how many goal rounds are acceptable depends on what the agent does. It is chosen with chips in the “Modes” step and on the review page, only while GOAL is among the allowed modes; AgentValidator rejects a value outside the range. It is stored inside the allowedModes JSON list as the string goalMaxRounds=N rather than in a separate Room column: before release a schema change means destructiveFallback, that is, wiping all agents, chats and plans on the owner's phone for the sake of one number; when the first release introduces real migrations, the field should move into a column."
    flows: [chat]
  - id: structured-plan-engine-907066
    title: "Structured Plan Engine (Phase B)"
    rationale: "Replaces the prompt-only PLAN/GOAL (the old id rezhimy-agenta-plan-i-goal-ee2361 was removed from the registry on Oct 25, 2026; the code was removed in Task 15, commit e50fc70) with a shared structured mechanism for planning/execution/verification: for a one-off task (SINGLE_RUN) and a long program (PROGRAM), a single persisted Plan entity with a version, an approval gate on creation and on substantial edits, and evidence-based completion (a bare “done” from the LLM is not enough). Design: docs/superpowers/specs/2026-07-12-structured-plan-engine-design.md; implementation plan (Tasks 10-18 of the combined plan / Tasks 1-16 of docs/superpowers/plans/2026-07-12-structured-plan-automation.md): docs/superpowers/plans/2026-07-12-agents-platform.md. Key safety guarantees as implemented: PLAN gets only internal control schemas (submit_plan/propose_plan_revision/request_plan_information), NEVER action tools, which are not registered in ToolRegistry; approval is a typed PlanCommands.approve(planId, version) from a real ChatIntent, not a chat message; an approved PlanVersion is immutable; any new planner submission for an existing plan is a new version, the plan goes to AWAITING_APPROVAL, and execution stops until a new approval (fail-closed; PlanChangeClassifier is not yet called at runtime); a GOAL step runs within agent.toolNames ∩ step.expectedTools ∩ ExecutionPolicy; a required criterion is not closed without persisted PlanEvidence (PlanVerifier; MODEL_ASSESSMENT never verifies a deterministic criterion, and DeterministicVerifierRegistry.check throws on that type); declarative plan hooks (ON_PLAN_CREATED/ON_PLAN_APPROVED/BEFORE_PLAN_STEP/AFTER_PLAN_STEP/ON_PLAN_BLOCKED/ON_PLAN_COMPLETED through the same HookEngine) do not call the LLM or tools, do not add evidence and do not mutate an approved plan, only a HookDecision applied by the calling code; approval starts execution in the background: PlanCommands.approve → PlanScheduler.sync sets a typed heartbeat (planId/planVersion/stepId) for the next step, immediately if unscheduled, on time if scheduled; HeartbeatRunner.firePlanStep runs one step and reschedules the next, and “Goal” does the same in the foreground; a stale version (the approval has moved ahead) is skipped rather than running the old step; the reply of each executed step (text and cards) goes into the plan's chat on both paths, otherwise “Plan complete” arrived while the result itself (a menu, a list) was nowhere to be found; the engine's texts for the person (blockedReason stop reasons, orchestrator banners, background heartbeat messages, evidence summaries) are in the interface language through tr and use step names rather than ids; the planner, executor and verifier prompts and the verification diagnostics (reasons in plan events; PlanRunner does not pass them to the user) remain in Russian, and they are not shown to the user; “Request changes” immediately starts a PLAN turn with the comment, and switching the mode chip does not hide the approval card; a background run never waits for UI approval (interactiveApproval=false → REQUIRE_APPROVAL becomes blocked, not a hung WorkManager); after a process crash PlanRecovery marks a step COMPLETED only if evidence from that attempt is already persisted, otherwise BLOCKED, so the side effect is not repeated; the planner and step executor prompts carry “Now” (without a date, “tomorrow at 9” and PROGRAM deadlines would be guesswork), and MODEL_ASSESSMENT verification does not read the model's reasoning, so a JSON draft from it must not count as a verdict. Plan and Goal exist only for agents from the builder; a regular chat and presets get Chat/Reflection. The domain templates budget/languages (nutrition was removed on Oct 30, 2026 together with the agent, as an anti-project of the Meta hackathon) (assets/plan_templates/*.json) are the presets' fixed methodology (do not invent amounts, do not make payments; do not diagnose or prescribe treatment, stop on alarming symptoms; SRS intervals are computed only by code); planning is deliberately not given to presets, so currently no path reads them; do not delete (see toDefinition). Task 12 closes the TODO left by Task 21 (user-agent-builder-848153): a live com.aiopenpocket.ui.plan.PlanCard in the chat stream (a proposal preview with Approve/Request changes when the plan is AWAITING_APPROVAL; compact progress with Pause/Resume/Cancel when ACTIVE/PAUSED), all actions as typed ChatIntent commands on top of PlanRepository/PlanCommands (Task 5), with no second approval mechanism; the full-screen PlanListScreen (route plans/{agentId}, active/paused/completed sections) and PlanDetailScreen (route plan/{planId}: objective/version/status, a timeline of steps with criterion/evidence/deadline for PROGRAM, completion criteria, an event log, Pause/Resume/Cancel, without approve/request-changes, which stay with the chat only); and the “Plans” section itself in AgentDetailScreen (active/paused/completed counters plus a list, and an honest empty card for presets without plans). A background plan does not stall silently: a failed step that still has attempts left goes to a WorkManager retry with a pause (rescheduling immediately is not possible, since a step with no attempts left would spin without delay); approving a step re-arms the schedule; a step left EXECUTING after Stop, an exception or process death is repaired by the same evidence check (PlanRecovery), immediately in PlanExecutor and at app start, only for steps started before the process started. A plan does not get stuck (Oct 31, 2026): a step on which the process died, a stop or an exception happened does not stay EXECUTING forever: PlanRecovery at start and after a failure completes it on evidence or blocks it for review, never restarting it; a step failed in the background with attempts left is retried via WorkManager backoff instead of killing the schedule; an approved step re-arms the schedule. The GOAL budget per step (PlanRunBudget.maxLlmIterationsPerStep) is taken from the agent's AgentDefinition.goalMaxRounds (3 by default, same as for a regular chat without an agent), not from Settings (the owner, Oct 31, 2026: an agent's knobs belong to the agent)."
    flows: [chat]
  - id: chat-font-size-setting-c72418
    title: "Chat font size setting"
    rationale: "Let the user choose the font size of chat messages (4 presets S/M/L/XL) in Settings, layered ON TOP of the device's system fontScale and applied only to bubble text. It is stored by enum name in DataStore (UserPreferencesRepository) next to the round limit; ChatFontScale.fromName resolves an unknown or old value to MEDIUM instead of crashing the app. The multiplier travels through ChatUiState.chatFontScale into the MarkdownText.fontScale parameter (the single place where bubble text is rendered) and into StreamingBubble with the same multiplier, otherwise the text would jump in size when the stream is swapped for the finished message. The whole MarkdownText render inside the bubble is scaled (body/headings/lists/inline code + the non-interactive card-in-markdown); interactive driven-UI widgets, the input field and the tool trace are not. TextStyle.scaledBy multiplies fontSize and only an sp lineHeight (em is relative to the font size and grows on its own)."
    flows: [chat]
  - id: smena-temy-svetlaya-temnaya-sistemnaya-palitra-lime-ink-paper-005bc6
    title: "Theme switching + lime/ink/paper palette"
    rationale: "Give the user a choice of theme: the dark lock (darkTheme=true, LightColorScheme=DarkColorScheme) and the purple Material palette were temporary. The lime/ink/paper palette and both schemes (AppDarkColors/AppLightColors) were specified by the user verbatim; error/onError fall back to M3 defaults. A role the scheme did not name does not stay empty, because Material fills in its own purple: secondary/tertiary were unset, and everything drawn through the secondary roles (the selected “Chat” chip in the bar, the lesson scene chips, the tool trace panel) dropped out of the palette right in the video's frame; since Oct 28, 2026 both families are set explicitly (sage/sand), and AppColorSchemeTest fails the build if any role drifts back to purple. Same story with the surface ladder (surfaceContainer*, surfaceDim/Bright, inverse*): dialogs, menus and sheets are drawn on it, including “Turn on Email? · Leaves the device” from the video, and the Material ladder had a purple undertone; now it is in ink and paper neutrals, and the test guards both the undertone and that the ladder stays a ladder. The secondary text tone (onSurfaceVariant) was raised to AAA on its surface: the old #A0A0A0/#5C5C5C were at the edge of legibility on the device. Light/Dark/System modes, System by default; ThemeRepository serves the mode reactively (StateFlow) on plain SharedPreferences (ui_prefs), because the theme is not a secret, unlike SettingsRepository/EncryptedSharedPreferences, and does not pull MasterKey at startup; it is passed through AppGraph -> MainActivity -> MyApplicationTheme(mode). The key point: 139 sites of old tokens were top-level vals (PurpleAccent and others) that physically could not react to a theme change; they were renamed to MaterialTheme.colorScheme.* (a full rename), otherwise the switch would have been fake; the compiler served as the checklist. Non-composable badge helpers (planStatusColor/stepStatusColor) use the raw val LimeSignal rather than the @Composable colorScheme. Glass is dark-first, with minimal theme awareness through LocalThemeIsDark: tints/BorderBrush flip to dark ones on the light theme (glassCardSurface became @Composable), but the aurora is TURNED OFF on the light theme (an empty list of blobs, plain PaperBg), because the glow needs a dark canvas and on paper the blobs look like dirt; this is deliberate minimalism, not a glass redesign. Design: docs/superpowers/specs/2026-07-15-theme-switch-design.md."
    flows: [chat]
  - id: english-ui-on-the-demo-path-223241
    title: "English interface (demo path)"
    rationale: "The Meta hackathon judges are English-speaking, and the app was Russian only: a video with Cyrillic and subtitles is unreadable, and a learning product cannot be judged without reading its text. The language is chosen in onboarding and in Settings and applies immediately: the interface redraws in place, and the agent's replies switch from the next turn (the language was already going into the system prompt). The mechanism is AppLanguage (Compose snapshot state for the whole process) and tr(ru, en) right at the text, not Android string resources: moving the whole app to resources did not fit the schedule, and keeping the pair in one call stops the strings from drifting apart. tr is called at display time, not in static lists, otherwise the language would freeze on first access; static data (path levels, tool names, agent templates, persona cards) stores both strings and picks one with a getter. The language is also mirrored from Application, so a process started for a reminder writes the notification in the chosen language; MainActivity waits for the language before the first frame so the screen does not flash Russian. Lessons have English copies in assets/lessons/en with a fallback to Russian, and the lesson check requires each copy to match the original step for step. The demo path is translated (onboarding, home, the path and the library, the lessons about Meta's models and video, the capstone, agents, the builder, chat, settings and scheduled tasks, permissions, reminders, notifications); the rest of the app is still in Russian, and the language picker says so honestly. What is translated is held by check T6c (screen-text-check-7c6d09): a Russian literal on screen that bypasses tr() turns check.py red, and the chat list shows lessons by their names in the interface language rather than by id (a lesson chat is stored under the lesson id, which is how it opens, so the screen supplies the name, not the database). Texts the model itself writes also come in the interface language: the chat title and tags from the annotator (otherwise the English chat list had Russian titles) and the profile fields from the self-description; the title of a new chat too. The onboarding wizard takes its initial language choice from the current language rather than defaulting to “ru”: the language is written to settings as soon as it is chosen, and after a restart in the middle of the wizard “Done” wrote Russian back. The prompts of agent templates and skills are still in Russian, since the model answers in the interface language anyway because of the pre-prompt's “Language” section; the plan engine prompts (planner/executor/verifier) still explicitly require Russian, and the Plan and Goal modes are not in the demo. The English lesson copies are guarded by T6b, and its scope is all lessons that have a copy, not the demo path list: on Oct 27, 2026 it was green on exactly the three lessons already translated and said nothing about the twenty-seven untranslated ones, so it was measuring what had already been done. Lesson images (SVG) are text too: the “True/Made up” label inside a drawing is not translated along with the step's caption, and on the emulator the English lesson showed Russian labels on the diagram (Oct 31, 2026). So the English copy has its own twin drawings in assets/lessons/images/en (only the text nodes change, the geometry stays the same), T6b turns red if an English lesson references an SVG containing Cyrillic (an image via imageKey counts too), and the copy check in the JVM test allows a copy either the same picture or its twin from images/en. Raster images (generated/*.webp) are not checked this way: their words are drawn in, and only eyes can see them. The ready-made agents have an English twin of their system prompt (Oct 30, 2026): on the agent screen a judge saw a wall of Cyrillic, and the T6 checks did not catch it, because it is data, not an interface string. The prompt is both shown and sent to the model according to the interface language, and copied that way by Duplicate: otherwise the screen would show one thing while the model received another. The twin replaces only the text from the catalog; a test guards that the English one names the same tools and skills as the Russian one."
    flows: [chat]
  - id: sam-segmentation-boxes-in-a-lesson-c3ea52
    title: "SAM 3.1 outlines objects on a photo in the “How the model sees” lesson"
    rationale: "The how_model_sees lesson teaches that a model sees not a picture but what it found in it. The video step tells this in Muse Spark's words; the segment step shows it literally: the learner names one thing (“cup”), and SAM 3.1 draws a box around every such thing in their photo. It is also work on the direct Meta Model API (api.meta.ai, the Responses API, model sam-3.1, with a dot: sam-3-1 on the marketing page is a typo), which is exactly what the first judging cut requires, and SAM is only available there. SAM's reply is not JSON with masks but text with special tokens (“<0f>0<|box;x1=…;y2=…;w=…;h=…|><|mask;…|>”), so parsing is moved into a pure SegmentationParser with JVM tests: fields are read by name, not by position; x2 and y2 are inclusive (right = x2 + 1), and without that extra one the boxes drift on a 1280-pixel shot; zero matches is a normal empty answer, not an error, and must not be confused with “the text is not in SAM's grammar”. At this stage masks are only parsed and stored raw: a mask decoder is a separate decision by the owner regarding the license, but the parser will not need rewriting. The client is separate, modeled on VideoUnderstandingClient (the Responses API, not chat/completions; one question, one answer about one photo), with no exceptions. The stream is assembled in full from response.output_text.delta and closed by response.completed: the API sends content_part.done but not output_text.done, and that cannot be relied on; a stream without completed means “unknown”, not “found nothing”. 400 is not retried (the same request will fail the same way), 429 waits per Retry-After with jitter, and 5xx are retried. Money: SAM charges per image, not per token ($0.0025), so spending is recorded from usage.images_processed, and without usage as one image marked “estimate”; this has not been checked live, the budget is zero. There is one recording rule: whether Meta accepted the image. After HTTP 200 the call is written to spending whatever happens next: a zero answer, an unreadable answer, a stream without response.completed, a break while reading, the screen being cancelled (the last three marked “estimate”, because the image count never arrived); a Meta refusal (not 2xx) and an error event in the stream are not written, since the work did not happen. This is the only path in the app where the learner's personal credits are spent, and the spending card must see it. The photo is downscaled to 1280 px and ROTATED according to EXIF before sending: SAM answers in the pixels of the image it received, and BitmapFactory ignores the orientation tag, so without rotation the boxes on a portrait shot are misplaced. The tag is read with androidx ExifInterface (it was already in the APK through Coil, version 1.3.7, and is now declared explicitly) rather than the platform one: the platform class's set of formats depends on the Android version, and a rotated PNG/WebP/HEIC from the gallery that it could not parse would arrive sideways along with the boxes; this difference cannot be shown on the JVM, since the Android-version platform class in Robolectric reads PNG here too. The app draws the boxes from w/h in the reply; the reply has no class label, so the caption is the learner's query. The key is only the Meta key from Settings (there is no built-in one); a judge may not have one, so the card says directly that a key is needed and where to get it, and the step can be skipped (“Next” remains, and the red step-problem banner goes away together with the lesson cursor, since it has its own slot, ChatUiState.lessonStepProblem, separate from the error of a failed turn: that one survives “Next” and keeps “Retry”, because the turn session recomputes it on every change of the message list; otherwise “key needed” hung under the privacy paragraph, under the quiz and under the “Lesson complete” card), and key, billing and model-access errors are each explained with their own sentence. The word the learner types is checked before the call: one concept, no lists or commands, and Latin letters only, otherwise the Russian word for “cup” would go into a paid call and come back empty, and on a Russian screen it is the first thing people type; the card explains why it is wrong and what to type. store:false asks the API not to keep the request: the learner's photo must not stay with Meta (how Meta honors this has not been checked). The log gets the length of the reply text, not the text itself: the model's prose may describe someone else's private photo. A sample photo from the build is one tap away, as with video: the camera and lighting should not stand between the learner and the point of the step. The photo goes to Meta in full, and the card says so, as does the privacy paragraph in the lesson (which now covers more than video). A photo taken with the camera is deleted after analysis, including when there is nothing to analyze it (an early exit), and orphans are swept up: camera originals after an hour, downscaled copies for result cards after a day and beyond five of them, because a personal photo should not sit in the cache forever just because a card once showed it. The per-image call is visible in the “BY MODEL” list of the spending card: it has no tokens, so by tokens it is always last, and in a fresh demo it is the only call that cost money. SAM is not added to models_meta.json: it is not a chat model, and a non-working entry would appear in the model picker."
    flows: [chat]
  - id: screen-text-check-7c6d09
    title: "Checks T6c and T6d: Russian text bypassing tr(), on screen and one step away from the person"
    rationale: "Check T6 (“650 pairs, all English”) was green while, on the emulator with the English interface, whole screens of the demo path stayed in Russian: it reads only the English side of a tr(ru, en) pair, and a string that never went through tr() at all is invisible to it. T6c reads the other half: a Russian literal where Compose draws it is a FAIL. The positions are enumerated, not guessed: the named arguments text, contentDescription, label, placeholder, title, supportingText, headline of any call (and their default values in the declaration), and the first positional argument of Text, Button, TextButton, OutlinedButton; inside an argument, the literal itself, if/else branches, the elvis operator, concatenation and templates count, but a nested call does not, so the Russian side of tr() itself passes. Comments and KDoc are not code; *Previews.kt files and functions with @Preview are skipped by name, since they are fixtures the user never sees. Exemptions are by file path only and come with a reason (SCREEN_RU_EXEMPT), while scenes for lessons that do not exist in English are tied to a verifiable fact: as long as there is no assets/lessons/en/<lesson>.json and this very file draws that lesson's scene, the exemption applies; once the copy appears it switches off by itself, and a Russian scene around an English lesson turns the check red instead of hiding behind it, otherwise we would get an English lesson text and a Russian animation under a green checkmark. The check is a net for the direct form of writing; it does not see a Russian string passed by name (a val, a list, a Triple, a wrapper like SectionLabel) or the body of an ordinary lambda, and for those a run on a device with the English interface remains. The lexer is our own, with no dependencies; the source is ASCII because the owner's console uses cp1251. Tests are in tools/test_check_t6c.py: each “must turn red” case is a Russian literal in a position the check promises to read. Since Oct 28, 2026 this same feature also hosts T6d, the same blindness for the third time. T6 measured the English side of the pair, T6b the lessons that already have a copy, T6c the on-screen position: all three look at the place where the string is WRITTEN. The turn error text is not written on screen: userFacingLlmError in OpenAiCompatClient.kt returns bare Russian literals, the caller puts them into StreamEvent.Error, and the screen draws whatever arrives through a variable (state.error): three green checks and a red Russian banner in an English lesson on the emulator. T6d measures the other end, the place where the string is SHOWN. A sink is a call that is known to hand a string to a person, and each one is named with a justification: StreamEvent.Error (the error banner in chat), showAgentNotification and setContentTitle/setContentText (a notification), launchExternalActivity (a notification instead of a launch from the background), TurnNotifier.turnFinished (the push at the end of a turn). “Looks like a message” does not count as a sink, and neither does text for the model. Two things are read: a bare literal in a sink's argument and ONE level of indirection, a call by a simple function name from the same file, in which case the literals of its body count as its result. One level, not arbitrary depth: that is enough for the real case and can honestly be done by a lexer rather than a Kotlin frontend. Inside a parsed function the check deliberately over-reports (any Russian literal in the body outside a nested call): a function that exists to produce text for a person has no need for a bare Russian literal at all. What T6d does not see (two levels of indirection, a helper in another file, a string through a variable, parameter or field, a string built by another call, a call with a receiver, a default value of a parameter of the sink itself, and any sink not in the table) is written down as a list right in the check: a check that does not say what it fails to catch will, a month later, again become “green and therefore reliable”. Tests are in tools/test_check_t6d.py: next to each “must turn red” case stands the same case with English text, which must pass."
    flows: [chat]
  - id: approval-outcome-honesty-554a8c
    title: "Declining and not answering are different approval outcomes"
    rationale: "The app told the person they had declined when they had seen nothing. Found on Android 14 (Oct 28, 2026): ask for an email draft and minimize the app; the “The agent needs permission” card lived only on the chat screen, the notification shade showed “Agent is replying…”, after two minutes the approval expired, and the model got one text for two different events: “declined it or did not answer in time”. The model resolved the “or” against the person: “Not sent — declined in chat.” Approvals are a load-bearing part of the project: the policy “DESTRUCTIVE and EXTERNAL always ask” is written in mcp-tools-f77d9b, the lessons teach it, and it goes into the video; a system that pins on the person a decision they never made undermines exactly what it demonstrates. The first half of the fix: the outcome stopped being a Boolean. ToolApprovalCoordinator.awaitApproval returns ApprovalOutcome (APPROVED / DECLINED / UNANSWERED), and DECLINED arises ONLY from resolve(approved=false), that is, from a button the person pressed; a timeout, cancelRun and abandonAllPending (formerly denyAllPending, a name with the word “deny” that itself invited reporting a refusal) give UNANSWERED. Each outcome has its own text for the model in ApprovalResultText, and the text about not answering deliberately contains no word about declining in any language: the model repeats the salient word, not the negation around it, so “do not say they declined” would be worse than saying nothing about declining. The text is in English, like the rest of the tool loop's own speech to the model (tools answer the model in Russian, see AGENTS.md; here the engine is speaking, not a tool). The second half: the person must see the request when the app is minimized. The push “The agent needs permission…” was already declared in fonovye-hody-agenta-dde42d, but the foreground check was done ONCE, at the moment the request appeared. The real order of events is the reverse: the person asks for a draft, the request appears while the chat is still in front of them, and only then do they put the phone away. The one-time check saw an open screen, decided no push was needed, and the request lived out its window in silence. Now TurnManager asks again every two seconds while the request is alive (the PendingApprovals port on top of ToolApprovalCoordinator.isPending, so as not to push for a request that has already been answered), and sends the push as soon as the screen has gone. No third mechanism was introduced: the foreground is the same ForegroundState, the notification is the same TurnNotifier, and the loop is bounded both by the approval window and by a counter, so a port that lies will not leave a coroutine running for the life of the process. The approval window is 10 minutes instead of two. Two minutes was designed for someone looking at the chat, and the whole point of the push is that they are not looking: a window that expires before the person gets to the phone turns approval into theater. It cannot hang forever either, since the turn holds the dialog and the model's context. In a minimized app the shortService protection (about three minutes) usually fires first, and the turn honestly fails with “Retry”: a turn stopped by the system is an honest answer, while a refusal the person never made is not. The request is registered in the coordinator BEFORE it is announced: the ToolApprovalRequired event is emitted from the awaitApproval callback after registration. Previously the event went out first, and a push watcher that managed to start before registration saw “not waiting”, took that for “already answered” and never pushed; on Android 14 on Oct 29, 2026 the push arrived only every other time, and an “Allow” pressed in that gap was lost too. The text about not answering does not promise the opposite either: once the window has closed, the card is gone and there is nowhere to press a late “yes”, so the model offers to do it when the person asks again, rather than saying “I'll do it as soon as you approve”, which is a falsehood of the same kind as “you declined”, just with the opposite sign. A push in a new chat that has no title yet (it appears after the first turn) is titled “Permission needed”, not “Agent replied”."
    flows: [chat]
  - id: profile-screen-7354a7
    title: "The “Profile” screen"
    rationale: "The owner, Oct 31, 2026: “I couldn't find my personal information.” The round “Profile” avatar on the home screen led to Settings, and the self-description from onboarding (name, how to address you, age, gender, “about me”) could only be seen or changed by going through onboarding again via the first Path lesson. Now the avatar opens a separate screen: first the personal data (visible right away, edited in place and saved by the same MemoryRepository.saveUserProfile as onboarding, which means into exactly the same rows the prompt reads; an empty field shows a soft “not set”, and religion is shown only if it is set), then what the assistant remembers about the person (facts outside the private agent:<id>: spaces, the same ones a regular chat sees; the six profile rows are excluded from the list since they are already the fields above; each fact is deleted after confirmation, plus a link to the memory graph), then spending for the week (the same card and the same WeeklyUsage reader as in Settings, since two copies of the queries would diverge). The gear in the header leads to Settings (the key, model, theme and language stay there). Learning progress is not included here, by the owner's decision."
  - id: web-search-tool-c73ed8
    title: "The web_search tool: internet search for agents"
    rationale: "The owner, Nov 1, 2026, wanted agents to be able to search the internet. At Meta, search is a server-side tool, web_search, and it exists only in the Responses API (POST /v1/responses); in Chat Completions, on which the whole agent loop is built, the only tool type is function, and web_search_options gives a 400. Moving the main loop to Responses is not an option: the stream, tools, history, the plan engine and all the orchestrators depend on it. So web_search is a bridge: an ordinary local tool that makes one separate request to Responses (the model is the current Spark from the catalog, store=false, reasoning low, a max_tool_calls search ceiling by depth quick/normal/deep) and gives the agent the answer text plus a numbered, de-duplicated list of sources from url_citation (up to 4000 characters; if there are no links, it says so). Risk class READ: it changes nothing in the person's data, so it works both in chat and in the background, but only for an agent that listed web_search in its own toolNames (an anonymous heartbeat does not get it, because it is paid). The only cost is money: $2.50 per 1000 searches plus tokens, and every call is written to the same LlmUsageDao spending log that the weekly spending reads (tokens at Spark prices + $0.0025 per web_search_call); the tool description tells the model that search costs money. The result arrives in an untrusted fence, because it is third-party text from the web. The call ceiling is 60 s instead of the general 30 (Tool.timeoutMs): a search plus a model run take longer than local tools. The Responses-format reply was checked only against the dev.meta.ai documentation, there was no live paid call, and the owner will check it. A live call on Nov 1, 2026 (muse-spark-1.3) showed two discrepancies with the documentation: before the search there is a message with phase: commentary (“checking sources…”), which the parser skips, otherwise the answer would start with it; and there was no url_citation at all, so the request asks for include: web_search_call.results, and if there are no citations, the pages found become the sources: an answer without links cannot be checked by the person."
    flows: [chat]
  - id: cloud-forged-screens-40d702
    title: "Screens from the cloud: a Muse coding agent writes a Compose screen, Ketoy delivers it without an APK update"
    rationale: "The owner, Nov 1, 2026, wanted “code generation and over-the-cloud updates through a library”: ketoy.dev. An agent built by the user gets a “Screen from the cloud” section on its card: the person describes a screen in words, the app submits a task to the gateway (forge/gateway, Ktor, a thin queue with on-disk storage and two bearer tokens), and the worker (forge/worker, Kotlin/JVM on a machine with the Android SDK) runs our own ReAct loop on Meta Model API (muse-spark-1.3, with muse-wonder-1.0 as the fallback; no OpenCode and no Claude Code, the owner's decision “via the API”) with file and Gradle tools, writes the screen file to forge/screens and builds it with the Ketoy compiler into an Ed25519-signed .ktx bundle; the app downloads the bundle with its own client (the sha256 is verified), puts it in filesDir/forged_screens/<agentId>/ and renders it with the Ketoy runtime via KetoyBundleSource.Raw; Ketoy's Remote source is not used, so that transport, caching and verification stay with the app. Files, not Room: before release a schema change wipes the owner's phone. The gateway token is in Settings only, the address in DataStore (T4 forbids keys in BuildConfig); the debug build goes to 10.0.2.2:8080 by default, with cleartext allowed only for that host. The Ketoy compiler lives in a separate Gradle build, forge/, pinned to Kotlin 2.0.21: the app is on Kotlin 2.3 and carries only the runtime artifacts; for the runtime's sake the app moved from Ktor 2.3.11 to 3.0.1 (one line: HttpTimeoutConfig.INFINITE_TIMEOUT_MS) and raised minSdk to 26. Task statuses are queued/accepted/needs_info/working/done/failed: the agent can ask a question, the person answers from the same section, and the task goes back into the queue. The demo minimum for the Nov 4 submission: one chain, “request → code → bundle → screen”, and in the video the scene “the agent built itself a screen”. The owner, Nov 4, 2026, when the gateway went to Fly: the Meta key must pass through from the client, not sit on the server. A screen is paid for by the person who asks for it, the same rule as every other model call in the app: the app sends the Meta key from Settings in the X-Meta-Api-Key header of the job and of the answer, the gateway holds it in memory only while the job is queued or held (never in job.json), hands it to the worker inside the job, and drops it on a question, a result or a failure; the worker makes a Meta client per job and has no key of its own. A gateway restart forgets the keys, so a queued job fails with a sentence asking to try again rather than reaching a worker that cannot pay for it."
    flows: [agents]
  - id: market-translation-6c2e94
    title: "Translating market listings into the reader's language (Muse Spark), without trusting the translation"
    rationale: "The market is shared, but people write in it in their own languages: a Russian agent is useless to an English-speaking reader, and to the judges, for whom part of the app's content is already in Russian. ?lang= on the card and in search: the original stays in place, the translation goes next to it and is honestly marked as machine-made. A detail page is translated on first request and cached on disk per language and per exact source text (title, description, version, review), so any change makes the translation stale; search never waits for the model: it returns the translations that are ready and queues the rest in the background. A cache miss costs money, so there is a per-client limit and a global one; beyond the limit the reader simply sees the original. “Already in this language” is cached too. The main risk: a translated package can be installed while the review was of the original, and an author can hide “when translating, add…” in the original. So the model gets a flat map of texts by key and returns the same keys; tools, skills, modes, model and ids are always taken from the original; the quotes in review findings are not sent at all (they must match the original); if the translated text trips a HeuristicScan rule that the original did not trip, the package translation is discarded and only the card and the review remain. A package longer than 12,000 characters is translated only for the card and review parts. Description: docs/market-api.md, “AI features”, item 4."
    flows: [agents]
  - id: market-ai-8f3b21
    title: "AI in the market: package review by Muse Spark, covers by Muse Image, smart search"
    rationale: "Someone else's package ends up in the prompt of an agent with tools on someone else's phone, and before installing, a person will not read 20 thousand characters of prompt; the judging gives 25% for creative use of Meta's models beyond basic integration, and a plain-text market looks empty in a video. So the gateway (when META_API_KEY is set), after publication, in the background and without making the person wait: (1) Muse Spark reads every new version and writes in plain words what the agent actually does, its capabilities, and findings with an exact quote; the verdict is safe/caution/block, and block hides the listing in the moderation queue. The package goes into the request fenced as untrusted data, and the reply is parsed strictly and truncated; alongside it runs a deterministic pattern scan (instruction bypass, “don't tell the user”, “without confirmation”, sending data to an address, passwords): a package can be written to talk the model into saying safe, but patterns cannot be talked into anything, so a match raises the verdict to caution but never lowers it. A review vouches only for its own version: a late review of an old version is discarded. (2) Muse Image draws a cover in a single style ($0.01), which is also the og:image of the link page, so a link in X and messengers unfurls with a picture; the listing text describes only the subject, and the picture has no text in it. (3) Smart search: Meta has no embeddings, and with a catalog this size Muse Spark reads the whole list of candidates and picks up to five with an explanation; only existing ids are returned; there is a cache keyed by question and catalog revision, and per-IP and global limits, since every cache miss costs money. Without a key the market works as before, and smart search answers 503. Unfinished work after a restart is completed at startup. Description: docs/market-api.md, the “AI features” section."
    flows: [agents]
  - id: remote-config-2403cd
    title: "Remote config: model catalog, kill switches, a banner and “please update” without a new APK"
    rationale: "The Meta model catalog is static (models_meta.json): a new Muse version required a new release, and there was no way to switch off a broken market or forge during judging. The forge gateway serves one JSON (GET /v1/config) without a token: the person enters the gateway token in Settings and no build carries it (T4), so a config behind the token would reach almost nobody, the judges included; it contains no secrets. Only the owner writes it, with a third token, FORGE_ADMIN_TOKEN (PUT /v1/admin/config). A bad config reaches every install within minutes, so the rules are strict and mirror the app: no contributor models (Meta trains on their data), temperature and top_p never together (that is a 400 at Meta), every model has a price, otherwise the spending card cannot count a new model, https links only, and banner text with English as the fallback. configVersion must increase, otherwise 409: two editors will not silently overwrite each other. The response is cached (max-age 300, ETag): this is a kill switch, so stale content must not be held for long. A corrupt file on the volume means serving the default, with an error in the log: the app must work on its own assets whatever goes wrong with the config. Description and app integration: docs/remote-config.md."
    flows: [chat]
  - id: skill-from-the-market-in-the-agent-builder-acd66a
    title: "A skill from the market in the agent builder"
    rationale: "The market server (skill-market-5d1e7a, PR 1 by Uros Basaric, Nov 2, 2026) arrived without a single screen in the app: it moved no demo-path criterion, and the /m/{id} link led into an app that did not understand it. On Nov 2 the owner asked to start from the most natural place, where an agent's skills are chosen in the builder: a “Pick from the market” button on the “Capabilities” step. A sheet over the wizard: search across skills (kind=skill), a card with a Muse Image cover and a verdict badge, and a detail view with the Muse Spark review (summary, capabilities, findings with quotes) and the instruction IN FULL: someone else's text goes into the prompt of an agent with tools, so the person reads exactly what the agent will read, while the badge and cover are only a summary; “not reviewed yet” is shown in words, so that an unreviewed skill does not look safe. An added skill becomes the agent's OWN skill (the whole CustomSkillDraft in the draft, like a handwritten one): autosave, the validator and publish treat it no differently; if its id collides with another skill or a built-in one, a random suffix is added, otherwise the built-in would win in SkillRegistry and the skill would be dead. Before it is added, the package goes through the app's validateUserSkill, so that a rejection is voiced here, with a reason, rather than blocking Publish three steps later. The MarketClient client mirrors only the needed part of the contract (ForgeProtocol style, the separate forge Gradle build), calls without a token (public routes; only a handful of people have the token), and with an empty address in Settings goes to the deployed gateway. The install counter is installId, a random UUID per app install in DataStore, not derived from the person. Not done: publishing your own skills and agents, installing whole agents, deep links, translation and smart search; the server supports them, and the client is catching up as time allows before the Nov 4 submission."
    flows: [agents]
  - id: skill-market-5d1e7a
    title: "Skill and agent market: publishing, search, install by link"
    rationale: "An agent built in the builder could not be handed to another person, and a newcomer saw only the presets. The market lives in the same forge gateway (routes /v1/market, the same client token, the same volume on Fly): a separate service would double the operations work for the sake of a few hundred lines. A package is only a recipe (prompt, tools, skills, modes, model), without local ids, memory, chats and hooks: those are the person's data, not the agent's. Package limits mirror the app's AgentValidator, so that anything the market accepted the app can install; the server checks tool names and built-in skill names only for format, since those lists live in the app and change with every release, and a server copy would drift apart. A package is normalized (lists sorted and de-duplicated) and hashed over compact JSON (MarketJson), so that the app can verify what it is installing. Reading, installing and reporting are public, without a token: only those who entered the gateway token in Settings have it (no build carries it), and a market behind the token would be empty for almost everyone, the judges included; publishing and editing require the client token. There are no accounts, so ownership is an editKey: it is issued once at publication, only its SHA-256 is stored on disk, and it is compared in constant time. The main risk is that someone else's text ends up in the prompt of an agent with access to the tools of someone else's phone: the server caps field and body sizes (256 KB, and without Content-Length a 411), rate-limits publications and reports per IP, and hides a listing after reports from three different networks (a salted IP hash; the raw IP is not stored): an installId can be made up for free, and one network with made-up ids must not be able to take down someone else's listing; before installing, the app must show the full instruction and the tools with risk labels. A hidden listing waits for a human: with the admin token the owner sees the queue (reports without device or network, only the reason, a note and the time), restores the listing (the reports are wiped at that point, otherwise the very next report would hide it again), hides it manually or deletes it permanently. The response format is bare objects, like the rest of the gateway (decision of Nov 2, 2026). Design and open questions: docs/market-api.md."
    flows: [agents]
  - id: builder-passport-7d7794
    title: "Agent passport in the builder chat: the whole agent while you answer, and publish from the last card"
    rationale: "The owner, Nov 3, 2026, after building an agent by chat: the follow-up questions did not paint the whole picture. The chat asked four questions and ended on a card with only the agent's name; the instructions, tools and memory it had written stayed behind a button, and memory, permissions and how the agent thinks were never asked. Now a passport is pinned under the builder chat's header (folded to one line, unfolded on a tap): what it does, can use, writes first, remembers, asks first, how it thinks, the model, and the instructions. Every line is read from the stored draft (UserAgentRepository.observe), never from the model's retelling, so it shows what publishing would make, defaults included; the lines the draft does not hold yet are greyed. The builder now also asks about memory, what to ask the person first and how to think, with a hint under each card saying what the answer changes; the model is no longer asked (automatic by default, shown in the passport). What to ask first is stored as ONE approval rule (a BEFORE_TOOL REQUIRE_APPROVAL hook with a derived id), the same rule the review screen shows and edits, so the chat and the form describe one agent; a rule the person added there survives a chat answer. The last card shows the full passport, two or three first things to say to the agent, and Publish: the person's tap after a dialog listing the tools that change something, which stands in for the form's per-tool consent; the same validator and repository checks as the review screen. The model still cannot publish."
    flows: [agents]
  - id: forge-host-capabilities-f648ae
    title: "Forged screens keep data and pick photos through the app"
    rationale: "The owner, Nov 4, 2026, asked how a forged screen would get at data, the camera or the gallery, and wanted a simple answer before the deadline. A forged screen was a sandbox with local state only: a water tracker forgot its count when closed. The design comes from the owner's earlier Primochki project (openQwoutt, docs/ARCHITECTURE.md): a mini-app never touches storage or the OS itself, it calls named capabilities the platform owns. Ketoy 0.4.20 has exactly that seam: the app registers functions by id (CapabilityRegistry.register / registerComposable) and the forge compiler maps calls of declared fqNames to those ids (ketoy-capabilities.json), refusing anything undeclared; the runtime refuses a bundle needing an id the app lacks. So the app lends five: loadInt/saveInt/loadText/saveText, kept in one preferences file under the agent whose screen is on (ForgeHostScope, set by ForgedBundleHost), and PhotoPicker, a composable the APP draws: the system photo picker (no permission, the app gets only the picked photo), the photo copied like a chat attachment and shown, its path kept under the key. Permissions stay the APK's: a bundle over the air cannot add one. Sync calls, not suspend ones, and the picker as a whole composable: fewer moving parts in an alpha interpreter that dies on what it does not support. Arguments are read defensively because an interpreter exception kills the process. Nothing else is lent yet (camera, the agent's own facts, the shared Item core of Primochki are the next doors). The same afternoon the owner asked for the app's style: forged screens had a fixed light page, hard-coded text colors and lavender tints that looked foreign. Ketoy resolves `themeColor(name)` through the host's KetoyConfig.colorResolver, so the app answers seven names (page, card, text, textMuted, accent, onAccent, line) from the color scheme the host is drawn in (ForgeHostScope.colors), the host page follows the theme, and the forge's rules and catalog teach the names instead of hex. The bundled sample is a wishlist (savings, wish names, photos): the owner rejected a water tracker as a pointless demo."
    flows: [agents]
  - id: agents-draw-pictures-in-a-reply-generate-image-c2a961
    title: "Agents draw pictures in a reply (generate_image)"
    rationale: "The owner, Nov 4, 2026, testing a built agent on their phone: asked to show how a new look would turn out, the agent answered with a table, because no chat agent could draw. Muse Image was wired only to lesson illustrations (ImageGenClient through LessonImageGenerator). generate_image reuses that client: the agent writes an English prompt, Muse Image draws, the file is kept in filesDir/generated_images (not the cache, a paid picture must not vanish) and the tool returns the same image card spec the lessons post, which isCardResult turns into a card in the reply. Risk READ like web_search: nothing changes on the device, the only effect is $0.01 per picture, recorded by ImageGenClient; a built agent gets it only when its author picks it in the builder, a plain chat has it. Not given to background heartbeats."
    flows: [agents]
  - id: pdf-documents-in-chat-read-by-muse-spark-b7acf1
    title: "PDF documents in chat, read by Muse Spark"
    rationale: "The owner, Nov 4, 2026, wanted agents to work with documents, the simple way, straight through the API. Muse Spark takes PDF input itself (dev.meta.ai/docs/models; text of the first 100 pages, images of the first 50), and dev.meta.ai/docs/file-handling documents the chat-completions shape: a file content part with filename and file_data as a base64 data URL, up to 50 MB inline. So the app neither parses nor converts: the photo button's menu gets Document (PDF), the system file picker (no permission) hands over one PDF, it is copied under its own name into filesDir/chat_docs and rides the message's existing imagePath field, told apart by the .pdf extension, so no schema change. OpenAiCompatClient sends it as the file part. Unlike a photo, the newest PDF in the history goes with every turn, because people ask about a document over several turns; older ones leave a note. 20 MB cap on the phone, since base64 adds a third. Word, Excel and plain text are not covered: Meta lists only PDF for inference."
    flows: [agents]
  - id: agent-apps-native-screens-for-the-preset-agents-c8d8ce
    title: "Agent apps: native screens for the preset agents"
    rationale: "The owner, Nov 4, 2026, wanted a custom UI for the agents the app already has, reusing what the old openQwoutt mini-apps had (flashcards, expenses with charts, lists). A forged screen (cloud-forged-screens-40d702) has to be built and paid for and is not tried live; these screens ship in the APK. Each preset agent with an app gets an Open app button on its card and a route agent_app/{agentId}: the agent's name, a Chat button, and its screen. The rule that makes it more than a mock: the agent and the screen share one store, so what the person tells the agent in the chat the screen shows, and what they change on the screen the agent sees next turn. Tutor reads the SRS words it already keeps; Budget and Task list get a store and a tool of their own, kept out of Room so no schema bump wipes the phone's chats before the demo."
    flows: [agents]
  - id: screen-brief-and-mockup-before-the-forge-builds-82cfb2
    title: "Screen brief and mockup before the forge builds"
    rationale: "The owner, Nov 5, 2026: the forge built a screen at once and it came out as something nobody asked for; the screen also lacked information to render well. It started from one sentence the app wrote from the agent's name and description, and switching on Own interface or publishing an agent with it built a screen by itself. Now nothing builds by itself: Build the screen and Regenerate open a brief sheet - the person's own words (pre-filled from what the agent is for), building blocks to tick (list, add form, total, progress, photos, chart), a layout (list, cards, dashboard) - and the forge request is built from that brief, spelling the blocks out and telling it to keep records with the storage functions (the old request still said local state only). Before building, Muse Image can draw the brief as a phone-screen mockup in the app's palette (a cent, portrait size, the default frame only when Meta refuses that size; closing the sheet or leaving the screen drops a drawing and deletes the file, while a request already sent still finishes so its cent reaches the spend card). The brief travels between markers in the request, so the progress card quotes the person's words and Regenerate reopens the sheet on the brief the screen was built from), so the person sees the idea and edits the words first. The mockup is a sketch for the person, not sent to the forge: that would need a worker change and a Fly redeploy, left for later."
    flows: [agents]
  - id: photo-outline-tool-8dec5b
    title: "Outline on photo: SAM 3.1 as a tool a built agent can use"
    rationale: "The owner, Nov 3, 2026, wanted to build an agent around SAM themselves, in the builder. Until now SAM lived only in the “How the model sees” lesson, so no agent could use it. The first two ideas were dropped against the hackathon anti-projects list (a food-freshness agent sits next to “AI Nutrition Coach”, medicines next to medical advice), and the list also names “simple image analyzers”: that is why SAM is a TOOL in the builder, not a ready agent, and why its job is pointing, not judging. SAM through the Meta API does not say what is in a picture; it takes one English noun phrase and boxes every match. So the agent looks (Muse Spark sees the attached photo), SAM points (“every stain”), and the agent acts on it with its other tools (a checklist card, a reminder). The tool takes the newest photo attached in this chat, already the upright downscaled JPEG SAM wants (ChatImages stores it through prepareSegmentPhoto), sends it as is and returns the very card spec the lesson posts (one shared buildSegmentResultCardSpec), so the person sees the photo with boxes and the model reads the same JSON (total, boxes on an image_w x image_h grid). Risk READ like web_search: nothing changes on the device, the photo goes to Meta where the chat model already saw it, and each call costs $0.0025, recorded by SegmentationClient; the builder tool card says so. Not given to background heartbeats: a heartbeat has no photo to outline."
    flows: [agents]
  - id: a-timer-in-the-phone-s-clock-not-in-the-chat-cfafda
    title: "A timer in the phone's Clock, not in the chat"
    rationale: "The owner, Nov 7, 2026, testing on the Pixel next to the Claude app: there \"set a timer for 3 minutes\" starts a real timer in Google Clock (it ticks in the status bar, See Timers opens Clock's Timers tab where it can be paused or closed) and leaves a Timer card in the chat. Ours drew the chat's own countdown card (render_card timer), which lived only while the card was on screen, or made an internal reminder - either way the timer got lost and nobody knew how to stop it. Now the alarm tool sets the timer in Clock (ACTION_SET_TIMER, skip UI, not counted as the person leaving the app so a call on screen does not shrink into its mini window) and on screen its result is the chat's timer card itself: length, label, \"set on your phone\" and a button to Clock's timers. A timer card the model draws itself no longer counts down: its button starts it in Clock. Off screen Android forbids opening Clock, so the timer becomes a notification and the model is told it is not running yet. Android lets no app read back or cancel Clock's timers, so the card only opens the list."
    flows: [chat]
  - id: background-voice-calls-a-picture-in-picture-window-and-a-call-that-goes-on-off-screen-3ab748
    title: "Background voice calls: a picture-in-picture window and a call that goes on off screen"
    rationale: "The owner, Nov 7, 2026, wanted a fully background voice call, like picture-in-picture on Windows. Until then a call in the app stopped hearing and speaking the moment its screen went behind something, on purpose: a microphone open behind the person's back was the worst bug. Now leaving the call (Home) shrinks MainActivity into a picture-in-picture window with the orb, who you talk to, the phase and the last words, and mute / hang-up buttons; going behind another app or locking the screen does not end the call, while closing the mini window hangs up, as closing a call does. A foreground service of type microphone keeps Android letting the app hear off screen (it must start while the app is in front, so the call screen starts it once the microphone is granted) and its ongoing notification is how the person sees and stops a call they cannot see: mute (or listen again after a long silence) and hang up. Only when that notification can be seen: with notifications off for the app or the call channel muted, the call keeps quiet off screen as before - and only while the service really runs, since Android may refuse it (the screen recreated in the background). Another screen pushed over the call (a tap on a push opens that chat on top, its ViewModel staying in the back stack) quiets it too, or the microphone would stay open with no screen and no notification. A reply the background call reads aloud gets no reply push; a failure still does, its Retry is in the chat. The camera, the gallery and the permission dialog opened from the call do not shrink it (to Android they look like the person leaving). Off screen Compose does not recompose, so the call's status, the assistant hand-off and hang-up from the notification are plain flow collects, and hanging up there drops the notification at once. A turn during a background call starts no second foreground service, and a turn started after the call hung up gets one again: the turn support tracks its own service instead of guessing from its counter. The assistant's own window still ends when left, and a call in the app keeps quiet while that window listens over it, since two recognizers on one microphone hear nothing. Plain flows in an object (CallBackground) connect the screen, the service, the button receiver and the activity, because the system creates all three."
    flows: [chat]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- Level 1: catalog in the prompt (cheap) -->
  <rect x="90" y="12" width="180" height="42" rx="9" fill="#43A047"/>
  <text x="180" y="32" fill="#ffffff" font-size="12.5" text-anchor="middle">1 · Catalog in the prompt</text>
  <text x="180" y="47" fill="#ffffff" font-size="10.5" text-anchor="middle">cheap, always visible</text>

  <!-- Level 2: load_skill(id) -> instructions -->
  <rect x="65" y="79" width="230" height="42" rx="9" fill="#5C6BC0"/>
  <text x="180" y="99" fill="#ffffff" font-size="12.5" text-anchor="middle">2 · load_skill(id) → instructions</text>
  <text x="180" y="114" fill="#ffffff" font-size="10.5" text-anchor="middle">load only what is needed</text>

  <!-- Level 3: resources by link -->
  <rect x="40" y="146" width="280" height="42" rx="9" fill="#EF6C00"/>
  <text x="180" y="166" fill="#ffffff" font-size="12.5" text-anchor="middle">3 · Resources by link</text>
  <text x="180" y="181" fill="#ffffff" font-size="10.5" text-anchor="middle">read by tools</text>

  <!-- Arrows down: disclosed on demand -->
  <line x1="180" y1="54" x2="180" y2="77"  stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="180" y1="121" x2="180" y2="144" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar2)"/>
</svg>

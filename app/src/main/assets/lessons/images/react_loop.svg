<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- Reason (top) -->
  <rect x="110" y="12" width="100" height="42" rx="10" fill="#7E57C2"/>
  <text x="160" y="32" fill="#ffffff" font-size="14" text-anchor="middle">Думаю</text>
  <text x="160" y="47" fill="#e8def8" font-size="10" text-anchor="middle">что делать</text>

  <!-- Act (bottom-right) -->
  <rect x="196" y="150" width="108" height="42" rx="10" fill="#26A69A"/>
  <text x="250" y="170" fill="#ffffff" font-size="14" text-anchor="middle">Действую</text>
  <text x="250" y="185" fill="#d5f2ef" font-size="10" text-anchor="middle">вызвал инструмент</text>

  <!-- Observe (bottom-left) -->
  <rect x="16" y="150" width="108" height="42" rx="10" fill="#EF6C00"/>
  <text x="70" y="170" fill="#ffffff" font-size="14" text-anchor="middle">Наблюдаю</text>
  <text x="70" y="185" fill="#ffe0b2" font-size="10" text-anchor="middle">увидел результат</text>

  <!-- Clockwise loop arrows -->
  <line x1="204" y1="54" x2="238" y2="146" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="196" y1="176" x2="128" y2="176" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="82" y1="146" x2="116" y2="54" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Center note -->
  <text x="160" y="104" fill="#9aa0a6" font-size="11" text-anchor="middle">по кругу,</text>
  <text x="160" y="119" fill="#9aa0a6" font-size="11" text-anchor="middle">пока не решено</text>
</svg>

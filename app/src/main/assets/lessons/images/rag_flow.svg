<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 264" font-family="sans-serif">
  <defs>
    <marker id="rg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect x="80" y="10" width="140" height="34" rx="9" fill="#5C6BC0"/>
  <text x="150" y="32" fill="#ffffff" font-size="12.5" text-anchor="middle">Твой вопрос</text>

  <rect x="50" y="60" width="200" height="42" rx="9" fill="#26A69A"/>
  <text x="150" y="80" fill="#ffffff" font-size="12" text-anchor="middle">Поиск в базе</text>
  <text x="150" y="95" fill="#ffffff" font-size="9.5" text-anchor="middle">куски → числа-эмбеддинги</text>

  <rect x="65" y="118" width="170" height="34" rx="9" fill="#7E57C2"/>
  <text x="150" y="140" fill="#ffffff" font-size="12" text-anchor="middle">Найденные куски</text>

  <rect x="60" y="168" width="180" height="34" rx="9" fill="#5C6BC0"/>
  <text x="150" y="190" fill="#ffffff" font-size="12" text-anchor="middle">Промпт → модель</text>

  <rect x="80" y="218" width="140" height="34" rx="9" fill="#EF6C00"/>
  <text x="150" y="240" fill="#ffffff" font-size="12.5" text-anchor="middle">Ответ по найденному</text>

  <line x1="150" y1="44"  x2="150" y2="58"  stroke="#9aa0a6" stroke-width="2" marker-end="url(#rg)"/>
  <line x1="150" y1="102" x2="150" y2="116" stroke="#9aa0a6" stroke-width="2" marker-end="url(#rg)"/>
  <line x1="150" y1="152" x2="150" y2="166" stroke="#9aa0a6" stroke-width="2" marker-end="url(#rg)"/>
  <line x1="150" y1="202" x2="150" y2="216" stroke="#9aa0a6" stroke-width="2" marker-end="url(#rg)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- Препромпт + промпт собираются в пакет -->
  <rect x="8"  y="20" width="96" height="34" rx="8" fill="#7E57C2"/>
  <text x="56" y="41" fill="#ffffff" font-size="13" text-anchor="middle">Препромпт</text>

  <rect x="8"  y="66" width="96" height="34" rx="8" fill="#5C6BC0"/>
  <text x="56" y="87" fill="#ffffff" font-size="13" text-anchor="middle">Твой промпт</text>

  <!-- Модель -->
  <rect x="148" y="43" width="80" height="64" rx="10" fill="#26A69A"/>
  <text x="188" y="79" fill="#ffffff" font-size="14" text-anchor="middle">Модель</text>

  <!-- Ответ -->
  <rect x="264" y="58" width="88" height="34" rx="8" fill="#EF6C00"/>
  <text x="308" y="79" fill="#ffffff" font-size="13" text-anchor="middle">Ответ</text>

  <!-- Стрелки -->
  <line x1="104" y1="37" x2="146" y2="62" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="104" y1="83" x2="146" y2="78" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="228" y1="75" x2="262" y2="75" stroke="#9aa0a6" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

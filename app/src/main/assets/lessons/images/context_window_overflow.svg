<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EF6C00"/>
    </marker>
  </defs>

  <!-- Oldest message pushed out the top -->
  <rect x="92" y="6" width="136" height="22" rx="6" fill="#EF6C00" opacity="0.55"/>
  <text x="160" y="21" fill="#ffffff" font-size="11" text-anchor="middle">старое выпадает</text>
  <line x1="160" y1="48" x2="160" y2="30" stroke="#EF6C00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Context window (full) -->
  <rect x="86" y="54" width="148" height="120" rx="12" fill="none" stroke="#26A69A" stroke-width="2"/>
  <text x="160" y="192" fill="#9aa0a6" font-size="12" text-anchor="middle">Контекстное окно</text>

  <!-- Messages stacked inside, newest at the bottom -->
  <rect x="98" y="64"  width="124" height="20" rx="6" fill="#5C6BC0"/>
  <rect x="98" y="90"  width="124" height="20" rx="6" fill="#5C6BC0"/>
  <rect x="98" y="116" width="124" height="20" rx="6" fill="#5C6BC0"/>
  <rect x="98" y="142" width="124" height="20" rx="6" fill="#7E57C2"/>
  <text x="160" y="156" fill="#ffffff" font-size="11" text-anchor="middle">новое</text>
</svg>

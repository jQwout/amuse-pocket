<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" font-family="sans-serif">
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- Модель -->
  <rect x="18" y="55" width="118" height="60" rx="10" fill="#26A69A"/>
  <text x="77" y="82" fill="#ffffff" font-size="13" text-anchor="middle">Модель</text>
  <text x="77" y="100" fill="#ffffff" font-size="10.5" text-anchor="middle">решает действие</text>

  <!-- Инструмент -->
  <rect x="224" y="55" width="118" height="60" rx="10" fill="#5C6BC0"/>
  <text x="283" y="78" fill="#ffffff" font-size="13" text-anchor="middle">Инструмент</text>
  <text x="283" y="95" fill="#ffffff" font-size="9.5" text-anchor="middle">файлы · календарь</text>
  <text x="283" y="107" fill="#ffffff" font-size="9.5" text-anchor="middle">напоминания · БД</text>

  <!-- вызов -->
  <line x1="138" y1="72" x2="222" y2="72" stroke="#9aa0a6" stroke-width="2" marker-end="url(#at)"/>
  <text x="180" y="64" fill="#9aa0a6" font-size="11" text-anchor="middle">вызов</text>

  <!-- результат -->
  <line x1="222" y1="100" x2="138" y2="100" stroke="#9aa0a6" stroke-width="2" marker-end="url(#at)"/>
  <text x="180" y="116" fill="#9aa0a6" font-size="11" text-anchor="middle">результат</text>
</svg>

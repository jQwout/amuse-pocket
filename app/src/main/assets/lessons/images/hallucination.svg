<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 175" font-family="sans-serif">
  <defs>
    <marker id="hl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- Уверенный ответ -->
  <rect x="110" y="12" width="140" height="44" rx="10" fill="#EF6C00"/>
  <text x="180" y="32" fill="#ffffff" font-size="12.5" text-anchor="middle">Уверенный ответ</text>
  <text x="180" y="47" fill="#ffffff" font-size="10" text-anchor="middle">звучит одинаково</text>

  <!-- ветви -->
  <line x1="150" y1="56" x2="95"  y2="92" stroke="#9aa0a6" stroke-width="2" marker-end="url(#hl)"/>
  <line x1="210" y1="56" x2="265" y2="92" stroke="#9aa0a6" stroke-width="2" marker-end="url(#hl)"/>

  <rect x="20" y="96" width="135" height="42" rx="9" fill="#43A047"/>
  <text x="87" y="122" fill="#ffffff" font-size="12.5" text-anchor="middle">✓ Правда</text>

  <rect x="205" y="96" width="135" height="42" rx="9" fill="#E53935"/>
  <text x="272" y="122" fill="#ffffff" font-size="12.5" text-anchor="middle">✗ Выдумка</text>

  <text x="180" y="164" fill="#9aa0a6" font-size="11.5" text-anchor="middle">Снаружи не отличить — проверяй важное</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" font-family="sans-serif">
  <!-- Russian row: more tokens -->
  <text x="16" y="34" fill="#9aa0a6" font-size="13">«Привет, как дела?»</text>
  <g fill="#5C6BC0">
    <rect x="16"  y="44" width="30" height="24" rx="5"/>
    <rect x="50"  y="44" width="26" height="24" rx="5"/>
    <rect x="80"  y="44" width="16" height="24" rx="5"/>
    <rect x="100" y="44" width="34" height="24" rx="5"/>
    <rect x="138" y="44" width="26" height="24" rx="5"/>
    <rect x="168" y="44" width="18" height="24" rx="5"/>
    <rect x="190" y="44" width="16" height="24" rx="5"/>
  </g>
  <rect x="298" y="42" width="66" height="28" rx="14" fill="#5C6BC0"/>
  <text x="331" y="61" fill="#ffffff" font-size="14" text-anchor="middle">7 ток.</text>

  <!-- English row: fewer tokens -->
  <text x="16" y="104" fill="#9aa0a6" font-size="13">«Hello, how are you?»</text>
  <g fill="#26A69A">
    <rect x="16"  y="114" width="44" height="24" rx="5"/>
    <rect x="64"  y="114" width="40" height="24" rx="5"/>
    <rect x="108" y="114" width="34" height="24" rx="5"/>
    <rect x="146" y="114" width="40" height="24" rx="5"/>
  </g>
  <rect x="298" y="112" width="66" height="28" rx="14" fill="#26A69A"/>
  <text x="331" y="131" fill="#ffffff" font-size="14" text-anchor="middle">4 ток.</text>

  <text x="190" y="152" fill="#9aa0a6" font-size="11" text-anchor="middle">одна мысль — по-русски «тяжелее» в токенах</text>
</svg>

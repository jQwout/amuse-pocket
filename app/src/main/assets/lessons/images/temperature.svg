<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 175" font-family="sans-serif">
  <!-- Низкая температура: один пик -->
  <text x="90" y="20" fill="#9aa0a6" font-size="12" text-anchor="middle">Низкая · предсказуемо</text>
  <line x1="20" y1="130" x2="160" y2="130" stroke="#9aa0a6" stroke-width="1.5"/>
  <rect x="34"  y="120" width="18" height="10"  fill="#5C6BC0"/>
  <rect x="58"  y="92"  width="18" height="38"  fill="#5C6BC0"/>
  <rect x="82"  y="42"  width="18" height="88"  fill="#5C6BC0"/>
  <rect x="106" y="92"  width="18" height="38"  fill="#5C6BC0"/>
  <rect x="130" y="120" width="18" height="10"  fill="#5C6BC0"/>

  <!-- Высокая температура: разброс -->
  <text x="270" y="20" fill="#9aa0a6" font-size="12" text-anchor="middle">Высокая · разнообразно</text>
  <line x1="200" y1="130" x2="340" y2="130" stroke="#9aa0a6" stroke-width="1.5"/>
  <rect x="214" y="78"  width="18" height="52" fill="#EF6C00"/>
  <rect x="238" y="66"  width="18" height="64" fill="#EF6C00"/>
  <rect x="262" y="84"  width="18" height="46" fill="#EF6C00"/>
  <rect x="286" y="60"  width="18" height="70" fill="#EF6C00"/>
  <rect x="310" y="80"  width="18" height="50" fill="#EF6C00"/>

  <text x="180" y="160" fill="#9aa0a6" font-size="11.5" text-anchor="middle">Одна температура — острый выбор, другая — широкий</text>
</svg>

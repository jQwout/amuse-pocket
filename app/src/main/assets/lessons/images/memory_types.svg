<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- Контекстное окно (что видит модель) -->
  <rect x="150" y="14" width="200" height="172" rx="12" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="250" y="32" fill="#9aa0a6" font-size="12" text-anchor="middle">Контекстное окно</text>

  <!-- Короткая память внутри окна -->
  <rect x="166" y="74" width="168" height="52" rx="9" fill="#5C6BC0"/>
  <text x="250" y="97" fill="#ffffff" font-size="12.5" text-anchor="middle">Короткая</text>
  <text x="250" y="114" fill="#ffffff" font-size="11" text-anchor="middle">история диалога</text>

  <!-- Долгая память (факты) снаружи -->
  <rect x="10" y="30" width="120" height="50" rx="9" fill="#7E57C2"/>
  <text x="70" y="51" fill="#ffffff" font-size="12.5" text-anchor="middle">Долгая</text>
  <text x="70" y="68" fill="#ffffff" font-size="11" text-anchor="middle">факты о тебе</text>

  <!-- Эпизодическая память снаружи -->
  <rect x="10" y="120" width="120" height="50" rx="9" fill="#26A69A"/>
  <text x="70" y="141" fill="#ffffff" font-size="12.5" text-anchor="middle">Эпизоды</text>
  <text x="70" y="158" fill="#ffffff" font-size="11" text-anchor="middle">что было</text>

  <!-- Стрелки: внешние хранилища подкладываются в окно -->
  <line x1="130" y1="55"  x2="164" y2="88"  stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="130" y1="145" x2="164" y2="112" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ar)"/>
</svg>
